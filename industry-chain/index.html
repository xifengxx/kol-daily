<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invest Wiki — AI产业链知识图谱</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root { --bg: #F5F5F7; --card: #FFFFFF; --border: #E5E5EA; --text: #1D1D1F; --text2: #86868B; --accent: #0071E3; --up: #FF3B30; --down: #34C759; --hover: #F5F5F7; --active: rgba(0,113,227,0.10); --l1:#94a3b8; --l2:#60a5fa; --l3:#4ade80; --l4:#fb923c; }
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;display:flex;min-height:100vh;}
.sidebar{width:220px;min-width:220px;background:var(--card);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:50;border-right:1px solid var(--border);}
.sidebar-logo{padding:20px 16px;font-size:16px;font-weight:700;border-bottom:1px solid var(--border);}
.sidebar-logo span{color:var(--accent);}
.industry-switcher{display:flex;gap:6px;padding:12px 16px;}
.ind-btn{padding:6px 14px;border-radius:16px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text2);transition:all .15s;font-family:inherit;}
.ind-btn:hover{border-color:var(--accent);color:var(--accent);}
.ind-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.sidebar-section{padding:8px 0;}
.sec-title{padding:12px 16px 4px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text2);}
.tree-layer-title{padding:6px 16px 2px;font-size:12px;font-weight:600;color:var(--text2);display:flex;align-items:center;gap:6px;}
.tree-item{padding:5px 16px 5px 36px;font-size:12px;cursor:pointer;color:var(--text2);transition:all .15s;border-left:3px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tree-item:hover{color:var(--text);background:var(--hover);}
.tree-item.active{color:var(--accent);background:var(--active);border-left-color:var(--accent);font-weight:500;}
.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;gap:16px;height:56px;flex-shrink:0;}
.bc{font-size:14px;color:var(--text2);}
.bc .active{color:var(--text);font-weight:500;}
.search{flex:1;max-width:480px;display:flex;align-items:center;background:var(--bg);border-radius:20px;padding:7px 16px;gap:8px;height:38px;border:1px solid transparent;transition:all .2s;position:relative;}
.search:focus-within{background:var(--card);border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,113,227,0.1);}
.search input{border:none;background:transparent;outline:none;flex:1;font-size:14px;color:var(--text);font-family:inherit;}
.search .s-icon-search{color:var(--text2);font-size:15px;flex-shrink:0;}
/* List view search */
.list-search-wrap{margin-bottom:20px;}
.list-search{width:100%;display:flex;align-items:center;background:var(--bg);border-radius:12px;padding:10px 16px;gap:10px;border:1px solid transparent;transition:all .2s;}
.list-search:focus-within{background:var(--card);border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,113,227,0.08);}
.list-search input{border:none;background:transparent;outline:none;flex:1;font-size:14px;color:var(--text);font-family:inherit;}
.list-search .ls-icon{color:var(--text2);font-size:16px;flex-shrink:0;}
.hot-tags{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px;}
.hot-tag{padding:4px 12px;border-radius:12px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text2);transition:all .15s;font-family:inherit;}
.hot-tag:hover{border-color:var(--accent);color:var(--accent);background:rgba(0,113,227,0.04);}
/* Knowledge dashboard */
.kb-two-col{display:flex;gap:16px;margin-bottom:16px;}
.kb-left{width:280px;flex-shrink:0;}
.kb-right{flex:1;}
.kb-tree-item{padding:7px 12px;cursor:pointer;border-radius:8px;font-size:12px;transition:all .15s;display:flex;align-items:center;gap:6px;}
.kb-tree-item:hover{background:var(--hover);}
.kb-tree-item.active{background:var(--active);color:var(--accent);font-weight:600;}
.kb-tree-folder{font-weight:600;color:var(--accent);font-size:13px;padding:5px 8px;}
.kb-tree-l1{padding-left:4px;}
.kb-tree-l2{padding-left:20px;font-size:12px;}
.kb-tree-l3{padding-left:36px;color:var(--text2);font-size:11px;}
.kb-tree-l4{padding-left:52px;color:#C7C7CC;font-size:10px;}
.quality-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px;}
.quality-table th{text-align:left;padding:8px 12px;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.03em;border-bottom:2px solid var(--border);background:var(--bg);}
.quality-table td{padding:8px 12px;border-bottom:1px solid var(--border);}
.quality-table tr:hover td{background:var(--bg);}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}
.status-active{background:#0071E3;}
.status-forming{background:#86868B;}
.status-confirmed{background:#34C759;}
.status-invalidated{background:#FF3B30;}
.stats{font-size:12px;color:var(--text2);}
.content{flex:1;display:flex;gap:16px;padding:16px;}
.center-col{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0;}
/* right-col removed */
.view-tabs{display:flex;gap:4px;background:var(--bg);border-radius:10px;padding:4px;width:fit-content;}
.view-tab{padding:7px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--text2);transition:all .2s;font-family:inherit;}
.view-tab:hover{color:var(--text);}
.view-tab.active{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08);}
.chart-box{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;position:relative;min-height:440px;overflow:hidden;}
.chart-box>div{width:100%;height:100%;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:16px;transition:all 0.3s ease;}
.card:hover{box-shadow:0 8px 32px rgba(0,0,0,0.08);}
.card-title{font-size:18px;font-weight:600;margin-bottom:12px;color:var(--text);letter-spacing:-0.01em;line-height:1.4;}
.hot-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px;cursor:pointer;}
.hot-item:hover{color:var(--accent);}
.hot-item:last-child{border-bottom:none;}
.hot-rank{width:20px;font-size:12px;font-weight:700;color:var(--text2);text-align:center;}
.hot-rank.r1,.hot-rank.r2,.hot-rank.r3{color:var(--accent);}
/* stat-row removed */
.stat-item{background:var(--bg);border-radius:8px;padding:10px;text-align:center;}
.stat-item .val{font-size:18px;font-weight:700;}
.stat-item .lbl{font-size:10px;color:var(--text2);margin-top:2px;}
.detail-view{display:none;padding:20px 24px;}
.detail-view.active{display:flex;flex-direction:column;gap:12px;}
.chart-view{display:flex;}
.chart-view.hidden{display:none;}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--accent);cursor:pointer;font-weight:500;margin-bottom:16px;}
.back-btn:hover{opacity:0.7;}
.detail-header h2{font-size:28px;font-weight:700;color:var(--text);letter-spacing:-0.02em;line-height:1.2;}
.detail-header .meta{font-size:14px;color:var(--text2);margin-top:6px;display:flex;gap:12px;align-items:center;}
.detail-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.ds-card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center;}
.ds-card .val{font-size:22px;font-weight:700;color:var(--text);}
.ds-card .lbl{font-size:11px;color:var(--text2);margin-top:4px;text-transform:uppercase;letter-spacing:0.03em;}
.detail-body{font-size:14px;line-height:1.8;color:var(--text);}
.wikilink{color:var(--accent);cursor:pointer;}
.wikilink:hover{text-decoration:underline;}
.link-list{display:flex;flex-direction:column;gap:4px;}
.link-item{padding:6px 0;border-bottom:1px solid var(--border);font-size:12px;cursor:pointer;display:flex;justify-content:space-between;}
.link-item:hover{color:var(--accent);}
.link-item:last-child{border-bottom:none;}
/* design-v3 relation styles */
.relation-item{display:flex;align-items:center;gap:12px;padding:10px 8px;border-bottom:1px solid var(--border);border-radius:8px;cursor:pointer;transition:background .15s ease,padding-left .15s ease;margin:0 -8px;}
.relation-item:last-child{border-bottom:none;}
.relation-item:hover{background:var(--hover);padding-left:12px;}
.relation-item:hover .relation-name{color:var(--accent);}
.relation-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.relation-info{flex:1;}
.relation-name{font-weight:600;color:var(--text);font-size:13px;transition:color .15s ease;}
.relation-desc{font-size:11px;color:var(--text2);margin-top:2px;}
.relation-tag{padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;flex-shrink:0;}
/* design-v3 evidence styles */
.evidence-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.evidence-item:last-child{border-bottom:none;}
.evidence-num{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.evidence-text{font-size:12px;color:var(--text2);line-height:1.6;flex:1;}
.evidence-text a{display:inline-block;color:var(--accent);text-decoration:none;font-size:11px;margin-top:4px;padding:2px 6px;border-radius:4px;transition:background .15s ease;}
.evidence-text a:hover{background:rgba(0,113,227,0.08);text-decoration:underline;}
.evidence-text strong{display:block;margin-bottom:2px;}
/* design-v3 trend cards */
.trend-card{padding:12px;background:var(--bg);border-radius:10px;margin-bottom:8px;}
.trend-card .trend-title{font-weight:600;font-size:13px;color:var(--text);margin-bottom:4px;}
.trend-card .trend-desc{font-size:12px;color:var(--text2);line-height:1.6;}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:500;height:20px;}
.tag-blue{background:var(--accent);color:#fff;}
.tag-green{background:var(--down);color:#fff;}
.tag-purple{background:#AF52DE;color:#fff;}
.tag-gray{background:var(--border);color:var(--text);}
.tag-orange{background:#FF9500;color:#fff;}
.flow-arrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 16px;background:var(--bg);border-radius:10px;}
.flow-step{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:12px;font-weight:500;cursor:help;transition:border-color .15s ease;}
.flow-step:hover{border-color:var(--accent);}
.flow-arr{color:var(--accent);font-weight:700;font-size:16px;}
.hl{color:var(--accent);font-weight:600;}
.hl-up{color:var(--up);font-weight:600;}
.hl-down{color:var(--down);font-weight:600;}
.comp-table{width:100%;border-collapse:collapse;font-size:13px;}
.comp-table th{text-align:left;padding:8px 10px;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.03em;border-bottom:2px solid var(--border);background:var(--bg);}
.comp-table td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
.comp-table td.col-desc{font-size:12px;color:var(--text2);line-height:1.6;}
.comp-table tr:hover td{background:var(--bg);}
.comp-table .td-name{font-weight:500;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis;}
.comp-table .td-share{white-space:nowrap;text-align:center;font-size:12px;}
.comp-table .td-badge{text-align:center;}
.role-tag{display:inline-block;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:500;}
.role-lead{background:#0071E3;color:#fff;}
.role-second{background:rgba(0,113,227,0.12);color:var(--accent);}
.role-concept{background:rgba(255,149,0,0.12);color:#FF9500;}
.bar-track{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin-top:4px;}
.bar-fill{height:100%;border-radius:4px;background:var(--accent);transition:width 0.6s ease;}
/* Design v3 — concept sections */
.concept-section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px;}
.concept-heading{font-weight:600;font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:6px;color:var(--text);}
.concept-heading .c-icon{font-size:16px;flex-shrink:0;}
.cs-purple{border-left:4px solid #5856D6;}
.cs-blue{border-left:4px solid #0071E3;}
.cs-green{border-left:4px solid #34C759;}
.cs-orange{border-left:4px solid #FF9500;}
.cs-teal{border-left:4px solid #5AC8FA;}
.cs-indigo{border-left:4px solid #5856D6;}
.cs-pink{border-left:4px solid #FF2D55;}
.cs-red{border-left:4px solid #FF3B30;}
.cs-amber{border-left:4px solid #FF9500;}
/* Design v3 — stock relation */
.relation-badge{display:inline-block;padding:0 8px;border-radius:10px;font-size:11px;font-weight:500;margin-left:4px;height:20px;line-height:20px;}
.relation-supplies{background:#F0F7FF;color:#0071E3;}
.relation-customer{background:#E8F5E9;color:#34C759;}
.relation-competes{background:#FFEBEE;color:#FF3B30;}
.relation-partners{background:#F3E5F5;color:#AF52DE;}
.chain-step{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:10px 14px;text-align:center;min-width:100px;transition:all 0.3s ease;}
.chain-step.highlight{border:2px solid #0071E3;background:#F0F7FF;}
.chain-step.current{box-shadow:0 4px 12px rgba(0,113,227,0.15);}
.chain-arrow{color:var(--accent);font-size:18px;font-weight:700;display:flex;align-items:center;}
.supply-group{padding:12px;background:var(--bg);border-radius:12px;margin-bottom:10px;}
.data-table{width:100%;border-collapse:collapse;font-size:14px;}
.data-table th{text-transform:uppercase;font-size:12px;color:var(--text2);font-weight:500;text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--bg);letter-spacing:0.02em;}
.data-table td{padding:10px 14px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums;}
.data-table tbody tr:hover{background:var(--bg);}
.company-header-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px 24px;margin-bottom:16px;}
/* Styled lists for concept content */
.styled-list{list-style:none;padding:0;margin:6px 0;}
.styled-list li{padding:7px 10px 7px 28px;position:relative;font-size:14px;line-height:1.6;border-bottom:1px solid var(--bg);}
.styled-list li:last-child{border-bottom:none;}
.styled-list.ordered li::before{content:counter(step)'.';counter-increment:step;position:absolute;left:6px;top:7px;font-weight:700;color:var(--accent);font-size:13px;}
.styled-list.ordered{counter-reset:step;}
.styled-list.unordered li::before{content:'•';position:absolute;left:10px;top:7px;font-weight:700;color:var(--accent);font-size:16px;}
/* Concept link cards */
.concept-link-grid{display:flex;flex-wrap:wrap;gap:8px;}
.concept-link-card{padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:8px;font-size:13px;}
.concept-link-card:hover{border-color:var(--accent);box-shadow:0 2px 8px rgba(0,113,227,0.1);transform:translateY(-1px);}
.concept-link-card .cl-name{font-weight:600;color:var(--text);}
.concept-link-card .cl-rel{color:var(--text2);font-size:11px;}

/* Sidebar Navigation (Design v3) */
.nav-section{padding:8px 0;}
.nav-title{padding:12px 16px 6px;color:var(--text2);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;}
.nav-item-side{padding:9px 16px;display:flex;align-items:center;gap:8px;color:var(--text2);cursor:pointer;font-size:13px;font-weight:500;border-left:2px solid transparent;transition:all 0.15s;text-decoration:none;}
.nav-item-side:hover{background:var(--hover);color:var(--text);}
.nav-item-side.active{background:var(--active);color:var(--accent);border-left-color:var(--accent);}
/* Search Dropdown */
#search-input{width:100%;border:none;background:transparent;outline:none;font-size:14px;color:var(--text);font-family:inherit;}
#search-drop{position:absolute;top:44px;left:50%;transform:translateX(-50%);width:480px;max-width:90vw;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,0.15);max-height:400px;overflow-y:auto;z-index:1000;}
.search-item{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--bg);font-size:13px;transition:background .1s;}
.search-item:last-child{border-bottom:none;}
.search-item:hover{background:var(--hover);}
.search-item.active{background:var(--active);}
.search-item .s-icon{font-size:14px;flex-shrink:0;}
.search-item .s-name{font-weight:600;color:var(--text);flex:1;}
.search-item .s-extra{font-size:11px;color:var(--text2);white-space:nowrap;}
.search-item .s-type-tag{font-size:9px;padding:1px 6px;border-radius:8px;font-weight:600;flex-shrink:0;}
.s-type-segment{background:#ede9fe;color:#7c3aed;}
.s-type-company{background:#dbeafe;color:#2563eb;}
.s-type-concept{background:#dcfce7;color:#16a34a;}
.s-type-thesis{background:#fef3c7;color:#d97706;}
.search-empty{padding:20px;text-align:center;color:var(--text2);font-size:13px;}
/* Industry tabs in sidebar */
.ind-tab-side{padding:5px 12px;border:1px solid var(--border);border-radius:14px;cursor:pointer;font-size:11px;color:var(--text2);font-weight:500;transition:all .15s;background:var(--card);font-family:inherit;}
.ind-tab-side:hover{border-color:var(--accent);color:var(--accent);}
.ind-tab-side.active{background:var(--accent);color:#fff;border-color:var(--accent);}
/* Tree panel in content area */
.tree-panel{background:var(--card);overflow-y:auto;flex-shrink:0;}


/* Content area: tree + main content side by side */
.content-row{display:flex;flex:1;min-height:0;}
.content-main{flex:1;display:flex;flex-direction:column;min-width:0;overflow-y:auto;}
</style></head>
<body>
<aside class="sidebar">
<div class="sidebar-logo">Invest<span>Wiki</span></div>
<div class="nav-section">
<div class="nav-title">产业链与知识</div>
<div class="nav-item-side active" data-view="chart" onclick="switchView('chart')">📊 产业链图谱</div>
<div class="nav-item-side" data-view="segment" onclick="switchView('segment')">📋 赛道分析</div>
<div class="nav-item-side" data-view="company" onclick="switchView('company')">🏢 个股关联</div>
<div class="nav-item-side" data-view="concept" onclick="switchView('concept')">💡 概念卡片</div>
<div class="nav-item-side" data-view="thesis" onclick="switchView('thesis')">📝 论点</div>
<div class="nav-item-side" data-view="knowledge" onclick="switchView('knowledge')">📚 知识库</div>
<div class="nav-item-side" data-view="graph" onclick="switchView('graph')">🔮 可视化图谱</div>
</div>
</aside>
<div class="main">
<div class="topbar">
<div class="bc" id="bc"><span class="active">产业链全景</span></div>
<div class="search" id="topSearch" style="margin:0 auto;">
<svg class="s-icon-search" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
<input id="search-input" type="text" placeholder="搜索赛道/公司/概念/论点..." autocomplete="off">
<div id="search-drop" style="display:none;position:absolute;top:44px;left:50%;transform:translateX(-50%);width:480px;max-width:90vw;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,0.15);max-height:400px;overflow-y:auto;z-index:1000;"></div>
</div>
<div class="stat-bar" id="st" style="flex-shrink:0;"></div>
</div>
<div class="content-row">
<div class="content-main" id="contentMain" style="padding:0;">
<div class="center-col chart-view" id="cv" style="padding:20px 20px 12px;gap:0;">
<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:4px;">
<div><div style="font-size:20px;font-weight:700;color:var(--text);letter-spacing:-0.01em;">产业链图谱</div>
<div style="font-size:12px;color:var(--text2);margin-top:2px;">投资知识图谱 · <span id="chartStats">74赛道 / 398公司 / 5概念</span></div>
</div>
<div style="display:flex;gap:6px;align-items:center;" id="chartTags">
<span class="tag tag-blue">置信度:高</span><span class="tag tag-gray">来源:5-8条</span>
</div>
</div>
<div style="display:flex;gap:6px;margin-bottom:8px;" id="ib"></div>
<div class="view-tabs" id="vt" style="margin-bottom:10px;">
<button class="view-tab active" data-v="treemap">📊 Treemap 规模</button>
<button class="view-tab" data-v="graph">🔗 关系网络</button>
<button class="view-tab" data-v="sankey">🌊 Sankey 流向</button>
<button class="view-tab" data-v="causal">⚡ 因果传导</button>
</div>
<div style="display:flex;height:calc(100vh - 290px);min-height:0;gap:20px;margin-bottom:50px;">
<div id="treePanel" style="display:flex;flex-direction:column;width:250px;min-width:250px;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;">
<div id="tree" style="flex:1;overflow-y:auto;padding:12px 16px;"></div>
</div>
<div style="flex:1;display:flex;flex-direction:column;min-width:0;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;padding:8px 12px 12px;">
<div class="chart-box" style="flex:1;border:none;border-radius:0;min-height:0;background:transparent;"><div id="mc"></div></div>
<div style="font-size:11px;color:var(--text2);text-align:center;padding:8px 0 0;flex-shrink:0;" id="chint">点击 Treemap 节点查看赛道详情</div>
</div>
</div>
</div>
<div class="center-col detail-view" id="dv"></div>
</div>
</div>
</div>
<script>
var DATA = null;

var ci='AI算力', cv='treemap', ch=null, cs=null, gh=null;

function gs(ind){ if(!DATA) return []; return DATA.entities.filter(function(e){return e.type==='segment'&&e.industry===ind;}); }
function gn(n){ if(!DATA) return null; return DATA.entities.find(function(e){return e.name===n;}); }
function gl(s){ if(!DATA) return null; return DATA.entities.find(function(e){return e.slug===s;}); }
// View switching (nav items)
var currentView='chart';
function switchView(view){
  if(!DATA) return;
  currentView=view;
  document.querySelectorAll('.nav-item-side').forEach(function(el){el.classList.toggle('active',el.getAttribute('data-view')===view);});
  var bc=document.getElementById('bc');
  var labels={chart:'产业链图谱',segment:'赛道分析',company:'个股关联',concept:'概念卡片',thesis:'论点',knowledge:'知识库',graph:'可视化图谱'};
  bc.innerHTML='<span class="active">'+labels[view]+'</span>';
  // Hide all
  document.getElementById('cv').style.display='none';
  document.getElementById('dv').style.display='none';
  cs=null;
  // Route
  if(view==='chart'){
    document.getElementById('cv').style.display='flex';
    initIndustryTabs();
    updateChartStats();
    renderView();buildTree();
  } else if(view==='graph'){
    renderGraphView();
  } else if(view==='segment'){renderSegmentList();}
  else if(view==='company'){renderCompanyList();}
  else if(view==='concept'){renderConceptList();}
  else if(view==='thesis'){renderThesisList();}
  else if(view==='knowledge'){renderKnowledge();}
}
function updateChartStats(){
  var tc=DATA.by_type; var el=document.getElementById('chartStats');
  if(el) el.textContent=tc.segment+'赛道 / '+tc.company+'公司 / '+(tc.concept||0)+'概念 / '+(tc.thesis||0)+'论点';
}
function initIndustryTabs(){
  var ibEl=document.getElementById('ib');
  if(!ibEl||ibEl.children.length>0) return;
  ibEl.innerHTML=['AI算力','半导体'].map(function(ind,i){return '<button class="ind-tab-side'+(i===0?' active':'')+'" data-i="'+ind+'">'+ind+'</button>';}).join('');
  ibEl.addEventListener('click',function(e){var b=e.target.closest('.ind-tab-side');if(!b)return;document.querySelectorAll('#ib .ind-tab-side').forEach(function(x){x.classList.remove('active');});b.classList.add('active');ci=b.dataset.i;buildTree();renderView();});
}
function renderKnowledge(){
  var h='<h2 style="font-size:28px;font-weight:700;letter-spacing:-0.02em;margin-bottom:4px;">📚 知识库仪表盘</h2>';
  h+='<p style="font-size:14px;color:var(--text2);margin-bottom:20px;">四层LLM-Wiki架构 · AI算力+半导体 · QA v1.0</p>';
  var tc=DATA.by_type; var allE=DATA.entities;
  var totalLinks=0; var orphans=0;
  allE.forEach(function(e){totalLinks+=(e.wikilinks||[]).length;if((e.backlinks||0)===0&&e.type==='segment')orphans++;});
  totalLinks=Math.floor(totalLinks/2);
  // Stats grid - 6 cards
  h+='<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:20px;">';
  h+='<div class="card" style="text-align:center;padding:20px 12px;"><div style="font-size:32px;font-weight:700;color:var(--accent);">'+DATA.total+'</div><div style="font-size:12px;color:var(--text2);margin-top:4px;">总词条</div></div>';
  h+='<div class="card" style="text-align:center;padding:20px 12px;"><div style="font-size:32px;font-weight:700;color:var(--accent);">'+tc.segment+'</div><div style="font-size:12px;color:var(--text2);margin-top:4px;">赛道</div></div>';
  h+='<div class="card" style="text-align:center;padding:20px 12px;"><div style="font-size:32px;font-weight:700;color:var(--accent);">'+tc.company+'</div><div style="font-size:12px;color:var(--text2);margin-top:4px;">公司</div></div>';
  h+='<div class="card" style="text-align:center;padding:20px 12px;"><div style="font-size:32px;font-weight:700;color:var(--accent);">'+(tc.concept||0)+'</div><div style="font-size:12px;color:var(--text2);margin-top:4px;">概念</div></div>';
  h+='<div class="card" style="text-align:center;padding:20px 12px;"><div style="font-size:32px;font-weight:700;color:var(--accent);">'+(tc.thesis||0)+'</div><div style="font-size:12px;color:var(--text2);margin-top:4px;">论点</div></div>';
  h+='<div class="card" style="text-align:center;padding:20px 12px;"><div style="font-size:32px;font-weight:700;color:#FF9500;">'+totalLinks+'</div><div style="font-size:12px;color:var(--text2);margin-top:4px;">链接</div></div>';
  h+='</div>';
  // Two columns: tree left + content right
  h+='<div class="kb-two-col">';
  // Left: Knowledge tree
  h+='<div class="kb-left"><div class="card" style="max-height:800px;overflow-y:auto;"><div class="card-title">知识库结构</div><div id="kbTree"></div></div></div>';
  // Right: Content panel
  h+='<div class="kb-right"><div class="card" style="max-height:800px;overflow-y:auto;"><div id="kbContent"></div></div></div>';
  h+='</div>';
  // Pipeline below KB structure
  h+='<div class="card" style="margin-bottom:16px;"><div class="card-title">知识沉淀流水线</div>';
  var steps=[{n:'L0',t:'原始资料池',d:'研报·财报·新闻 · LLM只读不写'},{n:'L1',t:'Schema & Pipeline',d:'Collector·Lint·Link-Enrich'},{n:'L2',t:'结构化Wiki',d:'YAML+MD+[[wikilink]] → JSON'},{n:'L3',t:'网页产物',d:'SPA知识图谱 · 4图+详情'}];
  h+='<div style="display:flex;align-items:center;justify-content:center;gap:0;padding:16px 0;">';
  steps.forEach(function(s,i){
    if(i>0) h+='<span style="color:var(--accent);font-size:20px;font-weight:700;padding:0 8px;">→</span>';
    h+='<div class="chain-step" style="flex:1;max-width:180px;padding:16px 12px;"><div style="font-size:12px;font-weight:700;color:var(--accent);margin-bottom:4px;">'+s.n+'</div><div style="font-size:13px;font-weight:600;">'+s.t+'</div><div style="font-size:11px;color:var(--text2);margin-top:4px;">'+s.d+'</div></div>';
  });
  h+='</div></div>';
  // Quality section below
  h+='<div class="card" style="margin-bottom:16px;"><div class="card-title">复盘验证引擎</div>';
  // 1. Quality table first (full width)
  h+='<div style="font-size:13px;font-weight:600;margin-bottom:8px;">六维知识质量</div>';
  h+='<table class="quality-table" style="margin-bottom:16px;"><thead><tr><th>维度</th><th>指标</th><th>状态</th><th>说明</th></tr></thead><tbody>';
  var totalCtr=0,unresolvedCtr=0;
  allE.filter(function(e){return e.type==='segment';}).forEach(function(s){(s.contradictions||[]).forEach(function(c){totalCtr++;if(c.status==='unresolved')unresolvedCtr++;});});
  var ci=DATA.concept_index||{}; var coveredSegs=Object.keys(ci).length;
  var rows=[
    {dim:'完整性',metric:DATA.total+' / 491',status:totalCtr===0?'✅':'⚠️',desc:'知识库总词条数'},
    {dim:'一致性',metric:unresolvedCtr+' 条矛盾未解决',status:unresolvedCtr===0?'✅':unresolvedCtr<3?'⚠️':'🔴',desc:'矛盾追踪与解决状态'},
    {dim:'时效性',metric:'QA v1.0',status:'✅',desc:'最近更新: 2026-07'},
    {dim:'链接密度',metric:(tc.segment>0?(totalLinks/tc.segment).toFixed(1):'0')+' 边/赛道',status:totalLinks>100?'✅':'⚠️',desc:'知识网络连通性'},
    {dim:'概念覆盖',metric:coveredSegs+'/'+tc.segment+' 赛道',status:coveredSegs>=5?'✅':'⚠️',desc:'概念卡片覆盖赛道比例'},
    {dim:'孤立节点',metric:orphans+' 条',status:orphans===0?'✅':orphans<5?'⚠️':'🔴',desc:'无引用的孤立赛道数'}
  ];
  rows.forEach(function(r){h+='<tr><td style="font-weight:600;">'+r.dim+'</td><td>'+r.metric+'</td><td style="text-align:center;font-size:16px;">'+r.status+'</td><td style="font-size:11px;color:var(--text2);">'+r.desc+'</td></tr>';});
  h+='</tbody></table>';
  // 2. Status distribution (full width stacked bar)
  h+='<div style="font-size:13px;font-weight:600;margin-bottom:8px;">论点状态分布</div>';
  var thesisStats={active:0,forming:0,confirmed:0,invalidated:0};
  allE.filter(function(e){return e.type==='thesis';}).forEach(function(t){var s=t.thesis_status||'forming';thesisStats[s]=(thesisStats[s]||0)+1;});
  var tlabs={active:'活跃',forming:'形成中',confirmed:'已确认',invalidated:'已失效'};
  var tcols={active:'#0071E3',forming:'#86868B',confirmed:'#34C759',invalidated:'#FF3B30'};
  var totalThesis=Math.max((tc.thesis||1),1);
  h+='<div style="height:28px;background:#F5F5F7;border-radius:14px;overflow:hidden;display:flex;margin-bottom:10px;">';
  Object.keys(tlabs).forEach(function(k){
    var cnt=thesisStats[k]||0; var pct=Math.round(cnt/totalThesis*100);
    if(cnt>0) h+='<div style="height:100%;background:'+tcols[k]+';width:'+pct+'%;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:600;" title="'+tlabs[k]+': '+cnt+'条">'+cnt+'</div>';
  });
  h+='</div>';
  h+='<div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;font-size:11px;">';
  Object.keys(tlabs).forEach(function(k){h+='<span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+tcols[k]+';margin-right:4px;"></span>'+tlabs[k]+' ('+(thesisStats[k]||0)+')</span>';});
  h+='</div>';
  // 3. Thesis list
  h+='<div style="border-top:1px solid var(--border);padding-top:12px;">';
  h+='<div style="font-size:13px;font-weight:600;margin-bottom:8px;">论点列表 ('+ (tc.thesis||0) +'条)</div>';
  h+='<div id="thesisTableBody"></div>';
  h+='</div>';
  h+='</div>';
  // Maintenance mode
  h+='<div class="card"><div class="card-title">维护模式</div>';
  h+='<div style="display:flex;gap:12px;"><div style="flex:1;padding:14px;background:#F5F5F7;border-radius:8px;"><b style="color:var(--accent);">🔄 采集模式</b><div style="font-size:12px;color:var(--text2);margin-top:4px;">ingest → 实体提取 → 消化笔记 → 赛道更新</div></div><div style="flex:1;padding:14px;background:#F5F5F7;border-radius:8px;"><b style="color:#AF52DE;">🔍 提炼模式</b><div style="font-size:12px;color:var(--text2);margin-top:4px;">Lint扫描 → thesis审核 → 矛盾解决 → 链接增强</div></div></div>';
  h+='<div style="margin-top:10px;padding:10px 12px;background:#F0F7FF;border-radius:8px;font-size:11px;color:var(--text2);">触发：每10次ingest / 用户说refine / Lint发现≥5个问题 → Refinement报告</div>';
  h+='</div>';
  // Quick links
  h+='<div class="card" style="margin-top:16px;"><div class="card-title">快捷入口</div>';
  h+='<div style="display:flex;gap:16px;flex-wrap:wrap;font-size:13px;">';
  ['chart','segment','company','concept','thesis'].forEach(function(v){
    var icons={chart:'📊',segment:'📋',company:'🏢',concept:'💡',thesis:'📝'};
    var labels={chart:'产业链图谱',segment:'赛道分析',company:'个股关联',concept:'概念卡片',thesis:'论点'};
    h+='<span style="cursor:pointer;color:var(--accent);" onclick="switchView(\''+v+'\')">'+icons[v]+' '+labels[v]+'</span>';
  });
  h+='</div></div>';
  document.getElementById('dv').innerHTML=h;
  document.getElementById('dv').style.display='flex';
  // Build knowledge tree
  _buildKbTree(allE);
  _showKbOverview(allE, tc);
  _renderThesisTable();
}
function _buildKbTree(allE){
  // 4-level tree: Industry → Layer → Segment → Companies
  var inds={};
  allE.filter(function(e){return e.type==='segment';}).forEach(function(e){
    var ind=e.industry||'其他';if(!inds[ind])inds[ind]={};
    var l='L'+(e.layer||'?');if(!inds[ind][l])inds[ind][l]=[];
    inds[ind][l].push(e);
  });
  var h='<div class="kb-tree-folder" onclick="_showKbOverview(DATA.entities,DATA.by_type)">📊 知识库总览</div>';
  var layerNames={L1:'原材料与资源',L2:'设备与零部件',L3:'核心产品与集成',L4:'终端应用与服务'};
  var lcColors={L1:'#94a3b8',L2:'#60a5fa',L3:'#4ade80',L4:'#fb923c'};
  var lcIcons={L1:'📦',L2:'🔧',L3:'⚙️',L4:'🚀'};
  var treeId=0;
  Object.keys(inds).sort().forEach(function(ind){
    var indId='kb_'+ind.replace(/[^a-zA-Z]/g,'');
    h+='<div style="font-weight:700;color:var(--accent);font-size:13px;padding:6px 8px 2px;cursor:pointer;" onclick="var e=document.getElementById(\'kb_children_'+indId+'\');e.style.display=e.style.display===\'none\'?\'block\':\'none\';this.textContent=this.textContent.replace(\'▸\',\'▾\').replace(\'▾\',e.style.display===\'none\'?\'▸\':\'▾\');" id="kb_ind_'+indId+'">▾ 📁 '+ind+'</div>';
    h+='<div id="kb_children_'+indId+'" style="display:block;">';
    Object.keys(inds[ind]).sort().forEach(function(l){
      var segs=inds[ind][l]; segs.sort(function(a,b){return (b.tam||0)-(a.tam||0);});
      var layId='kb_lay_'+indId+'_'+l;
      h+='<div style="font-weight:600;font-size:12px;padding:4px 8px 2px 22px;cursor:pointer;color:var(--text);" onclick="var e=document.getElementById(\'kb_segs_'+layId+'\');e.style.display=e.style.display===\'none\'?\'block\':\'none\';this.textContent=this.textContent.replace(\'▸\',\'▾\').replace(\'▾\',e.style.display===\'none\'?\'▸\':\'▾\');" id="kb_laybtn_'+layId+'">▾ '+lcIcons[l]+' '+layerNames[l]+' <span style="font-weight:400;font-size:10px;color:var(--text2);">('+segs.length+')</span></div>';
      h+='<div id="kb_segs_'+layId+'" style="display:block;">';
      segs.forEach(function(s){
        h+='<div style="font-size:11px;padding:2px 8px 2px 38px;cursor:pointer;color:var(--text2);" onclick="_showKbSegment(\''+s.slug+'\')"><span style="width:5px;height:5px;border-radius:50%;background:'+lcColors[l]+';display:inline-block;margin-right:6px;"></span>'+s.name+'</div>';
      });
      h+='</div>';
    });
    h+='</div>';
  });
  document.getElementById('kbTree').innerHTML=h;
}
function _showKbOverview(allE, tc){
  var h='<div class="card-title">知识库总览</div>';
  h+='<p style="font-size:13px;color:var(--text2);margin-bottom:16px;">共 '+DATA.total+' 词条，覆盖 AI算力 + 半导体 两大产业链</p>';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;">';
  h+='<div style="padding:10px;background:var(--bg);border-radius:8px;"><b style="color:var(--accent);">'+tc.segment+'</b> 赛道</div>';
  h+='<div style="padding:10px;background:var(--bg);border-radius:8px;"><b style="color:var(--accent);">'+tc.company+'</b> 公司</div>';
  h+='<div style="padding:10px;background:var(--bg);border-radius:8px;"><b style="color:var(--accent);">'+(tc.concept||0)+'</b> 概念</div>';
  h+='<div style="padding:10px;background:var(--bg);border-radius:8px;"><b style="color:var(--accent);">'+(tc.thesis||0)+'</b> 论点</div>';
  h+='</div>';
  // Recent theses summary
  var theses=DATA.entities.filter(function(e){return e.type==='thesis';});
  if(theses.length){
    h+='<div style="font-size:13px;font-weight:600;margin-bottom:8px;">最近论点</div>';
    theses.slice(0,5).forEach(function(t){
      var sl={active:'活跃',forming:'形成中',confirmed:'已确认',invalidated:'已失效'};
      h+='<div style="font-size:12px;padding:4px 0;color:var(--text2);">• '+t.name+' <span style="font-size:10px;color:var(--accent);">'+ (sl[t.thesis_status]||t.thesis_status)+'</span></div>';
    });
  }
  document.getElementById('kbContent').innerHTML=h;
}
function _showKbIndustry(ind){
  var segs=DATA.entities.filter(function(e){return e.type==='segment'&&e.industry===ind;});
  var h='<div class="card-title">📁 '+ind+'</div>';
  h+='<p style="font-size:13px;color:var(--text2);margin-bottom:12px;">'+segs.length+' 条赛道 · 四层产业链结构</p>';
  segs.sort(function(a,b){return (a.layer||0)-(b.layer||0)||(b.tam||0)-(a.tam||0);});
  h+='<table class="quality-table"><thead><tr><th>赛道</th><th>层级</th><th>TAM</th><th>CAGR</th><th>引用</th></tr></thead><tbody>';
  segs.forEach(function(s){
    h+='<tr><td style="cursor:pointer;color:var(--accent);font-weight:500;" onclick="openDetail(\''+s.slug+'\')">'+s.name+'</td><td>L'+(s.layer||'?')+'</td><td>$'+(s.tam||0)+'B</td><td>'+(s.cagr||0)+'%</td><td>'+s.backlinks+'</td></tr>';
  });
  h+='</tbody></table>';
  document.getElementById('kbContent').innerHTML=h;
}
function _showKbLayer(ind, layer){
  var segs=DATA.entities.filter(function(e){return e.type==='segment'&&e.industry===ind&&'L'+(e.layer||'?')===layer;});
  var layerNames={L1:'原材料与资源',L2:'设备与零部件',L3:'核心产品与集成',L4:'终端应用与服务'};
  var h='<div class="card-title">'+layer+' · '+layerNames[layer]+'</div>';
  h+='<p style="font-size:13px;color:var(--text2);margin-bottom:12px;">'+ind+' · '+segs.length+' 条赛道</p>';
  segs.sort(function(a,b){return (b.tam||0)-(a.tam||0);});
  h+='<table class="quality-table"><thead><tr><th>赛道</th><th>TAM</th><th>CAGR</th><th>利润率</th><th>引用</th></tr></thead><tbody>';
  segs.forEach(function(s){
    h+='<tr><td style="cursor:pointer;color:var(--accent);font-weight:500;" onclick="openDetail(\''+s.slug+'\')">'+s.name+'</td><td>$'+(s.tam||0)+'B</td><td>'+(s.cagr||0)+'%</td><td>'+(s.margin||'—')+'</td><td>'+s.backlinks+'</td></tr>';
  });
  h+='</tbody></table>';
  document.getElementById('kbContent').innerHTML=h;
}
function _showKbSegment(slug){
  var s=gl(slug); if(!s) return;
  var h='<div class="card-title" style="cursor:pointer;color:var(--accent);" onclick="openDetail(\''+slug+'\')">'+s.name+' 赛道详情</div>';
  h+='<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">';
  h+='<span class="tag tag-blue">L'+(s.layer||'?')+'</span><span class="tag tag-gray">'+(s.industry||'')+'</span>';
  if(s.tam) h+='<span class="tag tag-green">TAM $'+s.tam+'B</span>';
  if(s.cagr) h+='<span class="tag tag-purple">CAGR '+s.cagr+'%</span>';
  if(s.margin&&s.margin!=='None') h+='<span class="tag tag-orange">利润率 '+s.margin+'</span>';
  h+='</div>';
  if(s.description){

// Markdown → HTML 渲染器（处理表格、粗体、列表、引用）
function renderMD(text){
  if(!text) return '';
  var h='', lines=text.split('\n'), i=0, inTable=false, inList=false, listType='';
  while(i<lines.length){
    var l=lines[i].trim();
    // Empty line
    if(!l){ if(inTable){h+='</tbody></table>'; inTable=false;} if(inList){h+=(listType==='ul'?'</ul>':'</ol>'); inList=false;} i++; h+='<br>'; continue; }
    // Table row
    if(l.indexOf('|')===0 && l.lastIndexOf('|')===l.length-1){
      if(!inTable){h+='<table class="data-table"><tbody>'; inTable=true;}
      var cells=l.split('|').slice(1,-1);
      if(cells.length>0 && cells[0].replace(/[-:\s]+/g,'')===''){ i++; continue; } // skip separator row
      h+='<tr>';
      cells.forEach(function(c){ var tag=inTable&&h.indexOf('<tr>')===h.lastIndexOf('<tr>')?'th':'td'; h+='<'+tag+'>'+renderMDInline(c.trim())+'</'+tag+'>'; });
      h+='</tr>'; i++; continue;
    }
    if(inTable){h+='</tbody></table>'; inTable=false;}
    // Unordered list
    if(/^[-*]\s/.test(l)){
      if(!inList||listType!=='ul'){ if(inList){h+=(listType==='ul'?'</ul>':'</ol>');} h+='<ul class="styled-list unordered">'; inList=true; listType='ul'; }
      h+='<li>'+renderMDInline(l.replace(/^[-*]\s+/,''))+'</li>'; i++; continue;
    }
    // Ordered list
    if(/^\d+\.\s/.test(l)){
      if(!inList||listType!=='ol'){ if(inList){h+=(listType==='ul'?'</ul>':'</ol>');} h+='<ol class="styled-list ordered">'; inList=true; listType='ol'; }
      h+='<li>'+renderMDInline(l.replace(/^\d+\.\s+/,''))+'</li>'; i++; continue;
    }
    if(inList){h+=(listType==='ul'?'</ul>':'</ol>'); inList=false;}
    // Blockquote
    if(l.indexOf('> ')==0){ h+='<div style="padding:6px 12px;background:#FFF3E0;border-left:3px solid #FF9500;border-radius:4px;margin:4px 0;font-size:13px;">'+renderMDInline(l.replace(/^>\s*/,''))+'</div>'; i++; continue; }
    // ## heading
    if(l.indexOf('## ')==0){ h+='<div style="font-weight:700;font-size:16px;margin:16px 0 8px;color:var(--text);padding-bottom:4px;border-bottom:1px solid var(--border);">'+renderMDInline(l.replace(/^##\s*/,''))+'</div>'; i++; continue; }
    // # heading
    if(l.indexOf('# ')==0){ h+='<div style="font-weight:700;font-size:18px;margin:18px 0 10px;color:var(--text);">'+renderMDInline(l.replace(/^#\s*/,''))+'</div>'; i++; continue; }
    // ### subheading
    if(l.indexOf('### ')==0){ h+='<div style="font-weight:600;font-size:14px;margin:12px 0 6px;color:var(--text);">'+renderMDInline(l.replace(/^###\s*/,''))+'</div>'; i++; continue; }
    // **bold title** : value — definition row
    if(/^\*\*[^*]+\*\*[：:]/.test(l)){
      h+='<div style="margin:4px 0;">'+renderMDInline(l)+'</div>'; i++; continue;
    }
    // Normal paragraph
    h+='<p style="margin:4px 0;">'+renderMDInline(l)+'</p>';
    i++;
  }
  if(inTable) h+='</tbody></table>';
  if(inList) h+=(listType==='ul'?'</ul>':'</ol>');
  return h;
}
function renderMDInline(text){
  return text
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/`([^`]+)`/g,'<code style="background:var(--bg);padding:1px 4px;border-radius:3px;font-size:12px;">$1</code>');
}

function openDetail(slug){

  if(cs.type==='company'){ renderCompany(cs); return; }

  // Route: concept entity → renderConcept
  if(cs.type==='concept'){ renderConcept(cs); return; }

  // Route: thesis entity → renderThesis
  if(cs.type==='thesis'){ renderThesis(cs); return; }

  var comps=(cs.companies||[]).slice(0,30).map(function(c){
    var rc=c.role.indexOf('龙头')>=0?'role-lead':c.role.indexOf('二线')>=0||c.role.indexOf('弹性')>=0?'role-second':'role-concept';

  }).join('');

  var trends=''; var tt={tech:[],market:[],event:[]};
  var trendList=Array.isArray(cs.key_trends)?cs.key_trends.map(function(t){return(t.title||'')+(t.detail?'——'+t.detail:'');}):(cs.key_trends||'').split('|').filter(Boolean);
  trendList.forEach(function(t){
    var txt=t.trim();
    if(txt.indexOf('技术')>=0||txt.indexOf('AI')>=0||txt.indexOf('架构')>=0) tt.tech.push(txt);
    else if(txt.indexOf('市场')>=0||txt.indexOf('出货')>=0||txt.indexOf('份额')>=0) tt.market.push(txt);
    else tt.event.push(txt);
  });
  function trendSec(title,items,tagCls){
    if(!items.length) return'';
    return'<div style=margin-bottom:12px;><div style=font-size:12px;font-weight:600;margin-bottom:6px;color:var(--text);><span class="tag '+tagCls+'" style=margin-right:6px;>'+title+'</span> '+items.length+'项</div><ol style=padding-left:20px;font-size:12px;color:var(--text2);line-height:2;>'+items.map(function(t){return'<li>'+t+'</li>';}).join('')+'</ol></div>';
  }

  // Competition: structured (new) or string (old, backward compat)
  var compData = cs.competition || '';
  var compStruct = (typeof compData === 'object' && compData !== null) ? compData : null;
  var globalComp='', chinaComp='', barriers='', gap='';
  if(!compStruct){
    var comp=compData;
    var parts=comp.split('||'); if(parts.length>=2){globalComp=parts[0]; chinaComp=parts[1];}
    if(chinaComp.indexOf('🔒')>=0){chinaComp=chinaComp.split('🔒')[0];}

    // Part 1: 一句话公司介绍和定位
    if(c.one_liner){
      h+='<div style="margin-bottom:16px;"><div style="font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;margin-bottom:6px;">定位与介绍</div>';
      h+='<div style="border-left:4px solid #0071E3;padding:10px 14px;font-size:14px;color:var(--text);line-height:1.8;background:rgba(0,113,227,0.03);border-radius:0 8px 8px 0;">'+c.one_liner+'</div></div>';
    }
    // Part 2: 核心业务/产品
    if(coreBiz.length){
      h+='<div style="margin-bottom:16px;"><div style="font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;margin-bottom:8px;">核心业务与产品</div>';
      h+='<div style="display:flex;flex-wrap:wrap;gap:6px;">';
      coreBiz.forEach(function(biz){
        h+='<span style="padding:6px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;font-size:13px;color:var(--text);">'+biz+'</span>';
      });
      h+='</div></div>';
    }
    // Part 3: 盈利模式
    if(revModel){
      h+='<div style="margin-bottom:4px;"><div style="font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;margin-bottom:6px;">盈利模式</div>';
      h+='<div style="font-size:14px;color:var(--text);line-height:1.7;">'+revModel+'</div></div>';
    }
    h+='</div>';
  }

  // 详细信息：公司深度资料（结构化字段优先，否则显示待填充占位）
  var detailItems=[];
  if(c.founded) detailItems.push({label:'成立年份',value:c.founded});
  if(c.headquarters) detailItems.push({label:'总部',value:c.headquarters});
  if(c.employees) detailItems.push({label:'员工规模',value:c.employees});
  if(c.latest_revenue) detailItems.push({label:'最新营收',value:c.latest_revenue});
  if(c.market_cap) detailItems.push({label:'市值',value:c.market_cap});
  if(c.description&&c.description.length>10) detailItems.push({label:'公司简介',value:c.description});

  // Also render body content for any additional markdown
  var bodyContent = c.content || '';
  bodyContent = bodyContent.replace(/^#\s+.+?\n/gm,'').replace(/^>\s+.+?\n/gm,'').trim();
  var firstBreak=bodyContent.indexOf('\n\n');
  if(firstBreak>0){
    var firstPara=bodyContent.substring(0,firstBreak).trim();
    if(firstPara.length<200&&firstPara.indexOf('##')<0&&firstPara.indexOf('- ')<0){
      bodyContent=bodyContent.substring(firstBreak).trim();
    }
  }
  bodyContent = bodyContent.replace(/## 基本信息[\s\S]*?(?=\n## |\Z)/g,'').trim().replace(/\n{3,}/g,'\n\n').trim();

  var hasBodyContent = bodyContent.length > 50;
  var hasDetailFields = detailItems.length > 0;

  h+='<div class="card" style="margin-bottom:16px;"><div class="card-title" style="font-size:18px;">详细信息</div>';

  if(hasDetailFields){
    h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;margin-bottom:'+(hasBodyContent?'14px':'4px')+';">';
    detailItems.forEach(function(d){
      h+='<div style="padding:8px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">';
      h+='<span style="font-size:12px;color:var(--text2);">'+d.label+'</span>';
      h+='<span style="font-size:14px;font-weight:500;color:var(--text);text-align:right;">'+d.value+'</span>';
      h+='</div>';
    });
    h+='</div>';
  }

  if(hasBodyContent){
    h+='<div style="font-size:14px;color:var(--text);line-height:1.8;">'+renderMD(bodyContent.substring(0,3000))+'</div>';
  }

  if(!hasDetailFields&&!hasBodyContent){
    h+='<div style="padding:20px 0;text-align:center;color:var(--text2);font-size:13px;line-height:2.2;">';
    h+='<div style="font-size:48px;margin-bottom:8px;opacity:0.3;">📋</div>';
    h+='<div style="font-weight:600;color:var(--text);margin-bottom:8px;">待填充内容</div>';
    h+='<div>公司历史与发展历程 · 财务状况</div>';
    h+='<div>产品线详解 · 技术路线图 · 全球化布局</div>';
    h+='<div>管理层与治理结构 · 研发投入与专利</div>';
    h+='<div style="margin-top:10px;font-size:11px;">以上内容将在 L0 研报采集或 Research 调研后自动填充</div>';
    h+='</div>';
  }
  h+='</div>';

  // 产业链定位 — Design v3 chain-step horizontal layout
  if(c.chain_layer){
    var layerNames={L1:'原材料与资源',L2:'设备与零部件',L3:'核心产品与集成',L4:'终端应用与服务'};
    var currentLayer = parseInt((c.chain_layer||'L3').replace('L',''));
    h+='<div class="card" style="margin-bottom:16px;"><div class="card-title" style="font-size:18px;">产业链定位</div>';
    h+='<div style="display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:12px 0;">';
    var layers=[{l:'L1',n:'原材料',d:'硅晶圆/气体'},{l:'L2',n:'设备零部件',d:'光刻/刻蚀设备'},{l:'L3',n:'核心产品',d:'芯片/GPU/HBM'},{l:'L4',n:'终端应用',d:'云计算/AI/汽车'}];
    layers.forEach(function(ly,i){
      if(i>0) h+='<div class="chain-arrow">→</div>';
      var isCurrent=('L'+currentLayer)===ly.l;
      h+='<div class="chain-step'+(isCurrent?' highlight':'')+'">';
      h+='<div style="font-size:11px;color:'+(isCurrent?'#0071E3':'var(--text2)')+';margin-bottom:3px;">'+ly.l+(isCurrent?' ★':'')+'</div>';
      h+='<div style="font-size:13px;font-weight:600;color:'+(isCurrent?'#0071E3':'var(--text)')+';">'+ly.n+'</div>';
      if(c.chain_role && isCurrent) h+='<div style="font-size:11px;color:#0071E3;margin-top:2px;">'+c.name+' · '+c.chain_role+'</div>';
      h+='</div>';
    });
    h+='</div></div>';
  }

  // 上下游关系图谱 + 供应链关系 — Design v3 two-column layout
  var hasRelations = (c.suppliers&&c.suppliers.length>0)||(c.customers&&c.customers.length>0)||(c.partners&&c.partners.length>0);
  if(hasRelations){
    h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;">';
    // Left: 关系图谱 visual
    h+='<div class="card"><div class="card-title" style="font-size:18px;">上下游关系图谱</div>';
    h+='<div style="display:flex;flex-direction:column;align-items:center;gap:0;padding:8px 0;">';
    if(c.suppliers && c.suppliers.length>0){
      h+='<div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;">';
      c.suppliers.slice(0,4).forEach(function(s){
        h+='<div style="padding:5px 10px;background:#F0F7FF;border-radius:8px;text-align:center;font-size:12px;">';
        h+='<div style="font-weight:600;">'+s.company+'</div>';
        if(s.supplies) h+='<div style="font-size:10px;color:#0071E3;">'+s.supplies+'</div>';
        h+='</div>';
      });
      h+='</div><div style="color:#0071E3;font-size:18px;line-height:1.2;">↓</div>';
    }
    h+='<div style="padding:8px 16px;background:#0071E3;color:#fff;border-radius:10px;font-weight:700;font-size:14px;">'+c.name+'</div>';
    if(c.customers && c.customers.length>0){
      h+='<div style="color:#34C759;font-size:18px;line-height:1.2;">↓</div>';
      h+='<div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;">';
      c.customers.slice(0,4).forEach(function(cu){
        h+='<div style="padding:5px 10px;background:#E8F5E9;border-radius:8px;text-align:center;font-size:12px;">';
        h+='<div style="font-weight:600;">'+cu.company+'</div>';
        if(cu.revenue_pct) h+='<div style="font-size:10px;color:#34C759;">~'+cu.revenue_pct+'%</div>';
        h+='</div>';
      });
      h+='</div>';
    }
    h+='</div></div>';

    // Right: 供应链关系链 with relation-badges
    h+='<div class="card"><div class="card-title" style="font-size:18px;">供应链关系链</div>';
    h+='<div style="font-size:14px;line-height:1.8;color:var(--text);">';
    if(c.suppliers && c.suppliers.length>0){
      h+='<div class="supply-group"><div style="font-weight:600;color:var(--text);margin-bottom:6px;">📦 上游供应</div>';
      c.suppliers.forEach(function(s){
        h+='<div style="padding:3px 0;">• '+s.company+(s.supplies?' · <strong>'+s.supplies+'</strong>':'')+'<span class="relation-badge relation-supplies">supplies</span>';
        if(s.note) h+=' <span style="color:var(--text2);font-size:11px;">('+s.note+')</span>';
        h+='</div>';
      });
      h+='</div>';
    }
    if(c.customers && c.customers.length>0){
      h+='<div class="supply-group"><div style="font-weight:600;color:var(--text);margin-bottom:6px;">🏢 下游客户</div>';
      c.customers.forEach(function(cu){
        h+='<div style="padding:3px 0;">• <strong>'+cu.company+'</strong>'+(cu.revenue_pct?' ~'+cu.revenue_pct+'%':'')+'<span class="relation-badge relation-customer">customer</span>';
        if(cu.note) h+=' <span style="color:var(--text2);font-size:11px;">('+cu.note+')</span>';
        h+='</div>';
      });
      h+='</div>';
    }
    if(c.partners && c.partners.length>0){
      h+='<div class="supply-group"><div style="font-weight:600;color:var(--text);margin-bottom:6px;">🤝 合作伙伴</div>';
      c.partners.forEach(function(p){
        h+='<div style="padding:3px 0;">• <strong>'+p.company+'</strong>'+(p.area?' · '+p.area:'')+'<span class="relation-badge relation-partners">partner</span>';
        if(p.note) h+=' <span style="color:var(--text2);font-size:11px;">('+p.note+')</span>';
        h+='</div>';
      });
      h+='</div>';
    }
    h+='</div></div>';

    h+='</div>'; // end two-column grid
  }

  // 竞争格局 — Design v3 data-table format
  if(c.competitors && c.competitors.length>0){
    h+='<div class="card" style="margin-bottom:16px;"><div class="card-title" style="font-size:18px;">竞争格局对比</div>';
    h+='<table class="data-table"><thead><tr><th>竞争对手</th><th>竞争领域</th><th>关系</th><th>备注</th></tr></thead><tbody>';
    c.competitors.forEach(function(comp){
      h+='<tr><td style="font-weight:600;">'+comp.company+'</td>';
      h+='<td>'+(comp.area||'—')+'</td>';
      h+='<td><span class="relation-badge relation-competes">competes</span></td>';
      h+='<td style="font-size:12px;color:var(--text2);">'+(comp.note||'—')+'</td></tr>';
    });
    h+='</tbody></table></div>';
  }

  // 关联赛道 — tags grid
  if(c.segments && c.segments.length>0){
    h+='<div class="card" style="margin-bottom:16px;"><div class="card-title" style="font-size:18px;">关联赛道 <span style="font-weight:400;font-size:12px;color:var(--text2);">('+c.segments.length+'个)</span></div>';
    h+='<div style="display:flex;flex-wrap:wrap;gap:8px;">';
    c.segments.slice(0,20).forEach(function(seg){
      var segE=DATA.entities.find(function(e){return e.name===seg&&e.type==='segment';});
      var sc=segE?'cursor:pointer;':'';
      h+='<span style="display:inline-block;padding:6px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;font-size:13px;'+sc+'" onclick="if(gl(\''+(segE?segE.slug:'')+'\'))openDetail(\''+(segE?segE.slug:'')+'\')">'+seg+'</span>';
    });
    h+='</div></div>';
  }

  // 关联论点 — Design v3 thesis cards
  var companyTheses = [];
  (DATA.thesis_index||{}).each? null : null; // guard
  Object.keys(DATA.thesis_index||{}).forEach(function(segSlug){
    var slugs = DATA.thesis_index[segSlug]||[];
    slugs.forEach(function(ts){
      if(companyTheses.indexOf(ts)<0) companyTheses.push(ts);
    });
  });
  // Check if any thesis mentions this company
  DATA.entities.filter(function(e){return e.type==='thesis'&&(e.affected_companies||[]).indexOf(c.slug)>=0;}).forEach(function(t){
    if(companyTheses.indexOf(t.slug)<0) companyTheses.push(t.slug);
  });

  if(companyTheses.length>0){
    h+='<div class="card"><div class="card-title">关联论点</div>';
    var statusLabels={active:'活跃',forming:'形成中',confirmed:'已确认',invalidated:'已失效'};
    companyTheses.slice(0,8).forEach(function(ts){
      var t=DATA.entities.find(function(e){return e.slug===ts;});
      if(!t) return;
      var sc='';
      if(t.thesis_status==='active') sc='background:#0071E3;color:#fff;';
      else if(t.thesis_status==='confirmed') sc='background:#34C759;color:#fff;';
      else if(t.thesis_status==='invalidated') sc='background:#FF3B30;color:#fff;';
      else sc='background:#E5E5EA;color:#666;';
      var stars='';
      for(var i=0;i<10;i++) stars+=i<(t.confidence||5)?'★':'☆';
      h+='<div style="margin-bottom:8px;padding:10px;border-radius:8px;border:1px solid var(--border);cursor:pointer;" onclick="openDetail(\''+t.slug+'\')">';
      h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;"><b style="font-size:13px;">'+t.name+'</b><span style="font-size:10px;padding:2px 6px;border-radius:4px;'+sc+'">'+(statusLabels[t.thesis_status]||t.thesis_status)+'</span></div>';
      h+='<div style="font-size:11px;color:#F59E0B;">'+stars+' '+t.confidence+'/10</div>';
      h+='</div>';
    });
    h+='</div>';
  }

  // Backlinks
  if(c.backlinks>0){
    h+='<div style="margin-top:16px;font-size:12px;color:var(--text2);"><b>'+c.backlinks+'</b> 个词条引用该公司</div>';
  }

  document.getElementById('dv').innerHTML = h;
}

function renderConcept(c){
  var h='';
  h+='<div class="back-btn" onclick="closeDetail()">← 返回'+backLabel()+'</div>';

  // Header card — Design v3 style
  h+='<div class="card" style="margin-bottom:16px;padding:20px 24px;">';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">';
  h+='<div><div style="font-size:22px;font-weight:600;color:var(--text);letter-spacing:-0.01em;line-height:1.3;">'+c.name+'</div>';
  if(c.one_liner) h+='<div style="font-size:14px;color:var(--text2);margin-top:4px;line-height:1.5;">'+c.one_liner.substring(0,80)+(c.one_liner.length>80?'...':'')+'</div>';
  h+='</div>';
  h+='<div style="display:flex;gap:6px;flex-wrap:wrap;">';
  if(c.category) h+='<span class="tag tag-blue">'+c.category+'</span>';
  if(c.difficulty) h+='<span class="tag tag-gray">'+c.difficulty+'级</span>';
  if(c.heat) h+='<span class="tag tag-purple">'+c.heat+'</span>';
  if(c.confidence) h+='<span class="tag tag-green">置信度: '+c.confidence+'</span>';
  if(c.updated) h+='<span class="tag" style="background:rgba(52,199,89,0.1);color:#34C759;font-size:11px;">● '+c.updated+'</span>';
  h+='</div></div></div>';

  // 一句话解释 — Design v3 cs-purple
  if(c.one_liner){
    h+='<div class="concept-section cs-purple">';
    h+='<div class="concept-heading"><span class="c-icon">🎯</span> 一句话解释</div>';
    h+='<div style="font-size:14px;color:var(--text);line-height:1.7;">'+c.one_liner+'</div>';
    h+='</div>';
  }

  // Body modules — Design v3 concept-section with colored borders
  var modules=[
    {key:'body_analogy', title:'生活类比（寓言提示法）', icon:'📖', cs:'cs-blue'},
    {key:'body_definition', title:'专业定义', icon:'📏', cs:'cs-green'},
    {key:'body_market_attention', title:'市场关注原因', icon:'🔥', cs:'cs-orange'},
    {key:'body_chain_position', title:'产业链位置', icon:'🔗', cs:'cs-teal'},
    {key:'body_companies', title:'相关公司与标的', icon:'🏢', cs:'cs-indigo'},
    {key:'body_investment_focus', title:'投资关注焦点', icon:'💡', cs:'cs-pink'},
    {key:'body_risks', title:'风险警示', icon:'⚠️', cs:'cs-red'},
    {key:'body_real_vs_hype', title:'如何鉴别：真逻辑 vs 炒概念', icon:'🔍', cs:'cs-amber'},
    {key:'body_tracking', title:'后续追踪指标', icon:'📊', cs:'cs-teal'}
    // body_related_links 由下方 YAML related_concepts 卡片渲染，不在此处展示
  ];

  modules.forEach(function(m){
    var content=c[m.key];
    if(content && content.length>10){
      h+='<div class="concept-section '+m.cs+'">';
      h+='<div class="concept-heading"><span class="c-icon">'+m.icon+'</span> '+m.title+'</div>';
      h+='<div style="font-size:14px;color:var(--text);line-height:1.7;">'+renderMD(content.substring(0,3000))+'</div>';
      h+='</div>';
    }
  });

  // Affected segments
  if(c.affected_segments && c.affected_segments.length>0){
    h+='<div class="card" style="margin-top:6px;"><div class="card-title">关联赛道</div>';
    h+='<div style="display:flex;flex-wrap:wrap;gap:6px;">';
    c.affected_segments.forEach(function(slug){
      var seg=DATA.entities.find(function(e){return e.slug===slug;});
      h+='<span style="padding:4px 10px;background:var(--bg);border-radius:6px;font-size:12px;cursor:pointer;" onclick="openDetail(\''+slug+'\')">'+(seg?seg.name:slug)+'</span>';
    });

  }

  // Related concepts — Design v3 card/tag style
  if(c.related_concepts && c.related_concepts.length>0){
    h+='<div class="card" style="margin-top:6px;"><div class="card-title">关联概念</div>';
    h+='<div class="concept-link-grid">';
    c.related_concepts.forEach(function(rc){
      var linkE=DATA.entities.find(function(e){return e.slug===rc.slug;});
      var conceptName=linkE?linkE.name:rc.slug;
      h+='<div class="concept-link-card" onclick="openDetail(\''+rc.slug+'\')" title="'+(rc.relation||'')+'">';
      h+='<span class="cl-name">'+conceptName+'</span>';
      if(rc.relation) h+='<span class="cl-rel">'+rc.relation+'</span>';
      h+='</div>';
    });
    h+='</div></div>';
  }

  document.getElementById('dv').innerHTML = h;
}

function renderThesis(c){
  var h='';
  h+='<div class="back-btn" onclick="closeDetail()">← 返回'+backLabel()+'</div>';

  // Header
  var statusLabels={active:'活跃',forming:'形成中',confirmed:'已确认',invalidated:'已失效'};
  var statusColors={active:'background:#0071E3;color:#fff;',forming:'background:#E5E5EA;color:#666;',confirmed:'background:#34C759;color:#fff;',invalidated:'background:#FF3B30;color:#fff;'};
  h+='<div class="detail-header"><h2>'+c.name+'</h2>';
  h+='<div class="meta">';
  h+='<span class="tag" style="'+(statusColors[c.thesis_status]||statusColors.forming)+'">'+(statusLabels[c.thesis_status]||c.thesis_status)+'</span>';
  var stars='';
  for(var i=0;i<10;i++) stars+=i<(c.confidence||5)?'★':'☆';
  h+='<span style="font-size:12px;color:#F59E0B;margin-left:8px;">'+stars+' '+c.confidence+'/10</span>';
  if(c.updated) h+='<span class="tag tag-gray" style="margin-left:8px;">更新: '+c.updated+'</span>';
  h+='</div></div>';

  // 核心主张 — 蓝色左边框突出显示
  if(c.claim_full){
    h+='<div class="card" style="border-left:4px solid #0071E3;">';
    h+='<div class="card-title">核心主张</div>';
    h+='<div style="font-size:14px;color:var(--text);line-height:1.8;">'+c.claim_full.replace(/\n/g,'<br>')+'</div>';
    h+='</div>';
  }

  // Helper: render evidence card (支撑/反对)
  function _evidenceCard(title, color, data){
    if(!data) return '';
    var items=Array.isArray(data)?data:null;
    var str=Array.isArray(data)?'':(data||'');
    if(!items&&str.length<10) return '';
    if(items&&!items.length) return '';
    var eh='<div class="card"><div class="card-title" style="color:'+color+';">'+title;
    if(items) eh+=' <span style="font-size:12px;font-weight:400;color:var(--text2);">（'+items.length+'条）</span>';
    eh+='</div>';
    var list=items||[{content:str,source_title:'',source_url:''}];
    list.forEach(function(e,i){
      eh+='<div class="evidence-item"><div class="evidence-num">'+(i+1)+'</div><div class="evidence-text">';
      eh+='<div style="font-size:13px;color:var(--text);line-height:1.7;">'+(e.content||str||'')+'</div>';
      if(e.source_title) eh+='<div style="font-size:11px;color:var(--accent);margin-top:4px;">来源: '+e.source_title+'</div>';
      if(e.source_url) eh+='<a href="'+e.source_url+'" target=_blank style="font-size:11px;color:var(--text2);display:block;margin-top:2px;">'+e.source_url.replace(/^https?:\/\//,'').replace(/\/.*$/,'')+'</a>';
      eh+='</div></div>';
    });
    eh+='</div>';
    return eh;
  }

  // 支撑证据 — 绿色标记

function _filterList(q, listType){
  var ql=q.trim().toLowerCase();
  var results=_listData;
  if(ql){
    results=_listData.filter(function(e){
      // Title matching (all types)
      if((e.name||'').toLowerCase().indexOf(ql)>=0) return true;
      if((e.slug||'').toLowerCase().indexOf(ql)>=0) return true;
      if((e.ticker||'').toLowerCase().indexOf(ql)>=0) return true;
      // Company: Chinese name mapping
      if(listType==='company'){
        var cn=_companyNameMap[ql]||_companyNameMap[q.trim()];
        if(cn&&(e.name||'').toLowerCase().indexOf(cn.toLowerCase())>=0) return true;
        // Also check if any known Chinese name matches this company
        for(var cnk in _companyNameMap){
          if(cnk.toLowerCase().indexOf(ql)>=0&&(e.name||'').toLowerCase().indexOf(_companyNameMap[cnk].toLowerCase())>=0) return true;
        }
      }
      // Thesis: content matching (hot tags are keyword fragments)
      if(listType==='thesis'){
        if((e.claim||'').toLowerCase().indexOf(ql)>=0) return true;
        if((e.claim_full||'').toLowerCase().indexOf(ql)>=0) return true;
      }
      return false;
    });
  }
  if(listType==='segment') _renderSegmentCards(results);
  else if(listType==='company'){ _companySearch=q;_applyCompanyFilters(); }
  else if(listType==='concept') _renderConceptCards(results);
  else if(listType==='thesis') _renderThesisCards(results);
}

function _parseMCap(c){
  var s=(c.market_cap||'').toString();
  // 美元格式：~$4.8T 或 （~$140B USD），排除 NT$（新台币）
  // 匹配 $ 前面不是 T 的（排除 NT$）
  var re=/([^T]|^)\$\s*([\d,.]+)\s*([TBM])/g;
  var m, best=null;
  while((m=re.exec(s))!==null){
    best=m; // 取最后一个匹配（通常括号里的是美元等效值）
  }
  if(best){
    var v=parseFloat(best[2].replace(/,/g,''));
    if(best[3]==='T') return v*1e12;
    if(best[3]==='B') return v*1e9;
    if(best[3]==='M') return v*1e6;
    return v;
  }
  return 0;
}

function _freshnessColor(c){
  var d=c.data_freshness_date;
  if(!d) return null;
  var fd=new Date(d);
  var today=new Date();
  var days=Math.floor((today-fd)/(1000*60*60*24));
  if(days<=30) return '#34C759';
  if(days<=90) return '#FF9500';
  return '#FF3B30';
}

function _applyCompanyFilters(){
  var results=_listData.slice();
  // Search filter
  if(_companySearch){
    var ql=_companySearch.trim().toLowerCase();
    results=results.filter(function(e){
      if((e.name||'').toLowerCase().indexOf(ql)>=0) return true;
      if((e.slug||'').toLowerCase().indexOf(ql)>=0) return true;
      if((e.ticker||'').toLowerCase().indexOf(ql)>=0) return true;
      var cn=_companyNameMap[ql]||_companyNameMap[_companySearch.trim()];
      if(cn&&(e.name||'').toLowerCase().indexOf(cn.toLowerCase())>=0) return true;
      for(var cnk in _companyNameMap){
        if(cnk.toLowerCase().indexOf(ql)>=0&&(e.name||'').toLowerCase().indexOf(_companyNameMap[cnk].toLowerCase())>=0) return true;
      }
      return false;
    });
  }
  // Filter by country
  if(_companyCountry!=='all'){
    results=results.filter(function(c){
      var co=(c.country||'').toUpperCase();
      if(_companyCountry==='US') return co==='US'||co.indexOf('美国')>=0;
      if(_companyCountry==='TW') return co==='TW'||co.indexOf('台湾')>=0;
      if(_companyCountry==='CN') return co==='CN'||co.indexOf('中国')>=0;
      if(_companyCountry==='JP') return co==='JP'||co.indexOf('日本')>=0;
      if(_companyCountry==='KR') return co==='KR'||co.indexOf('韩国')>=0;
      if(_companyCountry==='NL') return co==='NL'||co.indexOf('荷兰')>=0;
      if(_companyCountry==='DE') return co==='DE'||co.indexOf('德国')>=0;
      if(_companyCountry==='UK') return co==='UK'||co.indexOf('英国')>=0;
      if(_companyCountry==='CH') return co==='CH'||co.indexOf('瑞士')>=0||co.indexOf('意大利')>=0;
      if(_companyCountry==='IL') return co==='IL'||co.indexOf('以色列')>=0;
      return false;
    });
  }
  // Filter by chain layer
  if(_companyLayer!=='all'){
    results=results.filter(function(c){return (c.chain_layer||'')===_companyLayer;});
  }
  // Sort
  if(_companySort==='mcap_desc') results.sort(function(a,b){return _parseMCap(b)-_parseMCap(a);});
  else if(_companySort==='mcap_asc') results.sort(function(a,b){return _parseMCap(a)-_parseMCap(b);});
  else if(_companySort==='name_asc') results.sort(function(a,b){return (a.name||'').localeCompare(b.name||'');});
  else if(_companySort==='backlinks_desc') results.sort(function(a,b){return (b.backlinks||0)-(a.backlinks||0);});
  _renderCompanyCards(results);
}

function _renderThesisCards(theses){

  var statusColors={active:'background:#0071E3;color:#fff;',forming:'background:#E5E5EA;color:#666;',confirmed:'background:#34C759;color:#fff;',invalidated:'background:#FF3B30;color:#fff;'};
  theses.forEach(function(t){

// ── Visualization Graph ──
function renderGraphView(){
  document.getElementById('cv').style.display='none';
  document.getElementById('dv').style.display='flex';
  // Build graph container
  var h='<div style="padding:12px 16px;display:flex;flex-direction:column;height:calc(100vh - 80px);">';
  h+='<div class="card" style="padding:0;overflow:hidden;display:flex;flex-direction:column;flex:1;">';
  h+='<div style="padding:14px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;">';
  h+='<div><div style="font-size:18px;font-weight:700;">可视化关系图谱</div>';
  h+='<div style="font-size:12px;color:var(--text2);">'+DATA.total+'节点 · 知识网络全貌</div></div>';
  h+='<div style="display:flex;gap:6px;align-items:center;">';
  h+='<span style="font-size:11px;color:var(--text2);margin-right:4px;">类型：</span>';
  h+='<span class="tag tag-blue">公司</span><span class="tag tag-green">赛道</span><span class="tag tag-purple">概念</span><span class="tag" style="background:#FF9500;color:#fff;">论点</span>';
  h+='</div></div>';
  h+='<div id="graphChart" style="flex:1;min-height:0;"></div>';
  h+='<div style="font-size:11px;color:var(--text2);text-align:center;padding:6px;border-top:1px solid var(--border);">滚轮缩放 · 拖拽节点 · 悬停查看 · 点击跳转详情</div>';
  h+='</div></div>';
  document.getElementById('dv').innerHTML=h;
  // Build graph data
  var nodes=[]; var nodeMap={}; var typeColors={segment:'#4ade80',company:'#60a5fa',concept:'#AF52DE',thesis:'#FF9500'};
  var typeIcons={segment:'📋',company:'🏢',concept:'💡',thesis:'📝'};
  var seenNames={};
  DATA.entities.forEach(function(e){
    if(e.type==='industry'||e.type==='unknown') return;
    if(seenNames[e.name]) return; seenNames[e.name]=true;
    nodes.push({id:e.slug,name:e.name,type:e.type,symbolSize:8,itemStyle:{color:typeColors[e.type]||'#94a3b8'},category:e.type});
    nodeMap[e.slug]=true;
  });
  // Build links from wikilinks
  var links=[]; var edgeMap={};
  function addLink(src,tgt){
    if(!nodeMap[src]||!nodeMap[tgt]) return;
    var key=src<tgt?src+'|||'+tgt:tgt+'|||'+src;
    if(edgeMap[key]) return; edgeMap[key]=true;
    links.push({source:src,target:tgt,lineStyle:{color:'#C0C8D0',curveness:0,width:1.2}});
  }
  DATA.entities.forEach(function(e){
    if(!nodeMap[e.slug]) return;
    (e.wikilinks||[]).forEach(function(target){addLink(e.slug,target);});
    // Also link companies from segment.company array
    if(e.type==='segment'&&e.companies){
      e.companies.forEach(function(comp){
        var cn=typeof comp==='string'?comp:(comp.name||comp.ticker||'');
        if(!cn) return;
        // Find matching company entity by name
        var found=DATA.entities.find(function(x){return x.type==='company'&&(x.name===cn||x.ticker===cn);});
        if(found) addLink(e.slug,found.slug);
      });
    }
    // Link theses to affected companies
    if(e.type==='thesis'&&e.affected_companies){
      e.affected_companies.forEach(function(cs){addLink(e.slug,cs);});
    }
  });
  // Update node sizes based on connection count
  var connCount={};
  links.forEach(function(l){connCount[l.source]=(connCount[l.source]||0)+1;connCount[l.target]=(connCount[l.target]||0)+1;});
  nodes.forEach(function(n){var c=connCount[n.id]||0;n.symbolSize=c===0?6:Math.max(8,Math.min(55,Math.sqrt(c)*14+6));});
  // Render with ECharts
  if(gh) gh.dispose();
  var dom=document.getElementById('graphChart'); gh=echarts.init(dom);
  var categories=Object.keys(typeColors).map(function(k){return{name:k,itemStyle:{color:typeColors[k]}};});
  gh.setOption({
    tooltip:{formatter:function(p){if(p.dataType==='node'){var d=p.data;var cnt=connCount[d.id]||0;return'<b>'+d.name+'</b><br>'+typeIcons[d.type]+' '+d.type+' · '+cnt+' 关联';}return'';}},backgroundColor:'#fff',
    legend:{show:true,data:categories.map(function(c){return{name:c.name,icon:'circle'};}),bottom:0,textStyle:{fontSize:11}},
    series:[{type:'graph',layout:'force',roam:true,draggable:true,force:{repulsion:350,edgeLength:[80,250],gravity:0.1,friction:0.6},data:nodes,links:links.slice(0,5000),categories:categories,label:{show:true,fontSize:10,color:'#1D1D1F',formatter:function(p){return p.name.length>10?p.name.slice(0,10)+'…':p.name;}},emphasis:{focus:'adjacency',lineStyle:{width:4},label:{fontSize:14,fontWeight:'bold'}},lineStyle:{color:'#B0B8C0',curveness:0,opacity:0.5}}]
  });
  gh.on('click',function(p){if(p.dataType==='node'&&p.data&&p.data.id){openDetail(p.data.id);}});
}

// ── Search System (invest_kg style) ──
var SEARCH_INDEX=[], searchTimer=null, searchActiveIdx=-1;

function buildSearchIndex(){
  if(!DATA) return;
  SEARCH_INDEX=[];
  // Chinese-English name mapping for common entities
  var cnMap={'英伟达':'NVIDIA','台积电':'TSMC','博通':'Broadcom','AMD':'AMD','英特尔':'Intel','高通':'Qualcomm','美光':'Micron','海力士':'SK hynix','三星':'Samsung','阿斯麦':'ASML','苹果':'Apple','谷歌':'Google','微软':'Microsoft','亚马逊':'Amazon','Meta':'Meta','特斯拉':'Tesla','华为':'华为','中芯国际':'SMIC'};
  DATA.entities.forEach(function(e){
    var typeLabel=''; var icon='';
    if(e.type==='segment'){typeLabel='赛道';icon='📋';}
    else if(e.type==='company'){typeLabel='公司';icon='🏢';}
    else if(e.type==='concept'){typeLabel='概念';icon='💡';}
    else if(e.type==='thesis'){typeLabel='论点';icon='📝';}
    else return;
    // Build keywords including Chinese aliases
    var cnAlias='';
    Object.keys(cnMap).forEach(function(cn){if(cnMap[cn]===e.name)cnAlias+=' '+cn;});
    // Also check reverse: if entity name is Chinese, add English alias
    Object.keys(cnMap).forEach(function(cn){if(cn===e.name)cnAlias+=' '+cnMap[cn];});
    SEARCH_INDEX.push({
      name:e.name, slug:e.slug, type:e.type, typeLabel:typeLabel, icon:icon,
      ticker:e.ticker||'', extra:e.industry||e.category||'',
      keywords:(e.name+' '+e.slug+' '+(e.ticker||'')+' '+(e.industry||'')+' '+(e.category||'')+' '+((e.tags||[]).join(' '))+' '+cnAlias).toLowerCase()
    });
  });
}

function initSearch(){
  var input=document.getElementById('search-input');
  if(!input) return;
  input.addEventListener('input',function(){
    if(searchTimer) clearTimeout(searchTimer);
    searchTimer=setTimeout(function(){doSearch(input.value);},200);
  });
  input.addEventListener('keydown',function(e){
    var drop=document.getElementById('search-drop');
    if(drop.style.display==='none') return;
    var items=drop.querySelectorAll('.search-item');
    if(!items.length) return;
    if(e.key==='ArrowDown'){e.preventDefault();searchActiveIdx=(searchActiveIdx+1)%items.length;updateSearchActive(items);}
    else if(e.key==='ArrowUp'){e.preventDefault();searchActiveIdx=searchActiveIdx<=0?items.length-1:searchActiveIdx-1;updateSearchActive(items);}
    else if(e.key==='Enter'){e.preventDefault();
      if(searchActiveIdx>=0&&items[searchActiveIdx]){items[searchActiveIdx].click();}
      else if(items.length===1){items[0].click();}
    }
    else if(e.key==='Escape'){closeSearch();}
  });
  document.addEventListener('click',function(e){var w=document.getElementById('topSearch');if(w&&!w.contains(e.target))closeSearch();});
}

function updateSearchActive(items){
  for(var i=0;i<items.length;i++) items[i].classList.toggle('active',i===searchActiveIdx);
  if(searchActiveIdx>=0&&items[searchActiveIdx]) items[searchActiveIdx].scrollIntoView({block:'nearest'});
}

function doSearch(query){
  var drop=document.getElementById('search-drop');
  var q=query.trim().toLowerCase();
  if(!q){drop.style.display='none';searchActiveIdx=-1;return;}
  var results=[], seen={};
  for(var i=0;i<SEARCH_INDEX.length;i++){
    var item=SEARCH_INDEX[i];
    var key=item.type+'|'+item.slug;
    if(seen[key]) continue;
    var score=0;
    if(item.slug===q){score=100;}
    else if(item.name.toLowerCase()===q){score=90;}
    else if(item.ticker&&item.ticker.toLowerCase()===q){score=85;}
    else if(item.keywords.indexOf(q)>=0){score=70+Math.min(20,item.name.length-q.length);}
    else{var kw=item.keywords;var idx=kw.indexOf(q);if(idx>=0)score=40+Math.min(30,kw.length-idx);}
    if(score>0){seen[key]=true;item.matchScore=score;results.push(item);}
  }
  results.sort(function(a,b){return b.matchScore-a.matchScore;});
  results=results.slice(0,12);
  if(!results.length){drop.innerHTML='<div class="search-empty">未找到匹配项</div>';drop.style.display='block';return;}
  searchActiveIdx=-1;
  var h='';
  results.forEach(function(r,i){
    h+='<div class="search-item" data-slug="'+r.slug+'" data-type="'+r.type+'" onclick="selectSearchResult(this)">';
    h+='<span class="s-icon">'+r.icon+'</span><span class="s-name">'+r.name+'</span>';
    if(r.ticker) h+='<span class="s-extra" style="font-family:SF Mono,monospace;">'+r.ticker+'</span>';
    h+='<span class="s-type-tag s-type-'+r.type+'">'+r.typeLabel+'</span>';
    h+='</div>';
  });
  drop.innerHTML=h; drop.style.display='block';
}

function selectSearchResult(el){
  var slug=el.getAttribute('data-slug');
  closeSearch();
  document.getElementById('search-input').value='';
  openDetail(slug);
}

function closeSearch(){
  document.getElementById('search-drop').style.display='none';
  searchActiveIdx=-1;
}
