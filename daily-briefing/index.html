<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日财经简报 · 美股早盘版 / A股收盘版</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
<style>
:root {
  --bg: #F5F5F7; --card: #FFFFFF; --border: #E5E5EA;
  --text: #1D1D1F; --text2: #86868B;
  --accent: #0071E3; --up: #FF3B30; --down: #34C759;
  --hover: #F5F5F7; --active: rgba(0,113,227,0.10);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5;
  display: flex; min-height: 100vh;
}

/* ===== 左栏导航 ===== */
.sidebar {
  width: 220px; min-width: 220px; background: var(--card);
  display: flex; flex-direction: column; position: sticky; top: 0;
  height: 100vh; overflow-y: auto; z-index: 50; border-right: 1px solid var(--border);
}
.sidebar-logo { padding: 20px 16px; font-size: 16px; font-weight: 700; border-bottom: 1px solid var(--border); }
.sidebar-logo span { color: var(--accent); }
.nav-section { padding: 8px 0; }
.nav-title { padding: 14px 16px 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--text2); }
.industry-switcher { display: flex; gap: 6px; padding: 8px 16px 12px; flex-wrap: wrap; }
.ind-btn {
  padding: 6px 14px; border-radius: 16px; font-size: 12px; font-weight: 500; cursor: pointer;
  border: 1px solid var(--border); background: var(--card); color: var(--text2); transition: all .15s; font-family: inherit;
}
.ind-btn:hover { border-color: var(--accent); color: var(--accent); }
.ind-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.sec-title { padding: 10px 16px 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--text2); }
.date-list { padding: 2px 0 16px; }
.date-item {
  padding: 6px 16px 6px 36px; font-size: 12px; cursor: pointer; color: var(--text2);
  transition: all .15s; border-left: 3px solid transparent; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.date-item:hover { color: var(--text); background: var(--hover); }
.date-item.active { color: var(--accent); background: var(--active); border-left-color: var(--accent); font-weight: 500; }
.sidebar-foot { margin-top: auto; padding: 14px 16px; font-size: 11px; color: var(--text2); border-top: 1px solid var(--border); }

/* ===== 右栏主区 ===== */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.topbar {
  background: var(--card); border-bottom: 1px solid var(--border);
  padding: 0 24px; display: flex; align-items: center; gap: 16px; height: 56px; flex-shrink: 0;
}
.bc { font-size: 14px; color: var(--text2); }
.bc .sep { margin: 0 8px; color: var(--border); }
.bc .active { color: var(--text); font-weight: 500; }
.bc .crumb { cursor: pointer; transition: color .15s; }
.bc .crumb:hover { color: var(--accent); }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.scheme-toggle {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px;
  border: 1px solid var(--border); border-radius: 16px; font-size: 12px; font-weight: 500;
  cursor: pointer; background: var(--card); color: var(--text2); font-family: inherit; transition: all .15s;
}
.scheme-toggle:hover { border-color: var(--accent); color: var(--accent); background: var(--active); }
.scheme-toggle .dot { width: 16px; height: 16px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; }
.scheme-toggle .dot.a { background: #E5E5EA; color: #1D1D1F; }
.scheme-toggle .dot.b { background: var(--accent); color: #fff; }

.content { flex: 1; display: flex; gap: 16px; padding: 16px 24px; }
.report-wrap { flex: 1; min-width: 0; }

/* ===== detail-header + 模块化卡片（方案 A 通用） ===== */
.detail-header { margin-bottom: 16px; }
.detail-header h2 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
.detail-header .meta { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--text2); font-size: 13px; }
.detail-header .meta-item { display: inline-flex; align-items: center; }
.detail-header .meta-item::before { content: '·'; margin-right: 14px; color: var(--border); }
.detail-header .meta-item:first-child::before { content: ''; display: none; }
.version-badge {
  display: inline-flex; align-items: center; padding: 4px 12px; border-radius: 10px;
  font-size: 11px; font-weight: 500; margin-left: 12px; vertical-align: middle;
}
.version-badge.morning { background: #dbeafe; color: #1e40af; }
.version-badge.evening { background: #ede9fe; color: #6d28d9; }

.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  padding: 24px 28px; margin-bottom: 16px; transition: box-shadow 0.3s ease;
}
.card:hover { box-shadow: 0 8px 32px rgba(0,0,0,0.06); }
.card.summary {
  border-left: 4px solid var(--accent); background: linear-gradient(180deg, #fff 0%, rgba(0,113,227,0.03) 100%);
}
.card.summary .card-title { color: var(--accent); }
.card-title { font-size: 18px; font-weight: 600; margin-bottom: 14px; letter-spacing: -0.01em; }
.card-body { font-size: 14px; line-height: 1.7; }
.card.loading, .card.empty { color: var(--text2); text-align: center; padding: 80px 24px; }

/* ===== 卡内 markdown 样式 ===== */
.card-body h3 { font-size: 16px; font-weight: 600; margin: 20px 0 8px; }
.card-body h4 { font-size: 14px; font-weight: 600; margin: 14px 0 6px; }
.card-body p { margin: 8px 0; }
.card-body ul, .card-body ol { margin: 8px 0 8px 22px; }
.card-body li { margin: 4px 0; }
.card-body blockquote { border-left: 3px solid var(--accent); padding-left: 12px; color: var(--text2); margin: 10px 0; }
.card-body table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 13px; }
.card-body th {
  text-align: left; padding: 8px 12px; font-size: 11px; font-weight: 600; color: var(--text2);
  text-transform: uppercase; letter-spacing: 0.03em; border-bottom: 2px solid var(--border); background: var(--bg);
}
.card-body td { padding: 8px 12px; border-bottom: 1px solid var(--border); }
.card-body tr:hover td { background: var(--bg); }
.card-body code { background: var(--bg); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
.card-body a { color: var(--accent); text-decoration: none; }
.card-body a:hover { text-decoration: underline; }
.card-body hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
.card-body strong { font-weight: 600; }

/* ===== 方案 B：统计卡片 + 图表（design-v3 风格） ===== */
#augment { margin-bottom: 4px; }
.stat-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 16px; }
.stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; text-align: center; }
.stat-change { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat-change.up { color: var(--up); }
.stat-change.down { color: var(--down); }
.stat-label { font-size: 11px; font-weight: 500; color: var(--text2); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chart-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
.chart-card .card-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
.chart-box { width: 100%; height: 280px; }

/* 方案切换：A 隐藏统计/图表，B 显示 */
body.scheme-a #augment { display: none; }
body.scheme-b #augment { display: block; }

/* 移动端：侧栏收起为顶部横向选择 */
@media (max-width: 768px) {
  body { flex-direction: column; }
  .sidebar {
    width: 100%; min-width: 0; height: auto; position: static; overflow: visible;
    border-right: none; border-bottom: 1px solid var(--border); flex-direction: row; flex-wrap: wrap; align-items: center;
    padding: 10px 12px; gap: 8px;
  }
  .sidebar-logo { border: none; padding: 0; font-size: 14px; }
  .industry-switcher { padding: 0; }
  .sec-title, .date-list, .sidebar-foot { display: none; }
  .topbar { height: 48px; padding: 0 16px; }
  .content { padding: 12px 12px; }
  .detail-header h2 { font-size: 22px; }
  .card { padding: 16px 14px; }
  .card-body table { font-size: 12px; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
  .scheme-toggle span.toggle-text { display: none; }
}
</style>
</head>
<body class="scheme-a">

<!-- 左栏导航 -->
<aside class="sidebar">
  <div class="sidebar-logo">每日财经<span>简报</span></div>
  <div class="nav-section">
    <div class="nav-title">报告类型</div>
    <div class="industry-switcher" id="marketSwitch">
      <button class="ind-btn active" data-market="us">美股早盘版</button>
      <button class="ind-btn" data-market="cn">A股收盘版</button>
    </div>
    <div class="sec-title">历史报告</div>
    <div class="date-list" id="dateNav"></div>
  </div>
  <div class="sidebar-foot">数据源：FMP / Infoway / iFinD / AkShare / 新浪 · 大模型生成</div>
</aside>

<!-- 右栏主区 -->
<div class="main">
  <div class="topbar">
    <div class="bc" id="bc">
      <span class="crumb" id="bcMarket">美股早盘版</span><span class="sep">›</span><span class="active" id="bcDate">—</span>
    </div>
    <div class="topbar-right">
      <button class="scheme-toggle" id="schemeToggle" title="切换视图样式">
        <span class="dot b">B</span><span class="toggle-text">图表版</span>
      </button>
    </div>
  </div>
  <div class="content">
    <div class="report-wrap" id="report"></div>
  </div>
</div>

<script>
const MANIFEST_PATH = 'manifest.json';
const MARKET_NAMES = { us: '美股早盘版', cn: 'A股收盘版' };
let currentMarket = 'us';
let manifest = null;
let scheme = 'a';
let chartInstance = null;
let chartData = null;

const marketSwitch = document.getElementById('marketSwitch');
const dateNav = document.getElementById('dateNav');
const bcMarket = document.getElementById('bcMarket');
const bcDate = document.getElementById('bcDate');
const reportEl = document.getElementById('report');
const toggleBtn = document.getElementById('schemeToggle');

// 样式切换（右上角）
toggleBtn.addEventListener('click', () => {
  scheme = scheme === 'a' ? 'b' : 'a';
  document.body.className = 'scheme-' + scheme;
  toggleBtn.innerHTML = scheme === 'b'
    ? '<span class="dot a">A</span><span class="toggle-text">纯文字版</span>'
    : '<span class="dot b">B</span><span class="toggle-text">图表版</span>';
  if (scheme === 'b') initCharts();
  else disposeChart();
});

// 市场切换
marketSwitch.addEventListener('click', e => {
  const btn = e.target.closest('.ind-btn');
  if (!btn) return;
  document.querySelectorAll('.ind-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentMarket = btn.dataset.market;
  renderNav();
  loadReport();
});

// 日期导航
dateNav.addEventListener('click', e => {
  const item = e.target.closest('.date-item');
  if (!item) return;
  document.querySelectorAll('.date-item').forEach(i => i.classList.remove('active'));
  item.classList.add('active');
  bcDate.textContent = item.dataset.date;
  loadReport();
});

fetch(MANIFEST_PATH)
  .then(r => r.json())
  .then(m => { manifest = m; renderNav(); loadReport(); })
  .catch(() => { reportEl.innerHTML = '<div class="card empty">❌ 无法加载报告清单 manifest.json</div>'; });

function renderNav() {
  if (!manifest) return;
  const dates = (manifest[currentMarket] || []).slice().sort().reverse();
  const titles = manifest[currentMarket + '_title'] || {};
  bcMarket.textContent = MARKET_NAMES[currentMarket];
  dateNav.innerHTML = '';
  if (dates.length === 0) {
    dateNav.innerHTML = '<div class="date-item" style="cursor:default;color:var(--text2);">暂无报告</div>';
    bcDate.textContent = '暂无';
    return;
  }
  dates.forEach(d => {
    const item = document.createElement('div');
    item.className = 'date-item';
    item.dataset.date = d;
    item.textContent = d + (titles[d] ? ' · ' + titles[d] : '');
    dateNav.appendChild(item);
  });
  dateNav.firstChild.classList.add('active');
  bcDate.textContent = dates[0];
}

function loadReport() {
  if (!manifest) return;
  const active = document.querySelector('.date-item.active');
  const d = active ? active.dataset.date : (manifest[currentMarket] || [])[0];
  if (!d) { reportEl.innerHTML = '<div class="card empty">暂无报告</div>'; return; }
  disposeChart();
  reportEl.innerHTML = '<div class="card loading">加载中…</div>';
  fetch(`reports/${currentMarket}/${d}.md`)
    .then(r => { if (!r.ok) throw new Error('not found'); return r.text(); })
    .then(md => {
      reportEl.innerHTML = renderReport(md);
      augmentReport();      // 构建方案 B 的统计卡 + 图表
      if (scheme === 'b') initCharts();
    })
    .catch(() => {
      reportEl.innerHTML = '<div class="card empty">❌ 未找到该日报告</div>';
    });
}

/* ===== 报告解析：按 ## 章节拆成卡片模块 ===== */
function parseReport(md) {
  const parts = md.split(/^##\s+/m);
  const header = parts[0];
  const sections = parts.slice(1).map(p => {
    const nl = p.indexOf('\n');
    return nl === -1 ? { title: p.trim(), body: '' } : { title: p.slice(0, nl).trim(), body: p.slice(nl + 1) };
  });
  return { header, sections };
}

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function renderReport(md) {
  const { header, sections } = parseReport(md);
  const h1 = (header.match(/^#\s+(.+)$/m) || [])[1] || '';
  const metaLines = header.split('\n').map(l => l.trim()).filter(l => /^\*\*.*\*\*：/.test(l)).map(l => l.replace(/^\*\*(.*?)\*\*：/, '$1：'));
  const isMorning = /美股|早盘/.test(h1) || currentMarket === 'us';

  let html = '';
  html += '<div class="detail-header">';
  if (h1) html += `<h2>${esc(h1)}<span class="version-badge ${isMorning ? 'morning' : 'evening'}">${isMorning ? '美股早盘版' : 'A股收盘版'}</span></h2>`;
  if (metaLines.length) html += `<div class="meta">${metaLines.map(m => `<span class="meta-item">${esc(m)}</span>`).join('')}</div>`;
  html += '</div>';

  // 方案 B 统计/图表容器（A 方案隐藏）
  html += '<div id="augment"></div>';

  sections.forEach((s, i) => {
    const isSummary = i === 0 || /一句话|总览|摘要/.test(s.title);
    html += `<div class="card${isSummary ? ' summary' : ''}">`;
    if (s.title) html += `<div class="card-title">${esc(s.title)}</div>`;
    html += `<div class="card-body">${marked.parse(s.body, { gfm: true, breaks: true })}</div>`;
    html += '</div>';
  });
  return html;
}

/* ===== 方案 B：从报告表格提取统计卡 + 图表 ===== */
function augmentReport() {
  chartData = null;
  const aug = document.getElementById('augment');
  if (!aug) return;
  aug.innerHTML = '';
  const tables = reportEl.querySelectorAll('table');
  let indexTbl = null, sectorTbl = null;
  tables.forEach(t => {
    const ths = Array.from(t.querySelectorAll('thead th')).map(x => x.textContent.trim());
    if (!ths.some(h => h.includes('涨跌幅') || h.includes('涨跌'))) return;
    const n = t.querySelectorAll('tbody tr').length;
    if (!indexTbl) indexTbl = t;
    if (!sectorTbl || n > sectorTbl.querySelectorAll('tbody tr').length) sectorTbl = t;
  });

  // 统计卡：指数表前 5 行
  if (indexTbl) {
    const ths = Array.from(indexTbl.querySelectorAll('thead th')).map(x => x.textContent.trim());
    const pctIdx = ths.findIndex(h => h.includes('涨跌幅') || h.includes('涨跌'));
    const rows = Array.from(indexTbl.querySelectorAll('tbody tr')).slice(0, 5);
    const stats = rows.map(r => {
      const c = r.querySelectorAll('td');
      return { name: (c[0]?.textContent || '').trim(), pct: (c[pctIdx]?.textContent || '').trim() };
    }).filter(x => x.name && x.pct);
    if (stats.length) {
      let h = '<div class="stat-grid">';
      stats.forEach(s => {
        const m = parseFloat(s.pct.replace('%', ''));
        const cls = m > 0 ? 'up' : m < 0 ? 'down' : '';
        h += `<div class="stat-card"><div class="stat-change ${cls}">${esc(s.pct)}</div><div class="stat-label">${esc(s.name)}</div></div>`;
      });
      h += '</div>';
      aug.innerHTML += h;
    }
  }

  // 板块图：行数最多的涨跌幅表（板块表）→ 横向柱状图
  if (sectorTbl) {
    const ths = Array.from(sectorTbl.querySelectorAll('thead th')).map(x => x.textContent.trim());
    const pctIdx = ths.findIndex(h => h.includes('涨跌幅') || h.includes('涨跌'));
    const rows = Array.from(sectorTbl.querySelectorAll('tbody tr'));
    const data = rows.map(r => {
      const c = r.querySelectorAll('td');
      return { name: (c[0]?.textContent || '').trim(), pct: parseFloat((c[pctIdx]?.textContent || '0').replace('%', '')) || 0 };
    }).filter(d => d.name && !/指数/.test(d.name));
    if (data.length >= 3) {
      chartData = data;
      aug.innerHTML += '<div class="chart-card"><div class="card-title">📊 板块涨跌全景</div><div class="chart-box" id="sectorChart"></div></div>';
    }
  }
}

function initCharts() {
  if (!chartData) return;
  const el = document.getElementById('sectorChart');
  if (!el || chartInstance) return;
  chartInstance = echarts.init(el);
  const sorted = chartData.slice().sort((a, b) => a.pct - b.pct);
  chartInstance.setOption({
    grid: { left: 90, right: 40, top: 8, bottom: 24 },
    xAxis: { type: 'value', axisLabel: { fontSize: 11 }, splitLine: { lineStyle: { color: '#F0F0F2' } } },
    yAxis: { type: 'category', data: sorted.map(d => d.name), axisLabel: { fontSize: 11, color: '#1D1D1F' } },
    tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, formatter: p => `${p[0].name}：${p[0].value}%` },
    series: [{
      type: 'bar', data: sorted.map(d => d.pct), barWidth: 14,
      itemStyle: { color: p => p.value >= 0 ? '#FF3B30' : '#34C759', borderRadius: 3 },
      label: { show: true, position: 'right', formatter: '{c}%', fontSize: 11, color: '#1D1D1F' }
    }]
  });
  window.addEventListener('resize', () => chartInstance && chartInstance.resize());
}

function disposeChart() {
  if (chartInstance) { chartInstance.dispose(); chartInstance = null; }
}
</script>
</body>
</html>
