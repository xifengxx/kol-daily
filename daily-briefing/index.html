<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日财经简报 · 美股早盘版 / A股收盘版</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root {
  --bg: #F5F5F7; --card: #FFFFFF; --border: #E5E5EA;
  --text: #1D1D1F; --text2: #86868B;
  --accent: #0071E3; --up: #FF3B30; --down: #34C759;
  --hover: #F5F5F7; --active: rgba(0,113,227,0.10);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5;
  display: flex; min-height: 100vh;
}

/* ===== 左栏导航 ===== */
.sidebar {
  width: 220px; min-width: 220px; background: var(--card);
  display: flex; flex-direction: column; position: sticky; top: 0;
  height: 100vh; overflow-y: auto; z-index: 50; border-right: 1px solid var(--border);
}
.sidebar-logo { padding: 20px 16px; font-size: 16px; font-weight: 700; border-bottom: 1px solid var(--border); }
.sidebar-logo span { color: var(--accent); }
.nav-section { padding: 8px 0; }
.nav-title { padding: 14px 16px 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--text2); }
.industry-switcher { display: flex; gap: 6px; padding: 8px 16px 12px; flex-wrap: wrap; }
.ind-btn {
  padding: 6px 14px; border-radius: 16px; font-size: 12px; font-weight: 500; cursor: pointer;
  border: 1px solid var(--border); background: var(--card); color: var(--text2); transition: all .15s; font-family: inherit;
}
.ind-btn:hover { border-color: var(--accent); color: var(--accent); }
.ind-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.sec-title { padding: 10px 16px 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--text2); }
.date-list { padding: 2px 0 16px; }
.date-item {
  padding: 6px 16px 6px 36px; font-size: 12px; cursor: pointer; color: var(--text2);
  transition: all .15s; border-left: 3px solid transparent; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.date-item:hover { color: var(--text); background: var(--hover); }
.date-item.active { color: var(--accent); background: var(--active); border-left-color: var(--accent); font-weight: 500; }
.sidebar-foot { margin-top: auto; padding: 14px 16px; font-size: 11px; color: var(--text2); border-top: 1px solid var(--border); }

/* ===== 右栏主区 ===== */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.topbar {
  background: var(--card); border-bottom: 1px solid var(--border);
  padding: 0 24px; display: flex; align-items: center; gap: 16px; height: 56px; flex-shrink: 0;
}
.bc { font-size: 14px; color: var(--text2); }
.bc .sep { margin: 0 8px; color: var(--border); }
.bc .active { color: var(--text); font-weight: 500; }
.bc .crumb { cursor: pointer; transition: color .15s; }
.bc .crumb:hover { color: var(--accent); }
.content { flex: 1; display: flex; gap: 16px; padding: 16px 24px; }
.report-wrap { flex: 1; min-width: 0; }

/* 报告卡片 */
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  padding: 28px 36px; transition: all 0.3s ease;
}
.card.loading, .card.empty { color: var(--text2); text-align: center; padding: 80px 24px; }

/* 报告 markdown 样式（仿 quality-table） */
#report h1 { font-size: 24px; margin: 0 0 14px; padding-bottom: 14px; border-bottom: 2px solid var(--border); }
#report h2 { font-size: 19px; margin: 28px 0 12px; padding-left: 12px; border-left: 4px solid var(--accent); }
#report h3 { font-size: 16px; margin: 20px 0 8px; }
#report h4 { font-size: 14px; margin: 16px 0 6px; }
#report p { margin: 8px 0; font-size: 14px; line-height: 1.7; }
#report ul, #report ol { margin: 8px 0 8px 22px; font-size: 14px; }
#report li { margin: 4px 0; }
#report blockquote { border-left: 3px solid var(--accent); padding-left: 12px; color: var(--text2); margin: 10px 0; }
#report table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 13px; }
#report th {
  text-align: left; padding: 8px 12px; font-size: 11px; font-weight: 600; color: var(--text2);
  text-transform: uppercase; letter-spacing: 0.03em; border-bottom: 2px solid var(--border); background: var(--bg);
}
#report td { padding: 8px 12px; border-bottom: 1px solid var(--border); }
#report tr:hover td { background: var(--bg); }
#report code { background: var(--bg); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
#report a { color: var(--accent); text-decoration: none; }
#report a:hover { text-decoration: underline; }
#report hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

/* 移动端：侧栏收起为顶部横向选择 */
@media (max-width: 768px) {
  body { flex-direction: column; }
  .sidebar {
    width: 100%; min-width: 0; height: auto; position: static; overflow: visible;
    border-right: none; border-bottom: 1px solid var(--border); flex-direction: row; flex-wrap: wrap; align-items: center;
    padding: 10px 12px; gap: 8px;
  }
  .sidebar-logo { border: none; padding: 0; font-size: 14px; }
  .industry-switcher { padding: 0; }
  .sec-title, .date-list, .sidebar-foot { display: none; }
  .topbar { height: 48px; padding: 0 16px; }
  .content { padding: 12px 12px; }
  .card { padding: 16px 14px; }
  #report table { font-size: 12px; }
}
</style>
</head>
<body>

<!-- 左栏导航 -->
<aside class="sidebar">
  <div class="sidebar-logo">每日财经<span>简报</span></div>
  <div class="nav-section">
    <div class="nav-title">报告类型</div>
    <div class="industry-switcher" id="marketSwitch">
      <button class="ind-btn active" data-market="us">美股早盘版</button>
      <button class="ind-btn" data-market="cn">A股收盘版</button>
    </div>
    <div class="sec-title">历史报告</div>
    <div class="date-list" id="dateNav"></div>
  </div>
  <div class="sidebar-foot">数据源：FMP / Infoway / iFinD / AkShare / 新浪 · 大模型生成</div>
</aside>

<!-- 右栏主区 -->
<div class="main">
  <div class="topbar">
    <div class="bc" id="bc">
      <span class="crumb" id="bcMarket">美股早盘版</span><span class="sep">›</span><span class="active" id="bcDate">—</span>
    </div>
  </div>
  <div class="content">
    <div class="report-wrap">
      <div id="report" class="card loading">加载中…</div>
    </div>
  </div>
</div>

<script>
const MANIFEST_PATH = 'manifest.json';
const MARKET_NAMES = { us: '美股早盘版', cn: 'A股收盘版' };
let currentMarket = 'us';
let manifest = null;

const marketSwitch = document.getElementById('marketSwitch');
const dateNav = document.getElementById('dateNav');
const bcMarket = document.getElementById('bcMarket');
const bcDate = document.getElementById('bcDate');
const reportEl = document.getElementById('report');

// 市场切换
marketSwitch.addEventListener('click', e => {
  const btn = e.target.closest('.ind-btn');
  if (!btn) return;
  document.querySelectorAll('.ind-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentMarket = btn.dataset.market;
  renderNav();
  loadReport();
});

// 日期导航（事件委托）
dateNav.addEventListener('click', e => {
  const item = e.target.closest('.date-item');
  if (!item) return;
  document.querySelectorAll('.date-item').forEach(i => i.classList.remove('active'));
  item.classList.add('active');
  bcDate.textContent = item.dataset.date;
  loadReport();
});

fetch(MANIFEST_PATH)
  .then(r => r.json())
  .then(m => { manifest = m; renderNav(); loadReport(); })
  .catch(() => {
    reportEl.className = 'card empty';
    reportEl.textContent = '❌ 无法加载报告清单 manifest.json';
  });

function renderNav() {
  if (!manifest) return;
  const dates = (manifest[currentMarket] || []).slice().sort().reverse(); // 最新在前
  const titles = manifest[currentMarket + '_title'] || {};
  bcMarket.textContent = MARKET_NAMES[currentMarket];
  dateNav.innerHTML = '';
  if (dates.length === 0) {
    dateNav.innerHTML = '<div class="date-item" style="cursor:default;color:var(--text2);">暂无报告</div>';
    bcDate.textContent = '暂无';
    return;
  }
  dates.forEach(d => {
    const item = document.createElement('div');
    item.className = 'date-item';
    item.dataset.date = d;
    item.textContent = d + (titles[d] ? ' · ' + titles[d] : '');
    dateNav.appendChild(item);
  });
  // 默认选中第一项（最新日期）
  dateNav.firstChild.classList.add('active');
  bcDate.textContent = dates[0];
}

function loadReport() {
  if (!manifest) return;
  const active = document.querySelector('.date-item.active');
  const d = active ? active.dataset.date : (manifest[currentMarket] || [])[0];
  if (!d) { reportEl.className = 'card empty'; reportEl.textContent = '暂无报告'; return; }
  reportEl.className = 'card loading';
  reportEl.textContent = '加载中…';
  fetch(`reports/${currentMarket}/${d}.md`)
    .then(r => { if (!r.ok) throw new Error('not found'); return r.text(); })
    .then(md => {
      reportEl.className = 'card';
      reportEl.innerHTML = marked.parse(md, { gfm: true, breaks: true });
    })
    .catch(() => {
      reportEl.className = 'card empty';
      reportEl.textContent = '❌ 未找到该日报告：' + `reports/${currentMarket}/${d}.md`;
    });
}
</script>
</body>
</html>
