<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>产业链图谱 — 5Factor AI</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
:root {
  --bg: #F5F5F7;
  --card: #FFFFFF;
  --border: #E5E5EA;
  --text: #1D1D1F;
  --text-secondary: #86868B;
  --accent: #0071E3;
  --accent-light: #5AC8FA;
  --navy: #F5F5F7;
  --up: #FF3B30;
  --down: #34C759;
  --hover-bg: #F5F5F7;
  --active-bg: rgba(0,113,227,0.15);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
  background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5;
  display: flex; min-height: 100vh;
  font-variant-numeric: tabular-nums;
}
.sidebar {
  width: 240px; min-width: 240px; background: var(--card); color: var(--text);
  display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
  overflow-y: auto; z-index: 50; border-right: 1px solid var(--border);
}
.sidebar-logo { padding: 20px 16px; font-size: 16px; font-weight: 700; letter-spacing: -0.3px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; color: var(--text); }
.sidebar-logo span { color: var(--accent); }
.sidebar-section { padding: 12px 0; }
.sidebar-title { padding: 16px 16px 8px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); }
.nav-item { padding: 10px 16px; display: flex; align-items: center; gap: 10px; color: var(--text-secondary); cursor: pointer; transition: all 0.15s ease; border-left: 4px solid transparent; font-size: 14px; font-weight: 500; margin: 0 8px; border-radius: 8px; }
.nav-item:hover { background: var(--hover-bg); color: var(--text); }
.nav-item.active { background: var(--active-bg); color: var(--accent); border-left-color: var(--accent); }
.nav-item .icon { width: 20px; text-align: center; font-size: 15px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; }
.nav-sub { padding: 8px 14px 8px 48px; display: flex; align-items: center; gap: 6px; color: var(--text-secondary); cursor: pointer; font-size: 13px; transition: all 0.15s ease; border-left: 4px solid transparent; margin: 0 8px; border-radius: 8px; }
.nav-sub:hover { color: var(--text); background: var(--hover-bg); }
.nav-sub.active { color: var(--accent); font-weight: 500; background: var(--active-bg); border-left-color: var(--accent); }
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
.topbar { background: var(--card); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 30; height: 56px; }
.search { flex: 1; max-width: 480px; display: flex; align-items: center; background: var(--bg); border-radius: 10px; padding: 7px 14px; gap: 10px; height: 40px; border: 1px solid var(--border); transition: all 0.15s; }
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,113,227,0.2); }
.search input { border: none; background: transparent; outline: none; flex: 1; font-size: 14px; color: var(--text); font-family: inherit; }
.search input::placeholder { color: #86868B; }
.user { display: flex; align-items: center; gap: 8px; margin-left: auto; font-size: 14px; color: var(--text-secondary); }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #5856D6, #AF52DE); color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; }
.content { padding: 24px 32px; max-width: 1440px; margin: 0 auto; width: 100%; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; transition: all 0.3s ease; }
.card:hover { box-shadow: 0 8px 32px rgba(0,0,0,0.08); }
.card-title { font-size: 18px; font-weight: 600; margin-bottom: 12px; color: var(--text); letter-spacing: -0.01em; line-height: 1.4; }
.card-subtitle { font-size: 14px; color: var(--text-secondary); margin-bottom: 8px; }
.tab-row { display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 16px; }
.tab-btn { padding: 10px 20px; font-size: 14px; font-weight: 600; color: var(--text-secondary); background: none; border: none; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.2s; }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-btn:hover { color: var(--accent-light); }
.tab-panel { display: none; }
.tab-panel.active { display: block; }
.industry-switcher { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.industry-btn { padding: 6px 16px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); cursor: pointer; font-size: 13px; font-family: inherit; color: var(--text-secondary); transition: all 0.2s; font-weight: 500; }
.industry-btn:hover { border-color: var(--accent); color: var(--accent); }
.industry-btn.active { background: var(--accent); color: #FFFFFF; border-color: var(--accent); }
.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 10px; font-size: 11px; font-weight: 500; }
.tag-green { background: rgba(52,199,89,0.2); color: #34C759; }
.tag-blue { background: rgba(0,113,227,0.2); color: #0071E3; }
.tag-yellow { background: rgba(255,204,0,0.2); color: #FF9500; }
.tag-red { background: rgba(255,59,48,0.2); color: #FF3B30; }
.tag-purple { background: rgba(175,82,222,0.2); color: #BF5AF2; }
.tag-gray { background: #E5E5EA; color: var(--text); }
.tree-item { padding: 6px 10px; cursor: pointer; border-radius: 8px; transition: all 0.15s; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-secondary); }
.tree-item:hover { background: var(--hover-bg); color: var(--text); }
.tree-item.active { background: var(--active-bg); color: var(--accent); font-weight: 600; }
.tree-level-1 { padding-left: 10px; font-weight: 600; color: var(--text); }
.tree-level-2 { padding-left: 24px; }
.tree-level-3 { padding-left: 38px; font-size: 12px; }
.tree-level-4 { padding-left: 52px; font-size: 12px; }
.stat-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 16px; }
.stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; text-align: center; }
.stat-value { font-size: 20px; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat-label { font-size: 11px; color: var(--text-secondary); margin-top: 2px; font-weight: 500; letter-spacing: 0.02em; }
.data-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.data-table th { text-transform: uppercase; font-size: 12px; color: var(--text-secondary); font-weight: 500; text-align: left; padding: 12px 16px; border-bottom: 2px solid var(--border); background: var(--hover-bg); letter-spacing: 0.5px; }
.data-table td { padding: 14px 16px; border-bottom: 1px solid var(--border); color: var(--text-secondary); }
.data-table tbody tr:hover { background: var(--hover-bg); }
.chart-container { width: 100%; height: 100%; min-height: 500px; }
.flex-between { display: flex; justify-content: space-between; align-items: center; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.fade-in { animation: fadeIn 0.3s ease; }
.tree-header { font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.click-hint { font-size: 12px; color: var(--text-secondary); margin-top: 8px; font-style: italic; }

/* iframe embed: hide own sidebar & topbar */
html.iframe-embed .sidebar,
html.iframe-embed .topbar {
  display: none !important;
}
html.iframe-embed .main {
  width: 100%;
}

/* Responsive */
@media (max-width: 1024px) {
  .content { padding: 20px 24px; }
  .stat-grid { grid-template-columns: repeat(3, 1fr); }
  .two-col-layout { flex-direction: column !important; height: auto !important; }
  .left-panel { width: 100% !important; max-height: 300px; }
  .right-panel { min-height: 400px; }
}
@media (max-width: 640px) {
  .sidebar { display: none; }
  .main { width: 100%; }
  .content { padding: 16px; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
}

</style>
<script>(function(){if(window.self!==window.top)document.documentElement.classList.add('iframe-embed');})();</script>

// TREE GENERATION
// ═══════════════════════════════════════════════════
function renderTree(industry) {
  const container = document.getElementById('treeContainer');
  const structure = industryStructure[industry];
  const name = industryNames[industry];
  document.getElementById('treeTitle').textContent = name + '产业树';

  if (!structure) {
    container.innerHTML = '<div style="color:var(--text-secondary);padding:12px;">暂无层级数据，点击Treemap查看赛道</div>';
    return;
  }

  let html = '';
  structure.layers.forEach((layer, li) => {
    html += `<div class="tree-item tree-level-1" data-layer="${li}"><i data-lucide="folder" style="width:14px;height:14px;"></i> ${layer.name} <span style="margin-left:auto;font-size:11px;color:var(--text-secondary);">${layer.sectors.length}赛道</span></div>`;
    layer.sectors.forEach((sector, si) => {
      const isLast = si === layer.sectors.length - 1;
      const prefix = isLast ? '└─' : '├─';
      html += `<div class="tree-item tree-level-2" data-sector="${sector}" data-layer="${li}">${prefix} ${sector}</div>`;
    });
  });

  container.innerHTML = html;

  // Add click handlers — LEFT tree only HIGHLIGHTS, does NOT navigate
  container.querySelectorAll('[data-sector]').forEach(item => {
    item.addEventListener('click', function() {
      const sector = this.dataset.sector;
      // Highlight tree item
      container.querySelectorAll('.tree-item.active').forEach(el => el.classList.remove('active'));
      this.classList.add('active');
      // Highlight corresponding chart node
      highlightSectorInChart(sector);
    });
  });
  // Re-init icons
  if (typeof lucide !== 'undefined') lucide.createIcons();
}

function highlightSectorInChart(sectorName) {
  if (!chartInstance) return;
  chartInstance.dispatchAction({ type: 'downplay' });
  chartInstance.dispatchAction({ type: 'highlight', name: sectorName });
  chartInstance.dispatchAction({ type: 'showTip', name: sectorName });
}

function navigateToSector(sectorName) {
  const encoded = encodeURIComponent(sectorName);
  window.location.href = `sector-analysis.html?sector=${encoded}&industry=${currentIndustry}`;
}

function initChart() {
  const dom = document.getElementById('chart-main');
  if (chartInstance) chartInstance.dispose();
  chartInstance = echarts.init(dom);
  renderChart(currentView);
}

function getBaseOption() {
  return {
    backgroundColor: 'transparent',
    textStyle: { fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif' },
    tooltip: {
      backgroundColor: 'rgba(255,255,255,0.95)',
      borderColor: '#E5E5EA',
      textStyle: { color: '#1D1D1F', fontSize: 13 }
    }
  };
}

function renderTreemap() {
  const data = treemapData[currentIndustry] || treemapData.ai;
  const opt = getBaseOption();
  opt.tooltip = {
    backgroundColor: 'rgba(255,255,255,0.95)',
    borderColor: '#E5E5EA',
    textStyle: { color: '#1D1D1F', fontSize: 13 },
    formatter: function(info) {
      return '<strong>' + info.name + '</strong><br/>TAM: $' + info.value + 'B<br/><small style="color:#86868B">点击查看赛道详情</small>';
    }
  };
  opt.series = [{
    type: 'treemap',
    width: '100%', height: '100%',
    roam: false, nodeClick: false,
    breadcrumb: { show: false },
    label: {
      show: true,
      formatter: function(p) {
        return p.name + '\n$' + p.value + 'B';
      },
      fontSize: 11, fontWeight: 'bold', color: '#FFFFFF'
    },
    upperLabel: { show: false },
    itemStyle: { borderColor: '#E5E5EA', borderWidth: 2, gapWidth: 2 },
    levels: [
      { itemStyle: { borderColor: '#E5E5EA', borderWidth: 3, gapWidth: 3 } },
      { colorSaturation: [0.3, 0.6], itemStyle: { borderColorSaturation: 0.5, gapWidth: 2 } }
    ],
    data: data
  }];
  chartInstance.setOption(opt, true);

  // Click to navigate
  chartInstance.off('click');
  chartInstance.on('click', function(params) {
    if (params.name) navigateToSector(params.name);
  });
}

function renderGraph() {
  const segments = treemapData[currentIndustry] || treemapData.ai;
  const nodes = segments.map(s => ({
    name: s.name,
    symbolSize: Math.max(12, Math.min(50, s.value * 0.35)),
    itemStyle: s.itemStyle || { color: '#0071E3' }
  }));

  const edgeMap = {};
  const sEdges = suppliesData[currentIndustry] || [];
  const cEdges = competesData[currentIndustry] || [];

  sEdges.forEach(e => {
    const key = e.source + '|||' + e.target;
    if (allSegmentNames[e.source] && allSegmentNames[e.target] && !edgeMap[key]) {
      edgeMap[key] = { source: e.source, target: e.target, lineStyle: { color: '#0071E3', curveness: 0.2, width: 1.5 } };
    }
  });
  cEdges.forEach(e => {
    const key = e.source + '|||' + e.target;
    if (allSegmentNames[e.source] && allSegmentNames[e.target] && !edgeMap[key]) {
      edgeMap[key] = { source: e.source, target: e.target, lineStyle: { color: '#FF3B30', curveness: 0.3, width: 1, type: 'dashed' } };
    }
  });

  const opt = getBaseOption();
  opt.tooltip = {
    backgroundColor: 'rgba(255,255,255,0.95)',
    borderColor: '#E5E5EA',
    textStyle: { color: '#1D1D1F' },
    formatter: function(p) {
      return p.dataType === 'node' ? '<b>' + p.name + '</b>' : p.source + ' → ' + p.target;
    }
  };
  opt.series = [{
    type: 'graph', layout: 'force', roam: true, draggable: true,
    force: { repulsion: 350, edgeLength: [80, 280], gravity: 0.1 },
    data: nodes, edges: Object.values(edgeMap),
    label: { show: true, fontSize: 10, color: '#1D1D1F', formatter: p => p.name.length > 8 ? p.name.slice(0,8)+'…' : p.name },
    emphasis: { focus: 'adjacency', lineStyle: { width: 3 } }
  }];
  chartInstance.setOption(opt, true);

  chartInstance.off('click');
  chartInstance.on('click', function(params) {
    if (params.dataType === 'node' && params.name) navigateToSector(params.name);
  });
}

function renderSankey() {
  const edges = suppliesData[currentIndustry] || [];
  const nodeSet = {};
  const links = [];
  edges.forEach(e => {
    if (allSegmentNames[e.source] && allSegmentNames[e.target]) {
      nodeSet[e.source] = true; nodeSet[e.target] = true;
      links.push({ source: e.source, target: e.target, value: 5 });
    }
  });
  // Fallback: if no links, create linear flow from first few nodes
  if (links.length === 0) {
    const segs = treemapData[currentIndustry] || [];
    for (let i = 0; i < Math.min(segs.length - 1, 8); i++) {
      nodeSet[segs[i].name] = true; nodeSet[segs[i+1].name] = true;
      links.push({ source: segs[i].name, target: segs[i+1].name, value: 5 });
    }
  }
  const nodes = Object.keys(nodeSet).map(n => ({ name: n }));

  const opt = getBaseOption();
  opt.tooltip = { trigger: 'item', triggerOn: 'mousemove', backgroundColor: 'rgba(255,255,255,0.95)', borderColor: '#E5E5EA', textStyle: { color: '#1D1D1F' } };
  opt.series = [{
    type: 'sankey', emphasis: { focus: 'adjacency' },
    nodeWidth: 18, nodeGap: 10, layoutIterations: 32,
    data: nodes, links: links,
    label: { fontSize: 10, color: '#1D1D1F', position: 'right' },
    lineStyle: { color: 'gradient', curveness: 0.5 }
  }];
  chartInstance.setOption(opt, true);

  // Click to navigate
  chartInstance.off('click');
  chartInstance.on('click', function(params) {
    if (params.name) navigateToSector(params.name);
  });
}

function renderCausal() {
  const edges = causalData[currentIndustry] || [];
  const nodeSet = {};
  const graphEdges = [];
  edges.forEach(e => {
    if (allSegmentNames[e.source] && allSegmentNames[e.target]) {
      nodeSet[e.source] = true; nodeSet[e.target] = true;
      graphEdges.push({
        source: e.source, target: e.target,
        lineStyle: { color: '#FF9F0A', width: 2.5, curveness: 0.2 },
        label: { show: true, formatter: '传导', fontSize: 8, color: '#FF9F0A' }
      });
    }
  });
  // Fallback
  if (graphEdges.length === 0) {
    const segs = treemapData[currentIndustry] || [];
    for (let i = 0; i < Math.min(segs.length - 1, 6); i++) {
      nodeSet[segs[i].name] = true; nodeSet[segs[i+1].name] = true;
      graphEdges.push({
        source: segs[i].name, target: segs[i+1].name,
        lineStyle: { color: '#FF9F0A', width: 2.5, curveness: 0.2 }
      });
    }
  }
  const nodes = Object.keys(nodeSet).map(n => ({
    name: n, symbolSize: 26,
    itemStyle: { color: 'rgba(255,159,10,0.15)', borderColor: '#FF9F0A', borderWidth: 2 }
  }));

  const opt = getBaseOption();
  opt.tooltip = {
    backgroundColor: 'rgba(255,255,255,0.95)', borderColor: '#E5E5EA', textStyle: { color: '#1D1D1F' },
    formatter: function(p) {
      return p.dataType === 'node' ? '<b>' + p.name + '</b>' : '<b>' + p.source + '</b> → <b>' + p.target + '</b>';
    }
  };
  opt.series = [{
    type: 'graph', layout: 'force', roam: true,
    force: { repulsion: 500, edgeLength: [120, 350], gravity: 0.06 },
    data: nodes, edges: graphEdges,
    label: { show: true, fontSize: 10, color: '#1D1D1F', formatter: p => p.name.length > 10 ? p.name.slice(0,10)+'…' : p.name },
    emphasis: { focus: 'adjacency', lineStyle: { width: 5 } }
  }];
  chartInstance.setOption(opt, true);

  // Click to navigate
  chartInstance.off('click');
  chartInstance.on('click', function(params) {
    if (params.dataType === 'node' && params.name) navigateToSector(params.name);
  });
}


function renderChart(type) {
  currentView = type;
  if (!chartInstance) initChart();
  switch (type) {
    case 'treemap': renderTreemap(); break;
    case 'graph': renderGraph(); break;
    case 'sankey': renderSankey(); break;
    case 'causal': renderCausal(); break;
  }
}

// ═══════════════════════════════════════════════════
// EVENT HANDLERS
// ═══════════════════════════════════════════════════

// Tab switching
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    renderChart(this.dataset.tab);
  });
});

// Industry switching
document.getElementById('industrySwitcher').addEventListener('click', function(e) {
  const btn = e.target.closest('.industry-btn');
  if (!btn) return;
  document.querySelectorAll('#industrySwitcher .industry-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentIndustry = btn.dataset.industry;
  document.getElementById('chartTitle').textContent = industryNames[currentIndustry] + '产业链全景';
  renderTree(currentIndustry);
  renderChart(currentView);
});

// ═══════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', function() {
  renderTree('ai');
  initChart();

  if (typeof lucide !== 'undefined') {
    lucide.createIcons();
  }
});

window.addEventListener('resize', () => {
  if (chartInstance) chartInstance.resize();
});
</script>


<script>
// Fix icon+text alignment for lucide SVG icons
(function() {
  function fixIconParents() {
    document.querySelectorAll('svg.lucide').forEach(function(svg) {
      var p = svg.parentElement;
      if (!p || p.dataset.iconFixed) return;
      var hasText = false;
      p.childNodes.forEach(function(n) {
        if (n.nodeType === 3 && n.textContent.trim()) hasText = true;
        if (n.nodeType === 1 && n !== svg && n.textContent.trim()) hasText = true;
      });
      if (hasText) {
        p.style.display = 'inline-flex';
        p.style.alignItems = 'center';
        p.style.gap = '4px';
        p.dataset.iconFixed = '1';
      }
      svg.style.flexShrink = '0';
    });
  }
  // Run after lucide renders, then watch for changes
  setTimeout(fixIconParents, 300);
  setTimeout(fixIconParents, 1000);
  if (window.MutationObserver) {
    var obs = new MutationObserver(function() { fixIconParents(); });
    obs.observe(document.body || document.documentElement, { childList: true, subtree: true });
  }
})();
</script>
