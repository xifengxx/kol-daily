<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投资知识图谱</title>
<style>/* invest_kg viewer styles */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
  background: #f0f2f5; color: #1a1a2e; height: 100vh; overflow: hidden;
}
#app { display: flex; flex-direction: column; height: 100vh; }
#topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 24px; background: #fff;
  border-bottom: 1px solid #e2e8f0; flex-shrink: 0;
}
#topbar h1 { font-size: 20px; font-weight: 700; }
#topbar .subtitle { font-size: 13px; color: #64748b; flex: 1; }
.kg-back-link {
  font-size: 13px; color: #64748b; text-decoration: none;
  padding: 2px 10px; border: 1px solid #e2e8f0; border-radius: 14px;
  transition: all .2s; margin-left: 8px;
}
.kg-back-link:hover { border-color: #3b82f6; color: #3b82f6; }
#topbar .badge {
  font-size: 11px; background: #4ade80; color: #fff;
  padding: 2px 8px; border-radius: 10px; font-weight: 600;
}
#main { display: flex; flex: 1; overflow: hidden; }

/* Left */
#left-panel {
  width: 280px; background: #fff; border-right: 1px solid #e2e8f0;
  display: flex; flex-direction: column; flex-shrink: 0;
}
.panel-header {
  font-size: 13px; font-weight: 700; color: #475569; text-transform: uppercase;
  letter-spacing: 0.5px; padding: 16px 20px 10px;
  border-bottom: 1px solid #f1f5f9;
}
#tree-nav { flex: 1; overflow-y: auto; padding: 8px 0; }
.tree-item {
  display: flex; align-items: center; padding: 6px 20px;
  cursor: pointer; font-size: 13px; color: #334155; transition: background .15s;
  border-left: 3px solid transparent;
}
.tree-item:hover { background: #f8fafc; }
.tree-item.active { background: #eff6ff; border-left-color: #3b82f6; color: #1e40af; font-weight: 600; }
.tree-item .expand { width: 18px; font-size: 10px; color: #94a3b8; flex-shrink: 0; }
.tree-item .dot {
  width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; flex-shrink: 0;
}
.tree-item.level-0 { padding-left: 12px; font-weight: 600; font-size: 14px; }
.tree-item.level-1 { padding-left: 28px; }
.tree-item.level-2 { padding-left: 44px; }
.tree-item.level-3 { padding-left: 60px; font-size: 12px; }
.tree-item.hidden { display: none; }

/* Center */
#center-panel {
  flex: 1.2; display: flex; flex-direction: column; background: #fff;
  margin: 12px; border-radius: 8px; border: 1px solid #e2e8f0; overflow: hidden;
}
.chart-tabs {
  display: flex; gap: 0; border-bottom: 1px solid #e2e8f0; flex-shrink: 0;
}
.chart-tabs .tab {
  padding: 10px 20px; border: none; background: none;
  cursor: pointer; font-size: 13px; color: #64748b;
  border-bottom: 2px solid transparent; transition: all .2s;
}
.chart-tabs .tab.active { color: #3b82f6; border-bottom-color: #3b82f6; font-weight: 600; }
.chart-tabs .tab:hover { color: #1e293b; }
#chart-container { flex: 1; min-height: 400px; }

/* Right */
#right-panel {
  flex: 1; min-width: 380px; background: #f8fafc; border-left: 1px solid #e2e8f0;
  display: flex; flex-direction: column;
}
#detail-title { padding: 14px 20px; font-weight: 700; font-size: 14px; background:#fff; border-bottom:1px solid #e2e8f0; }
#detail-content { flex: 1; overflow-y: auto; padding: 12px 0 60px 0; }
#detail-content .hint { color: #94a3b8; font-size: 14px; text-align: center; margin-top: 40px; }
/* Section cards */
.detail-card {
  background: #fff; border-radius: 8px; margin: 0 16px 10px 16px;
  border: 1px solid #e2e8f0; overflow: hidden;
  /* responsive — no max-width */
}
.detail-card .card-hdr {
  padding: 10px 14px; font-size: 12px; font-weight: 700; color: #475569;
  background: #f8fafc; border-bottom: 1px solid #f1f5f9;
  cursor: pointer; user-select: none; display: flex; align-items: center; gap: 6px;
}
.detail-card .card-hdr .icon { font-size: 14px; }
.detail-card .card-hdr .arrow { margin-left: auto; font-size: 10px; color: #94a3b8; transition: transform .2s; }
.detail-card .card-hdr.open .arrow { transform: rotate(90deg); }
.detail-card .card-body { padding: 12px 14px; display: none; }
.detail-card .card-body.open { display: block; }
/* Card variants */
.card-def { border-left: 3px solid #3b82f6; }
.card-metrics { border-left: 3px solid #6366f1; }
.card-supply { border-left: 3px solid #f59e0b; }
.card-value { border-left: 3px solid #10b981; }
.card-compete { border-left: 3px solid #ef4444; }
.card-trends { border-left: 3px solid #8b5cf6; }
.card-evidence { border-left: 3px solid #64748b; }
.card-companies { border-left: 3px solid #06b6d4; }
.card-relations { border-left: 3px solid #ec4899; }
/* In-card elements */
.def-tag {
  display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 10px;
  font-weight: 600; margin-bottom: 6px;
}
.metric-row { display: flex; gap: 8px; }
.metric-box {
  flex: 1; background: #f8fafc; border-radius: 8px; padding: 12px; text-align: center;
}
.metric-box .m-val { font-size: 20px; font-weight: 700; color: #1e293b; }
.metric-box .m-lbl { font-size: 10px; color: #94a3b8; margin-top: 2px; }
.progress-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.progress-row .p-lbl { width: 60px; font-size: 11px; color: #64748b; text-align: right; flex-shrink: 0; }
.progress-row .p-bar {
  flex: 1; height: 18px; background: #f1f5f9; border-radius: 4px; overflow: hidden; position: relative;
}
.progress-row .p-bar .p-fill { height: 100%; border-radius: 4px; position: absolute; left: 0; top: 0; }
.progress-row .p-val { width: 40px; font-size: 10px; font-weight: 600; color: #334155; flex-shrink: 0; }
.trend-list { list-style: none; padding: 0; margin: 0; }
.trend-list li {
  padding: 4px 0; font-size: 12px; color: #475569; line-height: 1.5;
  border-bottom: 1px dotted #f1f5f9;
}
.trend-list li:last-child { border-bottom: none; }
.trend-list li::before { content: '▸ '; color: #8b5cf6; font-size: 10px; }
.evidence-text { font-size: 11px; color: #64748b; line-height: 1.6; }
.conduction-box {
  background: #fffbeb; border: 1px solid #fde68a; border-radius: 6px;
  padding: 10px 12px; font-size: 11px; color: #92400e; line-height: 1.6;
}

.detail-section { margin-bottom: 20px; }
.detail-section h3 {
  font-size: 12px; color: #94a3b8; text-transform: uppercase;
  letter-spacing: 0.5px; margin-bottom: 8px;
}
.detail-name { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.detail-desc { font-size: 13px; color: #64748b; line-height: 1.6; margin-bottom: 12px; }
.detail-metrics {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px;
}
.metric-item {
  background: #f8fafc; border-radius: 6px; padding: 10px;
}
.metric-item .label { font-size: 11px; color: #94a3b8; }
.metric-item .value { font-size: 16px; font-weight: 700; color: #1e293b; }

.company-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 0; border-bottom: 1px solid #f1f5f9; font-size: 13px;
}
.company-row .cname { font-weight: 600; color: #1e293b; }
.company-row .ticker { color: #64748b; font-family: 'SF Mono',monospace; font-size: 12px; }
.company-row .role {
  font-size: 11px; padding: 1px 6px; border-radius: 4px;
}
.role-lead { background: #dcfce7; color: #16a34a; }
.role-secondary { background: #f0f9ff; color: #0369a1; }
.role-concept { background: #fef3c7; color: #d97706; }

.relation-list { list-style: none; }
.relation-list li {
  font-size: 12px; padding: 4px 0; color: #475569;
  display: flex; align-items: center; gap: 6px;
}
.relation-list .rel-badge {
  font-size: 10px; padding: 1px 5px; border-radius: 3px;
  color: #fff; white-space: nowrap; flex-shrink: 0;
}
/* Foldable sections */
.fold-section { border-bottom: 1px solid #f1f5f9; }
.fold-hdr {
  padding: 10px 0; font-size: 13px; font-weight: 600; color: #334155;
  cursor: pointer; user-select: none; display: flex; align-items: center;
}
.fold-hdr::before { content: '▸ '; width: 16px; font-size: 10px; }
.fold-hdr.active::before { content: '▾ '; }
.fold-body { display: none; padding-bottom: 10px; }

/* Industry Switcher */
#industry-switcher { display: flex; gap: 4px; margin-left: 16px; }
.ind-tab {
  padding: 4px 14px; border: 1px solid #e2e8f0; background: #fff;
  border-radius: 14px; cursor: pointer; font-size: 12px; color: #64748b;
  font-weight: 500; transition: all .2s;
}
.ind-tab:hover { border-color: #3b82f6; color: #3b82f6; }
.ind-tab.active { background: #3b82f6; color: #fff; border-color: #3b82f6; }

/* Search */
#search-wrap { position: relative; margin-left: auto; margin-right: 12px; }
#search-input {
  width: 240px; height: 28px; border-radius: 14px; border: 1px solid #e2e8f0;
  padding: 0 36px 0 14px; font-size: 12px; color: #334155;
  background: #f8fafc; outline: none; transition: all .2s;
}
#search-input:focus { border-color: #3b82f6; background: #fff; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
#search-input::placeholder { color: #94a3b8; }
#search-drop {
  position: absolute; top: 34px; right: 0; width: 360px;
  background: #fff; border: 1px solid #e2e8f0; border-radius: 8px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-height: 400px; overflow-y: auto;
  z-index: 1000;
}
.search-item {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 14px; cursor: pointer; border-bottom: 1px solid #f8fafc;
  font-size: 13px; transition: background .1s;
}
.search-item:last-child { border-bottom: none; }
.search-item:hover { background: #f8fafc; }
.search-item.active { background: #eff6ff; }
.search-item .s-icon { font-size: 14px; flex-shrink: 0; }
.search-item .s-name { font-weight: 600; color: #1e293b; }
.search-item .s-ticker { font-family: 'SF Mono', monospace; font-size: 11px; color: #64748b; }
.search-item .s-extra { font-size: 11px; color: #94a3b8; margin-left: auto; white-space: nowrap; }
.search-item .s-type-tag {
  font-size: 9px; padding: 1px 6px; border-radius: 8px; font-weight: 600; flex-shrink: 0;
}
.s-type-segment { background: #ede9fe; color: #7c3aed; }
.s-type-company { background: #dbeafe; color: #2563eb; }
.s-type-ticker  { background: #dcfce7; color: #16a34a; }
.search-empty { padding: 20px; text-align: center; color: #94a3b8; font-size: 13px; }
</style>
</head>

      <div id="detail-content">

      </div>
    </aside>
  </div>
</div>

<script>// invest_kg viewer logic — extracted from viewer.py
// Pure ES5 for maximum compatibility
var DATA, LC, RC, currentChart='treemap', selectedSlug=null, selectedType=null, chartInstance=null, currentIndustry='ai-computing';
var chartCache = {};  // { 'industry:chartType': option } — in-memory chart option cache

(function() {
  try {
    var el = document.getElementById('kg-data');
    if (!el) throw new Error('kg-data element not found');
    DATA = JSON.parse(el.textContent);
    LC = DATA.layerColors || {};
    RC = DATA.relationColors || {};
  } catch(e) { document.body.innerHTML += '<div style=\"position:fixed;top:0;left:0;right:0;background:red;color:#fff;padding:8px;z-index:9999\">JSON Error: '+e.message+'</div>'; }
})();

function getCurData() { return DATA.industries && DATA.industries[currentIndustry] ? DATA.industries[currentIndustry] : null; }

document.addEventListener('DOMContentLoaded', function() {
  try { buildTreeNav(); } catch(e) { document.getElementById('tree-nav').innerHTML = '<div style=\"color:red;padding:12px\">Tree Error: '+e.message+'</div>'; }
  try { buildSearchIndex(); } catch(e) { console.log('Search index error:', e.message); }
  try { renderChart('treemap'); } catch(e) { document.getElementById('chart-container').innerHTML = '<div style=\"color:red;padding:40px\">Chart Error: '+e.message+'</div>'; }
  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].addEventListener('click', function() { switchTab(this); });
  }
  initSearch();
  // Industry tabs
  var itabs = document.querySelectorAll('.ind-tab');
  for (var ii = 0; ii < itabs.length; ii++) {
    itabs[ii].addEventListener('click', function() {
      switchIndustry(this.getAttribute('data-ind'));
    });
  }
  // URL hash routing
  initFromHash();
});

function switchIndustry(slug) {
  if (slug === currentIndustry) return;
  currentIndustry = slug;
  selectedSlug = null; selectedType = null;
  chartCache = {};  // Invalidate all chart caches on industry switch
  // Update tabs
  var itabs = document.querySelectorAll('.ind-tab');
  for (var i = 0; i < itabs.length; i++) {
    itabs[i].classList.remove('active');
    if (itabs[i].getAttribute('data-ind') === slug) itabs[i].classList.add('active');
  }
  // Update subtitle
  var subtitle = document.querySelector('#topbar .subtitle');
  if (subtitle) {
    subtitle.textContent = slug === 'ai-computing' ? 'AI 算力产业链 · 四层全景' : '半导体产业链 · 四层全景';
  }
  // Rebuild tree + chart + clear detail
  buildTreeNav();
  renderChart(currentChart);
  document.getElementById('detail-title').textContent = '选择节点查看详情';
  document.getElementById('detail-content').innerHTML = '<p class=\"hint\">👈 点击左侧赛道或图中节点</p>';
  // Rebuild search index for both industries
  buildSearchIndex();
}

function switchTab(tab) {
  var all = document.querySelectorAll('.tab');
  for (var i = 0; i < all.length; i++) all[i].classList.remove('active');
  tab.classList.add('active');
  renderChart(tab.getAttribute('data-chart'));
}

// ── Tree ────────────────────────────────────────────────
function buildTreeNav() {
  var nav = document.getElementById('tree-nav');
  var cd = getCurData();
  if (!cd) { nav.innerHTML = '<div style=\"padding:12px;color:#94a3b8\">(no data)</div>'; return; }
  var tree = cd.tree;
  if (!tree || !tree.children || !tree.children.length) { nav.innerHTML = '<div style=\"padding:12px;color:#94a3b8\">(empty)</div>'; return; }
  nav.innerHTML = '';
  for (var li = 0; li < tree.children.length; li++) {
    (function(layer) {
      var div = makeTreeItem(layer.name, 'layer', 1, LC[layer.level]||'#999', layer, true);
      nav.appendChild(div);
      if (layer.children && layer.children.length) {
        for (var si = 0; si < layer.children.length; si++) {
          (function(seg) {
            var sdiv = makeTreeItem(seg.name, 'segment', 2, LC[layer.level]||'#999', seg, false);
            nav.appendChild(sdiv);
            if (seg.children && seg.children.length) {
              for (var ssi = 0; ssi < seg.children.length; ssi++) {
                (function(sub) {
                  var ssdiv = makeTreeItem(sub.name, 'segment', 3, LC[layer.level]||'#999', sub, false);
                  nav.appendChild(ssdiv);
                })(seg.children[ssi]);
              }
            }
          })(layer.children[si]);
        }
      }
    })(tree.children[li]);
  }
}

function makeTreeItem(name, type, level, color, data, isBold) {
  var div = document.createElement('div');
  div.className = 'tree-item';
  div.style.cursor = 'pointer';
  div.style.padding = '6px 12px';
  if (level === 1) { div.style.paddingLeft = '12px'; div.style.fontWeight = '600'; div.style.fontSize = '14px'; }
  else if (level === 2) { div.style.paddingLeft = '32px'; div.style.fontSize = '13px'; }
  else { div.style.paddingLeft = '48px'; div.style.fontSize = '12px'; }

  if (level > 1) {
    var dot = document.createElement('span');
    dot.style.display = 'inline-block';
    dot.style.width = '10px';
    dot.style.height = '10px';
    dot.style.borderRadius = '50%';
    dot.style.background = color;
    dot.style.marginRight = '8px';
    div.appendChild(dot);
  }
  div.setAttribute('data-slug', data.slug || '');
  div.appendChild(document.createTextNode(name));

  div.addEventListener('click', function(e) {
    e.stopPropagation();
    var items = document.querySelectorAll('.tree-item');
    for (var i = 0; i < items.length; i++) items[i].classList.remove('active');
    div.classList.add('active');
    selectedSlug = data.slug;
    selectedType = type;
    if (type === 'segment') { showSegmentDetail(data); renderChart(currentChart); }
    updateHash();
  });
  return div;
}

// ── Chart ───────────────────────────────────────────────
function renderChart(type) {
  currentChart = type;
  var dom = document.getElementById('chart-container');
  if (chartInstance) { chartInstance.dispose(); chartInstance = null; }
  if (typeof echarts === 'undefined') { dom.innerHTML = '<div style=\"padding:40px;color:#ef4444\">ECharts not loaded</div>'; return; }

  dom.style.minHeight = '500px';
  chartInstance = echarts.init(dom);

  if (type === 'treemap') renderTreemap();
  else if (type === 'graph') renderGraph();
  else if (type === 'sankey') renderSankey();
  else if (type === 'causal') renderCausal();

  // Highlight selected node after render
  highlightSelected();

  chartInstance.on('click', function(params) {
    if (!params.data || !params.data.slug) return;
    selectedSlug = params.data.slug;
    selectedType = params.data.type;
    // Update left tree active state
    updateTreeActive(params.data.slug);
    if (params.data.type === 'segment') {
      var seg = findBySlug(params.data.slug, 'segment');
      if (seg) showSegmentDetail(seg);
    } else if (params.data.type === 'company') {
      var comp = findBySlug(params.data.slug, 'company');
      if (comp) showCompanyDetail(comp);
    }
    highlightSelected();
    updateHash();
  });
}

function highlightSelected() {
  if (!chartInstance || !selectedSlug) return;
  // Clear previous highlights
  chartInstance.dispatchAction({ type: 'downplay', seriesIndex: 0 });
  // Resolve slug to display name
  var highlightName = selectedSlug;
  if (selectedType === 'segment') {
    var seg = findBySlug(selectedSlug, 'segment');
    if (seg) highlightName = seg.name;
  } else if (selectedType === 'company') {
    var comp = findBySlug(selectedSlug, 'company');
    if (comp) highlightName = comp.name;
  }
  chartInstance.dispatchAction({ type: 'highlight', seriesIndex: 0, name: highlightName });
}

function updateTreeActive(slug) {
  var items = document.querySelectorAll('.tree-item');
  for (var i = 0; i < items.length; i++) items[i].classList.remove('active');
  // Find matching tree item by data-slug
  for (var j = 0; j < items.length; j++) {
    if (items[j].getAttribute('data-slug') === slug) {
      items[j].classList.add('active');
      items[j].scrollIntoView({block: 'nearest'});
      break;
    }
  }
}

function findBySlug(slug, type) {
  if (type === 'segment') {
    var cd = getCurData();
    var segs = (cd && cd.segments) ? cd.segments : [];
    for (var i = 0; i < segs.length; i++) { if (segs[i].slug === slug) return segs[i]; }
  } else {
    var cd2 = getCurData();
    var segs2 = (cd2 && cd2.segments) ? cd2.segments : [];
    for (var i = 0; i < segs2.length; i++) {
      var comps = segs2[i].companies || [];
      for (var j = 0; j < comps.length; j++) { if (comps[j].slug === slug) return comps[j]; }
    }
  }
  return null;
}

// ── Treemap ─────────────────────────────────────────────
function renderTreemap() {
  var cd = getCurData();
  var segs = (cd && cd.segments) ? cd.segments : [];
  // Build parent→children map
  var childrenMap = {};
  var allSegs = {};
  for (var i = 0; i < segs.length; i++) {
    var s = segs[i];
    allSegs[s.slug] = s;
    // parent_id is stored in the raw data but not exported.
    // We use parent_id from the seg object if available.
    // For now, use tree structure to determine nesting
  }

  // Use tree data for proper nesting
  var tree = cd ? cd.tree : null;
  var treemapRoot = { name: 'AI Computing', children: [] };

  if (tree && tree.children) {
    for (var li = 0; li < tree.children.length; li++) {
      var layer = tree.children[li];
      if (layer.children) {
        for (var si = 0; si < layer.children.length; si++) {
          var seg = layer.children[si];
          var node = makeTreemapNode(seg);
          treemapRoot.children.push(node);
        }
      }
    }
  }

  // Fallback: use flat segments
  if (!treemapRoot.children.length) {
    for (var j = 0; j < segs.length; j++) {
      var fs = segs[j];
      if (!fs.tAM_bn) continue;
      treemapRoot.children.push(makeTreemapNode(fs));
    }
  }

  chartInstance.setOption({
    tooltip: {
      formatter: function(p) {
        if (!p.data || !p.data.tAM_bn) return p.name;
        return '<b>'+p.name+'</b><br/>Market: $'+p.data.tAM_bn+'B<br/>CAGR: '+p.data.cagr_pct+'%<br/>Margin: '+p.data.margin_profile+'<br/>Companies: '+p.data.company_count;
      }
    },
    series: [{
      type: 'treemap', roam: false, width: '100%', height: '100%',
      nodeClick: false,
      label: { show: true, formatter: '{b}', fontSize: 16, ellipsis: true, overflow: 'truncate' },
      upperLabel: { show: false },
      itemStyle: { borderColor: '#fff', borderWidth: 2 },
      emphasis: {
        itemStyle: { borderColor: '#1e40af', borderWidth: 3, shadowBlur: 8, shadowColor: 'rgba(30,64,175,0.4)' },
        label: { fontWeight: 'bold', fontSize: 20 }
      },
      levels: [
        { itemStyle: { gapWidth: 3 }, label: { fontSize: 16 } },
        { itemStyle: { gapWidth: 2 }, label: { fontSize: 14 } },
        { itemStyle: { gapWidth: 1 }, label: { fontSize: 12 } },
      ],
      data: [treemapRoot]
    }]
  });
}

function makeTreemapNode(seg) {
  var node = {
    name: seg.name, value: seg.tAM_bn || 1, slug: seg.slug, type: 'segment',
    itemStyle: { color: LC[seg.layer_id] || '#999' },
    tAM_bn: seg.tAM_bn, cagr_pct: seg.cagr_pct, margin_profile: seg.margin_profile || '',
    company_count: (seg.companies||[]).length
  };
  if (seg.children && seg.children.length) {
    node.children = [];
    for (var i = 0; i < seg.children.length; i++) {
      node.children.push(makeTreemapNode(seg.children[i]));
    }
  }
  return node;
}

// ── Graph ────────────────────────────────────────────────
function renderGraph() {
  var cd = getCurData();
  var segs = (cd && cd.segments) ? cd.segments : [];
  var rels = [];
  var allRels = (cd && cd.relations) ? cd.relations : [];
  for (var r = 0; r < allRels.length; r++) rels.push(allRels[r]);

  // Focus filter
  if (selectedSlug && selectedType === 'segment') {
    var related = {};
    related[selectedSlug] = true;
    for (var ri = 0; ri < rels.length; ri++) {
      if (rels[ri].from_slug === selectedSlug) related[rels[ri].to_slug] = true;
      if (rels[ri].to_slug === selectedSlug) related[rels[ri].from_slug] = true;
    }
    var filteredSegs = [];
    for (var si = 0; si < segs.length; si++) { if (related[segs[si].slug]) filteredSegs.push(segs[si]); }
    segs = filteredSegs;
    var filteredRels = [];
    for (var rj = 0; rj < rels.length; rj++) { if (related[rels[rj].from_slug] && related[rels[rj].to_slug]) filteredRels.push(rels[rj]); }
    rels = filteredRels;
  }

  var nodes = [];
  var slugMap = {};
  for (var ni = 0; ni < segs.length; ni++) {
    var s = segs[ni];
    slugMap[s.slug] = s;
    nodes.push({
      id: s.slug, name: s.name, slug: s.slug, type: 'segment',
      symbolSize: Math.max(18, Math.min(50, (s.tAM_bn||3) * 0.4)),
      itemStyle: { color: LC[s.layer_id] || '#999' },
      category: (s.layer_id||1) - 1,
      label: { show: true, fontSize: 10, formatter: '{b}' }
    });
  }

  var links = [];
  var seenLinks = {};
  for (var li = 0; li < rels.length; li++) {
    var rel = rels[li];
    var key = rel.from_slug + '|' + rel.to_slug + '|' + rel.relation_type;
    if (seenLinks[key]) continue;
    seenLinks[key] = true;
    if (!slugMap[rel.from_slug] && !slugMap[rel.to_slug]) continue;
    links.push({
      source: rel.from_slug, target: rel.to_slug,
      lineStyle: { color: RC[rel.relation_type] || '#999', width: Math.max(1, (rel.strength||1)*0.6), opacity: 0.7 },
      label: { show: false }
    });
  }

  var layers = DATA.layers || [];
  var categories = [];
  for (var ci = 0; ci < layers.length; ci++) {
    categories.push({ name: layers[ci][1], itemStyle: { color: LC[layers[ci][0]] || '#999' } });
  }

  chartInstance.setOption({
    tooltip: { formatter: function(p) { return p.data.type==='segment' ? '<b>'+p.name+'</b>' : p.name; } },
    legend: { data: (function(){var d=[];for(var i=0;i<categories.length;i++)d.push(categories[i].name);return d;})(), bottom: 0, textStyle: { fontSize: 11 } },
    series: [{
      type: 'graph', layout: 'force', roam: true, draggable: true,
      categories: categories,
      force: { repulsion: 300, edgeLength: [80, 200], gravity: 0.15 },
      data: nodes, links: links,
      lineStyle: { opacity: 0.7, curveness: 0.15 },
      emphasis: { focus: 'adjacency', lineStyle: { width: 3 } }
    }]
  });
}

// ── Sankey ───────────────────────────────────────────────
function renderSankey() {
  var cd = getCurData();
  var allRels = (cd && cd.relations) ? cd.relations : [];
  var sankeyRels = [];
  for (var i = 0; i < allRels.length; i++) {
    var r = allRels[i];
    if (r.from_type === 'segment' && r.to_type === 'segment' &&
        r.relation_type === 'supplies_to') {
      sankeyRels.push(r);
    }
  }

  // Remove cycles: keep only highest-strength edge for any pair (undirected)
  var edgeMap = {};
  var cleanRels = [];
  for (var j = 0; j < sankeyRels.length; j++) {
    var rel = sankeyRels[j];
    var a = rel.from_name||rel.from_slug;
    var b = rel.to_name||rel.to_slug;
    var key = a < b ? a + '|||' + b : b + '|||' + a;
    var existing = edgeMap[key];
    if (!existing || (rel.strength||0) > (existing.strength||0)) {
      edgeMap[key] = rel;
    }
  }
  for (var k in edgeMap) { if (edgeMap.hasOwnProperty(k)) cleanRels.push(edgeMap[k]); }

  var nameSet = {};
  var links = [];
  for (var jj = 0; jj < cleanRels.length; jj++) {
    var rel2 = cleanRels[jj];
    nameSet[rel2.from_name||rel2.from_slug] = true;
    nameSet[rel2.to_name||rel2.to_slug] = true;
    links.push({
      source: rel2.from_name||rel2.from_slug, target: rel2.to_name||rel2.to_slug,
      value: rel2.strength||1,
      lineStyle: { color: RC[rel2.relation_type]||'#999', opacity: 0.4 }
    });
  }

  var nodes = [];
  for (var key2 in nameSet) {
    if (nameSet.hasOwnProperty(key2)) nodes.push({ name: key2 });
  }

  chartInstance.setOption({
    tooltip: { trigger: 'item', triggerOn: 'mousemove' },
    series: [{
      type: 'sankey', emphasis: { focus: 'adjacency' },
      nodeAlign: 'left', data: nodes, links: links,
      nodeWidth: 15, nodeGap: 8,
      label: { fontSize: 11, show: true, distance: 6 }, lineStyle: { curveness: 0.5, opacity: 0.4 }
    }]
  });
}

// ── Causal Chain ───────────────────────────────────────────
function renderCausal() {
  var cd = getCurData();
  var allRels = (cd && cd.relations) ? cd.relations : [];
  var causalRels = [];
  var seen = {};
  for (var i = 0; i < allRels.length; i++) {
    var r = allRels[i];
    if (r.relation_type === 'leads_to' && r.from_type === 'segment' && r.to_type === 'segment') {
      var key = r.from_slug + '|' + r.to_slug;
      if (!seen[key]) { seen[key] = true; causalRels.push(r); }
    }
  }

  // Collect unique segments
  var slugMap = {};
  var cdCausal = getCurData();
  var segs = (cdCausal && cdCausal.segments) ? cdCausal.segments : [];
  var segInfoMap = {};
  for (var si = 0; si < segs.length; si++) {
    segInfoMap[segs[si].slug] = segs[si];
  }

  for (var j = 0; j < causalRels.length; j++) {
    var cr = causalRels[j];
    if (!slugMap[cr.from_slug]) slugMap[cr.from_slug] = {slug: cr.from_slug, name: cr.from_name, layer_id: (segInfoMap[cr.from_slug]||{}).layer_id};
    if (!slugMap[cr.to_slug]) slugMap[cr.to_slug] = {slug: cr.to_slug, name: cr.to_name, layer_id: (segInfoMap[cr.to_slug]||{}).layer_id};
  }

  // Build nodes
  var nodes = [];
  for (var k in slugMap) {
    if (!slugMap.hasOwnProperty(k)) continue;
    var info = slugMap[k];
    var segInfo = segInfoMap[k] || {};
    nodes.push({
      id: k, name: info.name, slug: k, type: 'segment',
      symbolSize: Math.max(18, Math.min(50, (segInfo.tAM_bn || 3) * 0.5)),
      itemStyle: { color: LC[segInfo.layer_id] || '#999' },
      category: (segInfo.layer_id || 1) - 1,
      label: { show: true, fontSize: 10, formatter: '{b}' }
    });
  }

  // Build edges — dashed orange arrows with evidence tooltip
  var links = [];
  for (var ei = 0; ei < causalRels.length; ei++) {
    var edge = causalRels[ei];
    links.push({
      source: edge.from_slug, target: edge.to_slug,
      lineStyle: { type: 'dashed', color: '#f59e0b', width: Math.max(1.5, (edge.strength||5)*0.3), opacity: 0.8, curveness: 0.2 },
      evidence: edge.evidence || '',
      symbol: ['none', 'arrow'],
      symbolSize: [0, 10]
    });
  }

  // Layer categories for legend
  var layers = DATA.layers || [];
  var categories = [];
  for (var ci = 0; ci < layers.length; ci++) {
    categories.push({ name: layers[ci][1], itemStyle: { color: LC[layers[ci][0]] || '#999' } });
  }

  chartInstance.setOption({
    tooltip: {
      formatter: function(p) {
        if (p.dataType === 'edge') {
          return '<b>' + (p.data.source||'') + ' ⇒ ' + (p.data.target||'') + '</b><br/><span style=\"font-size:11px;color:#92400e\">' + (p.data.evidence||'') + '</span>';
        }
        if (p.data && p.data.type === 'segment') {
          var seg = segInfoMap[p.data.slug] || {};
          return '<b>' + p.name + '</b><br/>TAM: $' + (seg.tAM_bn||'?') + 'B<br/>CAGR: ' + (seg.cagr_pct||'?') + '%';
        }
        return p.name;
      }
    },
    legend: { data: (function(){var d=[];for(var i=0;i<categories.length;i++)d.push(categories[i].name);return d;})(), bottom: 0, textStyle:{fontSize:11} },
    series: [{
      type: 'graph', layout: 'force', roam: true, draggable: true,
      categories: categories,
      force: { repulsion: 350, edgeLength: [100, 250], gravity: 0.1 },
      data: nodes, links: links,
      edgeSymbol: ['none', 'arrow'],
      edgeSymbolSize: [0, 12],
      lineStyle: { opacity: 0.7, curveness: 0.2 },
      emphasis: { focus: 'adjacency', lineStyle: { width: 4, opacity: 1 } }
    }]
  });
}

      if (sec.icon === '⚔') {

  var comp = findBySlug(slug, 'company');

function clickRel(slug, type) {
  if (type === 'segment') {
    var seg = findBySlug(slug, 'segment');
    if (seg) {
      selectedSlug = slug; selectedType = 'segment';
      showSegmentDetail(seg);
      // Switch to 关系网络 tab and render
      var tabs = document.querySelectorAll('.tab');
      for (var ti = 0; ti < tabs.length; ti++) {
        tabs[ti].classList.remove('active');
        if (tabs[ti].getAttribute('data-chart') === 'graph') tabs[ti].classList.add('active');
      }
      renderChart('graph');
    }
  }
}

var EN_TO_CN = {};
(function() {
  for (var cn in CN_ALIASES) {
    if (!CN_ALIASES.hasOwnProperty(cn)) continue;
    var en = CN_ALIASES[cn].toLowerCase();
    if (!EN_TO_CN[en]) EN_TO_CN[en] = [];
    EN_TO_CN[en].push(cn);
  }
})();

function findCNAliases(name, slug) {
  // Find Chinese aliases for this entity from its slug and name
  var result = [];
  var slugLower = (slug || '').toLowerCase();
  var nameLower = (name || '').toLowerCase();
  // Normalize: remove hyphens for matching
  var slugNorm = slugLower.replace(/-/g, ' ');
  var nameNorm = nameLower.replace(/-/g, ' ');
  // Direct slug match
  if (EN_TO_CN[slugLower]) result = result.concat(EN_TO_CN[slugLower]);
  if (slugNorm !== slugLower && EN_TO_CN[slugNorm]) result = result.concat(EN_TO_CN[slugNorm]);
  // Also check name words against reverse map
  for (var en in EN_TO_CN) {
    if (!EN_TO_CN.hasOwnProperty(en)) continue;
    if (nameNorm.indexOf(en) >= 0 || slugNorm.indexOf(en) >= 0) {
      for (var i = 0; i < EN_TO_CN[en].length; i++) {
        if (result.indexOf(EN_TO_CN[en][i]) < 0) result.push(EN_TO_CN[en][i]);
      }
    }
    if (en.indexOf(slugNorm) >= 0 || en.indexOf(nameNorm) >= 0) {
      for (var j = 0; j < EN_TO_CN[en].length; j++) {
        if (result.indexOf(EN_TO_CN[en][j]) < 0) result.push(EN_TO_CN[en][j]);
      }
    }
  }
  return result;
}

  for (var k in map) { if (map.hasOwnProperty(k)) PY_INITIALS[k] = map[k]; }
})();

function getPyInitials(text) {
  var result = '';
  for (var i = 0; i < text.length; i++) {
    var ch = text.charAt(i);
    if (PY_INITIALS[ch]) result += PY_INITIALS[ch];
  }
  return result.toLowerCase();
}

function buildSearchIndex() {
  SEARCH_INDEX = [];
  // Search across all industries
  var inds = DATA.industries || {};
  for (var ik in inds) {
    if (!inds.hasOwnProperty(ik)) continue;
    var indData = inds[ik];
    var indName = ik === 'ai-computing' ? 'AI算力' : '半导体';
    var tree = indData.tree;
    if (!tree || !tree.children) continue;

    function walkSegments(node) {
      if (node.type === 'segment') {
        var pinyin = getPyInitials(node.name);
        var cnNames = findCNAliases(node.name, node.slug);
        var cnNamesStr = cnNames.join(' ');
        SEARCH_INDEX.push({
          type: 'segment', name: node.name, slug: node.slug,
          ticker: '', industry: indName,
          keywords: (node.name + ' ' + node.slug + ' ' + cnNamesStr).toLowerCase(),
          pinyin: pinyin, alias: cnNamesStr.toLowerCase(),
          matchScore: 0
        });
        if (node.companies && node.companies.length) {
          for (var ci = 0; ci < node.companies.length; ci++) {
            var c = node.companies[ci];
            var cpy = getPyInitials(c.name);
            var ccnNames = findCNAliases(c.name, c.slug);
            var ccnNamesStr = ccnNames.join(' ');
            SEARCH_INDEX.push({
              type: 'company', name: c.name, slug: c.slug,
              ticker: c.ticker || '', industry: indName,
              keywords: (c.name + ' ' + c.slug + ' ' + (c.ticker||'') + ' ' + ccnNamesStr).toLowerCase(),
              pinyin: cpy, alias: ccnNamesStr.toLowerCase(),
              matchScore: 0
            });
          }
        }
      }
      if (node.children && node.children.length) {
        for (var i = 0; i < node.children.length; i++) walkSegments(node.children[i]);
      }
    }

    if (tree.children) {
      for (var li = 0; li < tree.children.length; li++) {
        if (tree.children[li].children) {
          for (var si = 0; si < tree.children[li].children.length; si++) {
            walkSegments(tree.children[li].children[si]);
          }
        }
      }
    }
  }
}

function initSearch() {
  var input = document.getElementById('search-input');
  if (!input) return;

  input.addEventListener('input', function() {
    if (searchTimer) clearTimeout(searchTimer);
    var q = input.value;
    searchTimer = setTimeout(function() { doSearch(q); }, 200);
  });

  input.addEventListener('keydown', function(e) {
    var drop = document.getElementById('search-drop');
    if (drop.style.display === 'none') return;
    var items = drop.querySelectorAll('.search-item');
    if (!items.length) return;

    var activeIdx = -1;
    for (var i = 0; i < items.length; i++) {
      if (items[i].classList.contains('active')) { activeIdx = i; break; }
    }

    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (activeIdx >= 0) items[activeIdx].classList.remove('active');
      activeIdx = activeIdx + 1 >= items.length ? 0 : activeIdx + 1;
      items[activeIdx].classList.add('active');
      items[activeIdx].scrollIntoView({block: 'nearest'});
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (activeIdx >= 0) items[activeIdx].classList.remove('active');
      activeIdx = activeIdx - 1 < 0 ? items.length - 1 : activeIdx - 1;
      items[activeIdx].classList.add('active');
      items[activeIdx].scrollIntoView({block: 'nearest'});
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (activeIdx >= 0) {
        var item = items[activeIdx];
        selectResult({slug: item.getAttribute('data-slug'), type: item.getAttribute('data-type'), industry: item.getAttribute('data-ind')});
      } else if (items.length === 1) {
        selectResult({slug: items[0].getAttribute('data-slug'), type: items[0].getAttribute('data-type'), industry: items[0].getAttribute('data-ind')});
      }
    } else if (e.key === 'Escape') {
      closeSearch();
    }
  });

  // Click outside to close
  document.addEventListener('click', function(e) {
    var wrap = document.getElementById('search-wrap');
    if (wrap && !wrap.contains(e.target)) {
      document.getElementById('search-drop').style.display = 'none';
    }
  });
}

function doSearch(query) {
  var drop = document.getElementById('search-drop');
  var q = query.trim().toLowerCase();
  if (!q) { drop.style.display = 'none'; return; }

  // Multi-layer matching with scoring
  var results = [];
  var seen = {};
  for (var i = 0; i < SEARCH_INDEX.length; i++) {
    var item = SEARCH_INDEX[i];
    var key = item.type + '|' + item.slug;
    if (seen[key]) continue;

    var score = 0;
    // Layer 1: Exact slug match (highest priority)
    if (item.slug === q) score = 100;
    // Layer 2: Slug starts with query
    else if (item.slug.indexOf(q) === 0) score = 80;
    // Layer 3: Name prefix match
    else if (item.name.toLowerCase().indexOf(q) === 0) score = 70;
    // Layer 4: Ticker exact match
    else if (item.ticker.toLowerCase() === q) score = 65;
    // Layer 5: Keywords substring match
    else if (item.keywords.indexOf(q) >= 0) score = 50;
    // Layer 6: Pinyin initials match (e.g., "tjd" → 台积电)
    else if (item.pinyin && item.pinyin.indexOf(q) >= 0) score = 35;
    // Layer 7: Alias match (e.g., "英伟达" → NVIDIA)
    else if (item.alias && item.alias.indexOf(q) >= 0) score = 30;
    // Layer 8: Query inside name (partial match)
    else if (item.name.toLowerCase().indexOf(q) >= 0) score = 25;

    if (score > 0) {
      seen[key] = true;
      item.matchScore = score;
      results.push(item);
    }
  }

  // Sort: highest score first, then segments before companies, then alphabetically
  results.sort(function(a, b) {
    if (a.matchScore !== b.matchScore) return b.matchScore - a.matchScore;
    if (a.type !== b.type) return a.type === 'segment' ? -1 : 1;
    return a.name < b.name ? -1 : 1;
  });

  // Limit: 25 results (up from 15)
  if (results.length > 25) results = results.slice(0, 25);

  renderDrop(results);
}

function renderDrop(results) {
  var drop = document.getElementById('search-drop');
  if (!results.length) {
    drop.innerHTML = '<div class="search-empty">未找到匹配项</div>';
    drop.style.display = 'block';
    return;
  }

  var html = '';
  for (var i = 0; i < results.length; i++) {
    var r = results[i];
    var icon, typeTag, typeClass;
    if (r.type === 'segment') { icon = '📦'; typeTag = '赛道'; typeClass = 's-type-segment'; }
    else if (r.type === 'company') { icon = '🏢'; typeTag = '公司'; typeClass = 's-type-company'; }
    else { icon = '💹'; typeTag = '代码'; typeClass = 's-type-ticker'; }

    var extra = '';
    if (r.type === 'company' && r.ticker) extra = r.ticker + ' · ';
    html += '<div class="search-item" data-slug="' + r.slug + '" data-type="' + r.type + '" data-ind="' + (r.industry==='半导体'?'semiconductor':'ai-computing') + '" onclick="var t=this;selectResult({slug:t.getAttribute(&apos;data-slug&apos;),type:t.getAttribute(&apos;data-type&apos;),industry:t.getAttribute(&apos;data-ind&apos;)})">';
    html += '<span class="s-icon">' + icon + '</span>';
    html += '<span class="s-name">' + r.name + '</span>';
    html += '<span class="s-type-tag ' + typeClass + '">' + typeTag + '</span>';
    if (r.industry) html += '<span class="s-extra">' + r.industry + '</span>';
    if (r.ticker) html += '<span class="s-ticker">' + r.ticker + '</span>';
    html += '</div>';
  }
  drop.innerHTML = html;
  drop.style.display = 'block';
}

function selectResult(item) {
  var slug = item.slug;
  var type = item.type;
  // Switch industry if needed
  if (item.industry && item.industry !== currentIndustry) {
    switchIndustry(item.industry);
  }

  if (type === 'segment') {
    var seg = findBySlug(slug, 'segment');
    if (seg) {
      selectedSlug = slug; selectedType = 'segment';
      showSegmentDetail(seg);
      highlightTreeItem(slug);
      // Switch to graph for context
      var tabs = document.querySelectorAll('.tab');
      for (var ti = 0; ti < tabs.length; ti++) {
        tabs[ti].classList.remove('active');
        if (tabs[ti].getAttribute('data-chart') === 'graph') tabs[ti].classList.add('active');
      }
      renderChart('graph');
      updateHash();
    }
  } else if (type === 'company') {
    var comp = findBySlug(slug, 'company');
    if (comp) {
      selectedSlug = slug; selectedType = 'company';
      showCompanyDetail(comp);
      highlightTreeItem(slug);
      updateHash();
    }
  }

  closeSearch();
}

function highlightTreeItem(slug) {
  var items = document.querySelectorAll('.tree-item');
  for (var i = 0; i < items.length; i++) items[i].classList.remove('active');
  // Find by data-slug
  for (var j = 0; j < items.length; j++) {
    if (items[j].getAttribute('data-slug') === slug) {
      items[j].classList.add('active');
      items[j].scrollIntoView({block: 'nearest'});
      break;
    }
  }
}

function closeSearch() {
  document.getElementById('search-input').value = '';
  document.getElementById('search-drop').style.display = 'none';
  document.getElementById('search-drop').innerHTML = '';
}

// ── URL Hash Routing ──────────────────────────────────────
function updateHash() {
  var hash = currentIndustry + '/' + currentChart;
  if (selectedSlug) hash += '/' + selectedSlug;
  window.location.hash = hash;
}

function initFromHash() {
  var hash = window.location.hash.replace('#', '');
  if (!hash) return;
  var parts = hash.split('/');
  // Part 0: industry slug
  if (parts[0] && DATA.industries && DATA.industries[parts[0]]) {
    if (parts[0] !== currentIndustry) switchIndustry(parts[0]);
  }
  // Part 1: chart type
  if (parts[1] && ['treemap','graph','sankey','causal'].indexOf(parts[1]) >= 0) {
    currentChart = parts[1];
    var tabs = document.querySelectorAll('.tab');
    for (var ti = 0; ti < tabs.length; ti++) {
      tabs[ti].classList.remove('active');
      if (tabs[ti].getAttribute('data-chart') === parts[1]) tabs[ti].classList.add('active');
    }
  }
  // Part 2: selected node slug
  if (parts[2]) {
    selectedSlug = parts[2];
    setTimeout(function() {
      var seg = findBySlug(selectedSlug, 'segment');
      if (seg) {
        selectedType = 'segment';
        showSegmentDetail(seg);
      } else {
        var comp = findBySlug(selectedSlug, 'company');
        if (comp) {
          selectedType = 'company';
          showCompanyDetail(comp);
        }
      }
      highlightTreeItem(selectedSlug);
      renderChart(currentChart);
    }, 100);
  } else {
    renderChart(currentChart);
  }
}

window.addEventListener('hashchange', function() {
  initFromHash();
});
</script>
