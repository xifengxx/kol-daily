<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投资知识图谱 · AI算力</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
  background: #f0f2f5; color: #1a1a2e; height: 100vh; overflow: hidden;
}
#app { display: flex; flex-direction: column; height: 100vh; }
#topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 24px; background: #fff;
  border-bottom: 1px solid #e2e8f0; flex-shrink: 0;
}
#topbar h1 { font-size: 20px; font-weight: 700; }
#topbar .subtitle { font-size: 13px; color: #64748b; flex: 1; }
#topbar .badge {
  font-size: 11px; background: #4ade80; color: #fff;
  padding: 2px 8px; border-radius: 10px; font-weight: 600;
}
#main { display: flex; flex: 1; overflow: hidden; }

/* Left */
#left-panel {
  width: 280px; background: #fff; border-right: 1px solid #e2e8f0;
  display: flex; flex-direction: column; flex-shrink: 0;
}
.panel-header {
  font-size: 13px; font-weight: 700; color: #475569; text-transform: uppercase;
  letter-spacing: 0.5px; padding: 16px 20px 10px;
  border-bottom: 1px solid #f1f5f9;
}
#tree-nav { flex: 1; overflow-y: auto; padding: 8px 0; }
.tree-item {
  display: flex; align-items: center; padding: 6px 20px;
  cursor: pointer; font-size: 13px; color: #334155; transition: background .15s;
  border-left: 3px solid transparent;
}
.tree-item:hover { background: #f8fafc; }
.tree-item.active { background: #eff6ff; border-left-color: #3b82f6; color: #1e40af; font-weight: 600; }
.tree-item .expand { width: 18px; font-size: 10px; color: #94a3b8; flex-shrink: 0; }
.tree-item .dot {
  width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; flex-shrink: 0;
}
.tree-item.level-0 { padding-left: 12px; font-weight: 600; font-size: 14px; }
.tree-item.level-1 { padding-left: 28px; }
.tree-item.level-2 { padding-left: 44px; }
.tree-item.level-3 { padding-left: 60px; font-size: 12px; }
.tree-item.hidden { display: none; }

/* Center */
#center-panel {
  flex: 1; display: flex; flex-direction: column; background: #fff;
  margin: 12px; border-radius: 8px; border: 1px solid #e2e8f0; overflow: hidden;
}
.chart-tabs {
  display: flex; gap: 0; border-bottom: 1px solid #e2e8f0; flex-shrink: 0;
}
.chart-tabs .tab {
  padding: 10px 20px; border: none; background: none;
  cursor: pointer; font-size: 13px; color: #64748b;
  border-bottom: 2px solid transparent; transition: all .2s;
}
.chart-tabs .tab.active { color: #3b82f6; border-bottom-color: #3b82f6; font-weight: 600; }
.chart-tabs .tab:hover { color: #1e293b; }
#chart-container { flex: 1; min-height: 400px; }

/* Right */
#right-panel {
  flex: 1; min-width: 380px; background: #f8fafc; border-left: 1px solid #e2e8f0;
  display: flex; flex-direction: column;
}
#detail-title { padding: 14px 20px; font-weight: 700; font-size: 14px; background:#fff; border-bottom:1px solid #e2e8f0; }
#detail-content { flex: 1; overflow-y: auto; padding: 12px 0 60px 0; }
#detail-content .hint { color: #94a3b8; font-size: 14px; text-align: center; margin-top: 40px; }
/* Section cards */
.detail-card {
  background: #fff; border-radius: 8px; margin: 0 16px 10px 16px;
  border: 1px solid #e2e8f0; overflow: hidden;
  /* responsive — no max-width */
}
.detail-card .card-hdr {
  padding: 10px 14px; font-size: 12px; font-weight: 700; color: #475569;
  background: #f8fafc; border-bottom: 1px solid #f1f5f9;
  cursor: pointer; user-select: none; display: flex; align-items: center; gap: 6px;
}
.detail-card .card-hdr .icon { font-size: 14px; }
.detail-card .card-hdr .arrow { margin-left: auto; font-size: 10px; color: #94a3b8; transition: transform .2s; }
.detail-card .card-hdr.open .arrow { transform: rotate(90deg); }
.detail-card .card-body { padding: 12px 14px; display: none; }
.detail-card .card-body.open { display: block; }
/* Card variants */
.card-def { border-left: 3px solid #3b82f6; }
.card-metrics { border-left: 3px solid #6366f1; }
.card-supply { border-left: 3px solid #f59e0b; }
.card-value { border-left: 3px solid #10b981; }
.card-compete { border-left: 3px solid #ef4444; }
.card-trends { border-left: 3px solid #8b5cf6; }
.card-evidence { border-left: 3px solid #64748b; }
.card-companies { border-left: 3px solid #06b6d4; }
.card-relations { border-left: 3px solid #ec4899; }
/* In-card elements */
.def-tag {
  display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 10px;
  font-weight: 600; margin-bottom: 6px;
}
.metric-row { display: flex; gap: 8px; }
.metric-box {
  flex: 1; background: #f8fafc; border-radius: 8px; padding: 12px; text-align: center;
}
.metric-box .m-val { font-size: 20px; font-weight: 700; color: #1e293b; }
.metric-box .m-lbl { font-size: 10px; color: #94a3b8; margin-top: 2px; }
.progress-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.progress-row .p-lbl { width: 60px; font-size: 11px; color: #64748b; text-align: right; flex-shrink: 0; }
.progress-row .p-bar {
  flex: 1; height: 18px; background: #f1f5f9; border-radius: 4px; overflow: hidden; position: relative;
}
.progress-row .p-bar .p-fill { height: 100%; border-radius: 4px; position: absolute; left: 0; top: 0; }
.progress-row .p-val { width: 40px; font-size: 10px; font-weight: 600; color: #334155; flex-shrink: 0; }
.trend-list { list-style: none; padding: 0; margin: 0; }
.trend-list li {
  padding: 4px 0; font-size: 12px; color: #475569; line-height: 1.5;
  border-bottom: 1px dotted #f1f5f9;
}
.trend-list li:last-child { border-bottom: none; }
.trend-list li::before { content: '▸ '; color: #8b5cf6; font-size: 10px; }
.evidence-text { font-size: 11px; color: #64748b; line-height: 1.6; }
.conduction-box {
  background: #fffbeb; border: 1px solid #fde68a; border-radius: 6px;
  padding: 10px 12px; font-size: 11px; color: #92400e; line-height: 1.6;
}

.detail-section { margin-bottom: 20px; }
.detail-section h3 {
  font-size: 12px; color: #94a3b8; text-transform: uppercase;
  letter-spacing: 0.5px; margin-bottom: 8px;
}
.detail-name { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.detail-desc { font-size: 13px; color: #64748b; line-height: 1.6; margin-bottom: 12px; }
.detail-metrics {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px;
}
.metric-item {
  background: #f8fafc; border-radius: 6px; padding: 10px;
}
.metric-item .label { font-size: 11px; color: #94a3b8; }
.metric-item .value { font-size: 16px; font-weight: 700; color: #1e293b; }

.company-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 0; border-bottom: 1px solid #f1f5f9; font-size: 13px;
}
.company-row .cname { font-weight: 600; color: #1e293b; }
.company-row .ticker { color: #64748b; font-family: 'SF Mono',monospace; font-size: 12px; }
.company-row .role {
  font-size: 11px; padding: 1px 6px; border-radius: 4px;
}
.role-lead { background: #dcfce7; color: #16a34a; }
.role-secondary { background: #f0f9ff; color: #0369a1; }
.role-concept { background: #fef3c7; color: #d97706; }

.relation-list { list-style: none; }
.relation-list li {
  font-size: 12px; padding: 4px 0; color: #475569;
  display: flex; align-items: center; gap: 6px;
}
.relation-list .rel-badge {
  font-size: 10px; padding: 1px 5px; border-radius: 3px;
  color: #fff; white-space: nowrap; flex-shrink: 0;
}
/* Foldable sections */
.fold-section { border-bottom: 1px solid #f1f5f9; }
.fold-hdr {
  padding: 10px 0; font-size: 13px; font-weight: 600; color: #334155;
  cursor: pointer; user-select: none; display: flex; align-items: center;
}
.fold-hdr::before { content: '▸ '; width: 16px; font-size: 10px; }
.fold-hdr.active::before { content: '▾ '; }
.fold-body { display: none; padding-bottom: 10px; }
</style>
</head>

<div id="app">

</div>

<script>
var DATA, LC, RC, currentChart='treemap', selectedSlug=null, selectedType=null, chartInstance=null;

(function() {
  try {
    var el = document.getElementById('kg-data');
    if (!el) throw new Error('kg-data element not found');
    DATA = JSON.parse(el.textContent);
    LC = DATA.layerColors || {};
    RC = DATA.relationColors || {};
  } catch(e) { document.body.innerHTML += '<div style="position:fixed;top:0;left:0;right:0;background:red;color:#fff;padding:8px;z-index:9999">JSON Error: '+e.message+'</div>'; }
})();

document.addEventListener('DOMContentLoaded', function() {
  try { buildTreeNav(); } catch(e) { document.getElementById('tree-nav').innerHTML = '<div style="color:red;padding:12px">Tree Error: '+e.message+'</div>'; }
  try { renderChart('treemap'); } catch(e) { document.getElementById('chart-container').innerHTML = '<div style="color:red;padding:40px">Chart Error: '+e.message+'</div>'; }
  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].addEventListener('click', function() { switchTab(this); });
  }
});

function switchTab(tab) {
  var all = document.querySelectorAll('.tab');
  for (var i = 0; i < all.length; i++) all[i].classList.remove('active');
  tab.classList.add('active');
  renderChart(tab.getAttribute('data-chart'));
}

// ── Tree ────────────────────────────────────────────────
function buildTreeNav() {
  var nav = document.getElementById('tree-nav');
  var tree = DATA.tree;
  if (!tree || !tree.children || !tree.children.length) { nav.innerHTML = '<div style="padding:12px;color:#94a3b8">(empty)</div>'; return; }
  nav.innerHTML = '';
  for (var li = 0; li < tree.children.length; li++) {
    (function(layer) {
      var div = makeTreeItem(layer.name, 'layer', 1, LC[layer.level]||'#999', layer, true);
      nav.appendChild(div);
      if (layer.children && layer.children.length) {
        for (var si = 0; si < layer.children.length; si++) {
          (function(seg) {
            var sdiv = makeTreeItem(seg.name, 'segment', 2, LC[layer.level]||'#999', seg, false);
            nav.appendChild(sdiv);
            if (seg.children && seg.children.length) {
              for (var ssi = 0; ssi < seg.children.length; ssi++) {
                (function(sub) {
                  var ssdiv = makeTreeItem(sub.name, 'segment', 3, LC[layer.level]||'#999', sub, false);
                  nav.appendChild(ssdiv);
                })(seg.children[ssi]);
              }
            }
          })(layer.children[si]);
        }
      }
    })(tree.children[li]);
  }
}

function makeTreeItem(name, type, level, color, data, isBold) {
  var div = document.createElement('div');
  div.className = 'tree-item';
  div.style.cursor = 'pointer';
  div.style.padding = '6px 12px';
  if (level === 1) { div.style.paddingLeft = '12px'; div.style.fontWeight = '600'; div.style.fontSize = '14px'; }
  else if (level === 2) { div.style.paddingLeft = '32px'; div.style.fontSize = '13px'; }
  else { div.style.paddingLeft = '48px'; div.style.fontSize = '12px'; }

  if (level > 1) {
    var dot = document.createElement('span');
    dot.style.display = 'inline-block';
    dot.style.width = '10px';
    dot.style.height = '10px';
    dot.style.borderRadius = '50%';
    dot.style.background = color;
    dot.style.marginRight = '8px';
    div.appendChild(dot);
  }
  div.appendChild(document.createTextNode(name));

  div.addEventListener('click', function(e) {
    e.stopPropagation();
    var items = document.querySelectorAll('.tree-item');
    for (var i = 0; i < items.length; i++) items[i].classList.remove('active');
    div.classList.add('active');
    selectedSlug = data.slug;
    selectedType = type;
    if (type === 'segment') { showSegmentDetail(data); renderChart(currentChart); }
  });
  return div;
}

// ── Chart ───────────────────────────────────────────────
function renderChart(type) {
  currentChart = type;
  var dom = document.getElementById('chart-container');
  if (chartInstance) { chartInstance.dispose(); chartInstance = null; }
  if (typeof echarts === 'undefined') { dom.innerHTML = '<div style="padding:40px;color:#ef4444">ECharts not loaded</div>'; return; }

  dom.style.minHeight = '500px';
  chartInstance = echarts.init(dom);

  if (type === 'treemap') renderTreemap();
  else if (type === 'graph') renderGraph();
  else if (type === 'sankey') renderSankey();

  // Highlight selected node after render
  highlightSelected();

  chartInstance.on('click', function(params) {
    if (!params.data || !params.data.slug) return;
    // Update left tree active state
    updateTreeActive(params.data.slug);
    if (params.data.type === 'segment') {
      var seg = findBySlug(params.data.slug, 'segment');
      if (seg) showSegmentDetail(seg);
    } else if (params.data.type === 'company') {
      var comp = findBySlug(params.data.slug, 'company');
      if (comp) showCompanyDetail(comp);
    }
    selectedSlug = params.data.slug;
    selectedType = params.data.type;
    highlightSelected();
  });
}

function highlightSelected() {
  if (!chartInstance || !selectedSlug) return;
  // Clear previous highlights
  chartInstance.dispatchAction({ type: 'downplay', seriesIndex: 0 });
  // Resolve slug to display name
  var highlightName = selectedSlug;
  if (selectedType === 'segment') {
    var seg = findBySlug(selectedSlug, 'segment');
    if (seg) highlightName = seg.name;
  } else if (selectedType === 'company') {
    var comp = findBySlug(selectedSlug, 'company');
    if (comp) highlightName = comp.name;
  }
  chartInstance.dispatchAction({ type: 'highlight', seriesIndex: 0, name: highlightName });
}

function updateTreeActive(slug) {
  // Remove active from all tree items
  var items = document.querySelectorAll('.tree-item');
  for (var i = 0; i < items.length; i++) items[i].classList.remove('active');
  // We can't easily find the matching tree item by slug,
  // so just keep the click-based active state for tree items
}

function findBySlug(slug, type) {
  if (type === 'segment') {
    var segs = DATA.segments || [];
    for (var i = 0; i < segs.length; i++) { if (segs[i].slug === slug) return segs[i]; }
  } else {
    var segs2 = DATA.segments || [];
    for (var i = 0; i < segs2.length; i++) {
      var comps = segs2[i].companies || [];
      for (var j = 0; j < comps.length; j++) { if (comps[j].slug === slug) return comps[j]; }
    }
  }
  return null;
}

// ── Treemap ─────────────────────────────────────────────
function renderTreemap() {
  var segs = DATA.segments || [];
  // Build parent→children map
  var childrenMap = {};
  var allSegs = {};
  for (var i = 0; i < segs.length; i++) {
    var s = segs[i];
    allSegs[s.slug] = s;
    // parent_id is stored in the raw data but not exported.
    // We use parent_id from the seg object if available.
    // For now, use tree structure to determine nesting
  }

  // Use tree data for proper nesting
  var tree = DATA.tree;
  var treemapRoot = { name: 'AI Computing', children: [] };

  if (tree && tree.children) {
    for (var li = 0; li < tree.children.length; li++) {
      var layer = tree.children[li];
      if (layer.children) {
        for (var si = 0; si < layer.children.length; si++) {
          var seg = layer.children[si];
          var node = makeTreemapNode(seg);
          treemapRoot.children.push(node);
        }
      }
    }
  }

  // Fallback: use flat segments
  if (!treemapRoot.children.length) {
    for (var j = 0; j < segs.length; j++) {
      var fs = segs[j];
      if (!fs.tAM_bn) continue;
      treemapRoot.children.push(makeTreemapNode(fs));
    }
  }

  chartInstance.setOption({
    tooltip: {
      formatter: function(p) {
        if (!p.data || !p.data.tAM_bn) return p.name;
        return '<b>'+p.name+'</b><br/>Market: $'+p.data.tAM_bn+'B<br/>CAGR: '+p.data.cagr_pct+'%<br/>Margin: '+p.data.margin_profile+'<br/>Companies: '+p.data.company_count;
      }
    },
    series: [{
      type: 'treemap', roam: false, width: '100%', height: '100%',
      nodeClick: false,
      label: { show: true, formatter: '{b}', fontSize: 16, ellipsis: true, overflow: 'truncate' },
      upperLabel: { show: false },
      itemStyle: { borderColor: '#fff', borderWidth: 2 },
      emphasis: {
        itemStyle: { borderColor: '#1e40af', borderWidth: 3, shadowBlur: 8, shadowColor: 'rgba(30,64,175,0.4)' },
        label: { fontWeight: 'bold', fontSize: 20 }
      },
      levels: [
        { itemStyle: { gapWidth: 3 }, label: { fontSize: 16 } },
        { itemStyle: { gapWidth: 2 }, label: { fontSize: 14 } },
        { itemStyle: { gapWidth: 1 }, label: { fontSize: 12 } },
      ],
      data: [treemapRoot]
    }]
  });
}

function makeTreemapNode(seg) {
  var node = {
    name: seg.name, value: seg.tAM_bn || 1, slug: seg.slug, type: 'segment',
    itemStyle: { color: LC[seg.layer_id] || '#999' },
    tAM_bn: seg.tAM_bn, cagr_pct: seg.cagr_pct, margin_profile: seg.margin_profile || '',
    company_count: (seg.companies||[]).length
  };
  if (seg.children && seg.children.length) {
    node.children = [];
    for (var i = 0; i < seg.children.length; i++) {
      node.children.push(makeTreemapNode(seg.children[i]));
    }
  }
  return node;
}

// ── Graph ────────────────────────────────────────────────
function renderGraph() {
  var segs = DATA.segments || [];
  var rels = [];
  var allRels = DATA.relations || [];
  for (var r = 0; r < allRels.length; r++) rels.push(allRels[r]);

  // Focus filter
  if (selectedSlug && selectedType === 'segment') {
    var related = {};
    related[selectedSlug] = true;
    for (var ri = 0; ri < rels.length; ri++) {
      if (rels[ri].from_slug === selectedSlug) related[rels[ri].to_slug] = true;
      if (rels[ri].to_slug === selectedSlug) related[rels[ri].from_slug] = true;
    }
    var filteredSegs = [];
    for (var si = 0; si < segs.length; si++) { if (related[segs[si].slug]) filteredSegs.push(segs[si]); }
    segs = filteredSegs;
    var filteredRels = [];
    for (var rj = 0; rj < rels.length; rj++) { if (related[rels[rj].from_slug] && related[rels[rj].to_slug]) filteredRels.push(rels[rj]); }
    rels = filteredRels;
  }

  var nodes = [];
  var slugMap = {};
  for (var ni = 0; ni < segs.length; ni++) {
    var s = segs[ni];
    slugMap[s.slug] = s;
    nodes.push({
      id: s.slug, name: s.name, slug: s.slug, type: 'segment',
      symbolSize: Math.max(18, Math.min(50, (s.tAM_bn||3) * 0.4)),
      itemStyle: { color: LC[s.layer_id] || '#999' },
      category: (s.layer_id||1) - 1,
      label: { show: true, fontSize: 10, formatter: '{b}' }
    });
  }

  var links = [];
  var seenLinks = {};
  for (var li = 0; li < rels.length; li++) {
    var rel = rels[li];
    var key = rel.from_slug + '|' + rel.to_slug + '|' + rel.relation_type;
    if (seenLinks[key]) continue;
    seenLinks[key] = true;
    if (!slugMap[rel.from_slug] && !slugMap[rel.to_slug]) continue;
    links.push({
      source: rel.from_slug, target: rel.to_slug,
      lineStyle: { color: RC[rel.relation_type] || '#999', width: Math.max(1, (rel.strength||1)*0.6), opacity: 0.7 },
      label: { show: false }
    });
  }

  var layers = DATA.layers || [];
  var categories = [];
  for (var ci = 0; ci < layers.length; ci++) {
    categories.push({ name: layers[ci][1], itemStyle: { color: LC[layers[ci][0]] || '#999' } });
  }

  chartInstance.setOption({
    tooltip: { formatter: function(p) { return p.data.type==='segment' ? '<b>'+p.name+'</b>' : p.name; } },
    legend: { data: (function(){var d=[];for(var i=0;i<categories.length;i++)d.push(categories[i].name);return d;})(), bottom: 0, textStyle: { fontSize: 11 } },
    series: [{
      type: 'graph', layout: 'force', roam: true, draggable: true,
      categories: categories,
      force: { repulsion: 300, edgeLength: [80, 200], gravity: 0.15 },
      data: nodes, links: links,
      lineStyle: { opacity: 0.7, curveness: 0.15 },
      emphasis: { focus: 'adjacency', lineStyle: { width: 3 } }
    }]
  });
}

// ── Sankey ───────────────────────────────────────────────
function renderSankey() {
  var allRels = DATA.relations || [];
  var sankeyRels = [];
  for (var i = 0; i < allRels.length; i++) {
    var r = allRels[i];
    if (r.from_type === 'segment' && r.to_type === 'segment' &&
        r.relation_type === 'supplies_to') {
      sankeyRels.push(r);
    }
  }

  // Remove cycles: keep only highest-strength edge for any pair (undirected)
  var edgeMap = {};
  var cleanRels = [];
  for (var j = 0; j < sankeyRels.length; j++) {
    var rel = sankeyRels[j];
    var a = rel.from_name||rel.from_slug;
    var b = rel.to_name||rel.to_slug;
    var key = a < b ? a + '|||' + b : b + '|||' + a;
    var existing = edgeMap[key];
    if (!existing || (rel.strength||0) > (existing.strength||0)) {
      edgeMap[key] = rel;
    }
  }
  for (var k in edgeMap) { if (edgeMap.hasOwnProperty(k)) cleanRels.push(edgeMap[k]); }

  var nameSet = {};
  var links = [];
  for (var jj = 0; jj < cleanRels.length; jj++) {
    var rel2 = cleanRels[jj];
    nameSet[rel2.from_name||rel2.from_slug] = true;
    nameSet[rel2.to_name||rel2.to_slug] = true;
    links.push({
      source: rel2.from_name||rel2.from_slug, target: rel2.to_name||rel2.to_slug,
      value: rel2.strength||1,
      lineStyle: { color: RC[rel2.relation_type]||'#999', opacity: 0.4 }
    });
  }

  var nodes = [];
  for (var key2 in nameSet) {
    if (nameSet.hasOwnProperty(key2)) nodes.push({ name: key2 });
  }

  chartInstance.setOption({
    tooltip: { trigger: 'item', triggerOn: 'mousemove' },
    series: [{
      type: 'sankey', emphasis: { focus: 'adjacency' },
      nodeAlign: 'left', data: nodes, links: links,
      nodeWidth: 32, nodeGap: 8,
      label: { fontSize: 11, show: true, distance: 8 }, lineStyle: { curveness: 0.5, opacity: 0.4 }
    }]
  });
}

function showSegmentDetail(seg) {

  // Helper: render text with **bold** markers and | paragraph splits

  // 3. Value Chain — capped bars + context
  if (seg.cost_share_pct || seg.profit_pool_pct) {
    var vcBody = '';
    var ctx = seg.cost_share_context || seg.profit_pool_context || '';
    if (ctx) vcBody += '<div style="font-size:11px;color:#64748b;margin-bottom:8px">参考价值链: <b style="color:#334155">'+ctx+'</b></div>';

  // 4. Supply Chain + Conduction — 3 clear sections
  if (seg.key_inputs || seg.key_customers || seg.price_conduction) {
    var scBody = '';
    function renderTagList(text, color) {
      if (!text) return '';
      var items = text.split(',');

  function _renderCompeteTable(entries) {
    // entries come pre-split. Each entry: "Name|Share|Note"
    var h = '<table style="width:100%;border-collapse:collapse;font-size:12px;margin-top:4px">';
    h += '<thead><tr style="border-bottom:2px solid #e2e8f0;color:#94a3b8;font-size:10px"><th style="text-align:left;padding:3px 4px;width:28px">#</th><th style="text-align:left;padding:3px 4px">厂商</th><th style="text-align:center;padding:3px 4px;width:55px">份额</th><th style="text-align:left;padding:3px 4px">备注</th></tr></thead><tbody>';
    for (var i = 0; i < entries.length; i++) {
      var fields = entries[i].split('|');
      var name = fields[0].trim();
      var share = (fields.length > 1 ? fields[1].trim() : '');
      var note = (fields.length > 2 ? fields[2].trim() : '');

  // 5. Competition Landscape — parse Name|Share|Note format with || global/china split
  if (seg.competition_landscape) {
    var compHTML = '';
    var text = seg.competition_landscape;
    
    // Find section boundaries using indexOf for multi-byte emoji safety
    var sections = [];
    var markers = [{icon:'⚔',label:'⚔'},{icon:'🔒',label:'🔒'},{icon:'📐',label:'📐'}];
    // Collect all marker positions
    var positions = [];
    for (var mi = 0; mi < markers.length; mi++) {

        if (globalPart) {

      } else if (sec.icon === '🔒') {

          if (colonIdx < 0) colonIdx = b.indexOf(':');
          var bLabel = colonIdx > 0 ? b.substring(0, colonIdx) : b;

        var gapParts = gapText.split(/[。；;]/);

        if (hasMulti) {
          for (var gi = 0; gi < gapParts.length; gi++) {
            var g = gapParts[gi].trim();
            if (!g) continue;
            var gColon = g.indexOf('：');
            if (gColon < 0) gColon = g.indexOf(':');

            var gDesc = gColon > 0 ? g.substring(gColon+1) : g;
            compHTML += '<tr style="border-bottom:1px solid #f8fafc">';
            compHTML += '<td style="padding:4px 4px;font-weight:600;color:#334155;vertical-align:top">'+gLabel+'</td>';
            compHTML += '<td style="padding:4px 4px;color:#475569;vertical-align:top;font-size:11px;line-height:1.5">'+gDesc+'</td>';
            compHTML += '</tr>';
          }
        } else {
          compHTML += '<tr><td style="padding:4px 4px;font-weight:600;color:#334155;vertical-align:top">技术代差</td><td style="padding:4px 4px;color:#475569;vertical-align:top;font-size:11px;line-height:1.5">'+gapText+'</td></tr>';
        }
        compHTML += '</tbody></table>';
      }
      compHTML += '</div>';
    }
    html += makeCard('⚔️ 竞争格局', '', 'card-compete', compHTML, '中-低', '券商研报/定性分析(各section已标注)');
  }  // 6. Key Trends
  if (seg.key_trends) {
    var trendHTML = '';
    var trendSep = seg.key_trends.indexOf('|') > 0 ? '|' : ';';
    var trends = seg.key_trends.split(trendSep);
    for (var ti = 0; ti < trends.length; ti++) {
      var t = trends[ti].trim();
      if (!t) continue;
      var numMatch = t.match(/^(\d+)\)\s*(.+)/);
      if (numMatch) {
        var rest = numMatch[2];
        // Split title from explanation by ——
        var dashIdx = rest.indexOf('——');
        var titlePart = dashIdx > 0 ? rest.substring(0, dashIdx).trim() : rest;
        var detailPart = dashIdx > 0 ? rest.substring(dashIdx+2).trim() : '';
        trendHTML += '<div style="padding:8px 0;border-bottom:1px solid #f1f5f9">';
        trendHTML += '<div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:'+(detailPart?'4px':'0')+'">';
        trendHTML += '<div style="background:#8b5cf6;color:#fff;border-radius:50%;min-width:20px;width:20px;height:20px;text-align:center;line-height:20px;font-size:10px;font-weight:700;flex-shrink:0;margin-top:1px">'+numMatch[1]+'</div>';
        trendHTML += '<div style="font-weight:600;font-size:12px;color:#1e293b;line-height:1.5">'+titlePart+'</div>';
        trendHTML += '</div>';
        if (detailPart) trendHTML += '<div style="margin-left:28px;font-size:11px;color:#64748b;line-height:1.7">'+detailPart+'</div>';
        trendHTML += '</div>';
      } else {
        trendHTML += '<div style="padding:3px 0;font-size:11px;color:#475569;line-height:1.6">▸ '+t+'</div>';
      }
    }
    html += makeCard('🚀 关键趋势', '', 'card-trends', trendHTML, '低', '行业分析/定性判断');
  }

  // 7. Companies table
  var companies = seg.companies || [];
  if (companies.length) {
    var compBody = '<table style="width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed">';
    compBody += '<colgroup><col style="width:auto"><col style="width:70px"><col style="width:55px"><col style="width:65px"></colgroup>';
    compBody += '<thead><tr style="border-bottom:2px solid #e2e8f0;color:#64748b;font-size:10px;text-transform:uppercase">';
    compBody += '<th style="text-align:left;padding:6px 4px">公司</th>';
    compBody += '<th style="text-align:center;padding:6px 4px">代码</th>';
    compBody += '<th style="text-align:center;padding:6px 4px">营收%</th>';
    compBody += '<th style="text-align:center;padding:6px 4px">角色</th>';
    compBody += '</tr></thead><tbody>';
    for (var ci = 0; ci < companies.length; ci++) {
      var c = companies[ci];
      var roleBadge = '';
      if (c.role === '龙头') roleBadge = '<span style="background:#dcfce7;color:#16a34a;padding:1px 5px;border-radius:3px;font-size:10px;white-space:nowrap">龙头</span>';
      else if (c.role === '概念股') roleBadge = '<span style="background:#fef3c7;color:#d97706;padding:1px 5px;border-radius:3px;font-size:10px;white-space:nowrap">⚠概念</span>';
      else roleBadge = '<span style="background:#f0f9ff;color:#0369a1;padding:1px 5px;border-radius:3px;font-size:10px;white-space:nowrap">二线</span>';
      compBody += '<tr style="border-bottom:1px solid #f1f5f9;cursor:pointer" data-slug="'+c.slug+'" onclick="showCompanyBySlug(this.getAttribute(&apos;data-slug&apos;))">';
      compBody += '<td style="padding:6px 4px;font-weight:500;color:#1e293b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+c.name+'</td>';
      compBody += '<td style="padding:6px 4px;text-align:center;color:#64748b;font-family:monospace;font-size:10px">'+(c.ticker||'-')+'</td>';
      compBody += '<td style="padding:6px 4px;text-align:center;color:#64748b;font-size:10px">'+(c.revenue_pct||'')+'%</td>';
      compBody += '<td style="padding:6px 4px;text-align:center">'+roleBadge+'</td>';
      compBody += '</tr>';
    }
    compBody += '</tbody></table>';
    html += makeCard('🏢 公司列表 ('+companies.length+'家)', '', 'card-companies', compBody, '高', '公开市场数据/yfinance');
  }

  // 8. Relations
  var allRels = DATA.relations || [];
  var segRels = [];
  for (var ri = 0; ri < allRels.length; ri++) {
    var r = allRels[ri];
    if ((r.from_type === 'segment' && r.from_slug === seg.slug) || (r.to_type === 'segment' && r.to_slug === seg.slug)) {
      segRels.push(r);
    }
  }
  if (segRels.length) {
    var relBody = '';
    for (var rj = 0; rj < segRels.length && rj < 20; rj++) {
      var rel = segRels[rj];
      var otherName = rel.from_slug === seg.slug ? rel.to_name : rel.from_name;
      var otherSlug = rel.from_slug === seg.slug ? rel.to_slug : rel.from_slug;
      var otherType = rel.from_slug === seg.slug ? rel.to_type : rel.from_type;
      var color = RC[rel.relation_type] || '#999';
      var label = rel.relation_type.replace(/_/g, ' ');
      var dir = rel.from_slug === seg.slug ? '→' : '←';
      relBody += '<div style="display:flex;align-items:center;padding:3px 0;font-size:11px;gap:6px">';
      relBody += '<span style="background:'+color+';color:#fff;padding:0 5px;border-radius:3px;font-size:9px;white-space:nowrap;flex-shrink:0">'+label+'</span>';
      relBody += '<span style="color:#94a3b8;flex-shrink:0">'+dir+'</span>';
      relBody += '<span style="cursor:pointer;color:#3b82f6" data-slug="'+otherSlug+'" data-etype="'+otherType+'" onclick="clickRel(this.getAttribute(&apos;data-slug&apos;),this.getAttribute(&apos;data-etype&apos;))">'+otherName+'</span>';
      relBody += '</div>';
    }
    html += makeCard('🔗 关联关系 ('+segRels.length+'条)', '', 'card-relations', relBody, '中', '公司年报/产业链分析');
  }

  // 9. Research Evidence — always last
  if (seg.research_evidence) {
    var evBody = '';
    var evItems = seg.research_evidence.split(';');
    for (var ei = 0; ei < evItems.length; ei++) {
      var ev = evItems[ei].trim();
      if (!ev) continue;
      evBody += '<div style="font-size:11px;color:#64748b;padding:3px 0;line-height:1.6">📄 '+ev+'</div>';
    }
    html += makeCard('📚 研报与证据', '', 'card-evidence', evBody, '高', '直接引用公开报告');
  }

  content.innerHTML = html;

  // Bind card toggle: click header → toggle body
  var headers = content.querySelectorAll('.card-hdr');
  for (var hi = 0; hi < headers.length; hi++) {
    headers[hi].addEventListener('click', function() {
      this.classList.toggle('open');
      var body = this.nextElementSibling;
      if (body) body.classList.toggle('open');
    });
  }
}

function toggleFold(hdr) {
  hdr.classList.toggle('active');
  var body = hdr.nextElementSibling;
  body.style.display = body.style.display === 'block' ? 'none' : 'block';
}

function showCompanyDetail(comp) {
  document.getElementById('detail-title').textContent = comp.name;
  var content = document.getElementById('detail-content');
  var html = '<div class="detail-section">';
  html += '<div class="detail-name">'+comp.name+'</div>';
  if (comp.ticker) html += '<span class="ticker">'+comp.ticker+' · '+(comp.exchange||'')+'</span>';
  if (comp.role) {
    var rc = 'role-secondary';
    if (comp.role === '龙头') rc = 'role-lead';
    else if (comp.role === '概念股') rc = 'role-concept';
    html += ' <span class="role '+rc+'" style="display:inline-block;margin-left:4px">'+comp.role+'</span>';
  }
  if (comp.revenue_pct) html += '<div style="font-size:13px;color:#64748b;margin-top:4px">Revenue: '+comp.revenue_pct+'%</div>';
  html += '</div>';
  content.innerHTML = html;
}

function showCompanyBySlug(slug) {
  var comp = findBySlug(slug, 'company');
  if (comp) showCompanyDetail(comp);
}

function clickRel(slug, type) {
  if (type === 'segment') {
    var seg = findBySlug(slug, 'segment');
    if (seg) {
      selectedSlug = slug; selectedType = 'segment';
      showSegmentDetail(seg);
      // Switch to 关系网络 tab and render
      var tabs = document.querySelectorAll('.tab');
      for (var ti = 0; ti < tabs.length; ti++) {
        tabs[ti].classList.remove('active');
        if (tabs[ti].getAttribute('data-chart') === 'graph') tabs[ti].classList.add('active');
      }
      renderChart('graph');
    }
  }
}
</script>
</body>
</html>
