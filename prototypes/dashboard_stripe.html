<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>投资分析报告 · 共识看板</title>
<style>
/* ============================================================
   Stripe Design System — Adapted for Investment Dashboard
   ============================================================ */

:root {
  /* Stripe Core Colors */
  --navy: #061b31;
  --label: #273951;
  --body: #64748d;
  --purple: #533afd;
  --purple-hover: #4434d4;
  --purple-light: #d6d9fc;
  --border: #e5edf5;
  --white: #ffffff;
  --bg: #f6f9fc;

  /* Status Colors */
  --green: #15be53;
  --green-bg: rgba(21,190,83,0.12);
  --green-border: rgba(21,190,83,0.3);
  --amber: #f5a623;
  --amber-bg: rgba(245,166,35,0.12);
  --amber-border: rgba(245,166,35,0.3);
  --red: #ea2261;
  --red-bg: rgba(234,34,97,0.12);
  --red-border: rgba(234,34,97,0.3);

  /* Shadows — Stripe signature blue-tinted */
  --shadow-sm: 0 2px 6px rgba(50,50,93,0.12), 0 1px 3px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 14px rgba(50,50,93,0.18), 0 2px 6px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 28px rgba(50,50,93,0.22), 0 4px 12px rgba(0,0,0,0.1);

  /* Typography */
  --font: 'Inter', -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
  --mono: 'SF Mono', 'Source Code Pro', 'Menlo', monospace;
}

/* Reset & Base */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 16px; -webkit-font-smoothing: antialiased; }

body {
  font-family: var(--font);
  font-weight: 300;
  color: var(--label);
  background: var(--bg);
  line-height: 1.5;
  min-height: 100vh;
}

/* ============================================================
   Layout
   ============================================================ */
.container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

/* ============================================================
   Header / Nav
   ============================================================ */
.topbar {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100;
  backdrop-filter: blur(8px);
  background: rgba(255,255,255,0.92);
}
.topbar-inner {
  max-width: 1200px; margin: 0 auto; padding: 14px 24px;
  display: flex; align-items: center; justify-content: space-between;
}
.topbar-brand {
  font-size: 15px; font-weight: 400; color: var(--navy);
  letter-spacing: -0.3px;
}
.topbar-brand span { color: var(--purple); font-weight: 600; }
.topbar-date {
  font-size: 13px; color: var(--body);
  font-family: var(--mono);
  background: var(--bg); padding: 4px 12px; border-radius: 4px;
}

/* ============================================================
   Hero
   ============================================================ */
.hero {
  padding: 56px 0 40px;
  text-align: center;
}
.hero h1 {
  font-size: 2.5rem; font-weight: 300; color: var(--navy);
  letter-spacing: -0.03em; line-height: 1.15; margin-bottom: 12px;
}
.hero h1 em { font-style: normal; color: var(--purple); }
.hero-sub {
  font-size: 1rem; color: var(--body); max-width: 640px; margin: 0 auto;
  line-height: 1.6;
}

/* ============================================================
   Summary Cards
   ============================================================ */
.summary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 40px;
}
.summary-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 20px 24px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.2s;
}
.summary-card:hover { box-shadow: var(--shadow-md); }
.summary-card .label {
  font-size: 0.75rem; color: var(--body); text-transform: uppercase;
  letter-spacing: 0.06em; margin-bottom: 6px; font-weight: 400;
}
.summary-card .value {
  font-size: 1.75rem; font-weight: 300; color: var(--navy);
  letter-spacing: -0.02em; font-family: var(--mono);
}
.summary-card .sub {
  font-size: 0.75rem; color: var(--body); margin-top: 4px;
}

/* ============================================================
   Section
   ============================================================ */
.section { margin-bottom: 48px; }
.section-title {
  font-size: 1.5rem; font-weight: 300; color: var(--navy);
  letter-spacing: -0.02em; margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.section-title .num {
  color: var(--purple); margin-right: 6px;
}

/* ============================================================
   Table
   ============================================================ */
.table-wrap {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
thead { background: var(--navy); }
thead th {
  padding: 12px 14px;
  text-align: left;
  color: rgba(255,255,255,0.85);
  font-weight: 400;
  font-size: 0.75rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
  transition: background 0.15s;
}
thead th:hover { background: rgba(255,255,255,0.08); }
thead th.sorted { color: #fff; font-weight: 500; }
thead th .sort-arrow { margin-left: 4px; font-size: 0.7em; opacity: 0.5; }
thead th.sorted .sort-arrow { opacity: 1; }

tbody tr { border-top: 1px solid var(--border); cursor: pointer; transition: background 0.15s; }
tbody tr:nth-child(even) { background: #fafbfd; }
tbody tr:hover { background: #f0f3ff; }

tbody td {
  padding: 12px 14px;
  vertical-align: middle;
  font-variant-numeric: tabular-nums;
}

/* Cell styles */
.symbol-cell { font-weight: 500; color: var(--navy); font-family: var(--mono); font-size: 0.8rem; }
.company-cell { color: var(--label); max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.score-cell { font-family: var(--mono); font-weight: 400; }
.score-high { color: var(--green); }
.score-mid { color: var(--amber); }
.score-low { color: var(--red); }

/* Rank badge */
.rank-badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; border-radius: 50%;
  font-size: 0.75rem; font-weight: 400; font-family: var(--mono);
}
.rank-1 { background: linear-gradient(135deg, #ffd700, #ffaa00); color: #fff; }
.rank-2 { background: linear-gradient(135deg, #c0c0c0, #999); color: #fff; }
.rank-3 { background: linear-gradient(135deg, #cd7f32, #a0522d); color: #fff; }
.rank-default { background: var(--bg); color: var(--body); }

/* Badges */
.badge {
  display: inline-block; padding: 2px 8px;
  border-radius: 4px; font-size: 0.7rem; font-weight: 400;
  letter-spacing: 0.03em; text-transform: uppercase;
}
.badge-core { background: var(--green-bg); color: #0d7a35; border: 1px solid var(--green-border); }
.badge-tactical { background: var(--amber-bg); color: #b87a15; border: 1px solid var(--amber-border); }
.badge-watch { background: var(--red-bg); color: #c41e4d; border: 1px solid var(--red-border); }

.warning-dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px;
}
.warning-dot.high-div { background: var(--red); }
.warning-dot.tag-conflict { background: var(--amber); }

/* ============================================================
   Tooltips — ⓘ icon + hover popup
   ============================================================ */
.info-tip {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 15px; height: 15px;
  border-radius: 50%;
  font-size: 9px;
  font-weight: 600;
  font-style: normal;
  color: var(--body);
  background: var(--bg);
  border: 1px solid var(--border);
  cursor: help;
  margin-left: 5px;
  vertical-align: middle;
  line-height: 1;
  transition: all 0.15s;
}
.info-tip:hover {
  color: var(--purple);
  border-color: var(--purple-light);
  background: #f0f3ff;
}
.info-tip.active {
  color: var(--purple);
  border-color: var(--purple-light);
  background: #f0f3ff;
}
/* Global tooltip popup — fixed position to escape all overflow clipping */
#globalTooltip {
  position: fixed;
  visibility: hidden;
  opacity: 0;
  background: var(--navy);
  color: rgba(255,255,255,0.92);
  font-size: 0.75rem;
  font-weight: 300;
  line-height: 1.55;
  max-width: 320px;
  padding: 10px 14px;
  border-radius: 6px;
  box-shadow: 0 8px 24px rgba(50,50,93,0.3);
  z-index: 10000;
  pointer-events: none;
  transition: opacity 0.15s, visibility 0.15s;
  text-transform: none;
  letter-spacing: normal;
}
#globalTooltip.visible {
  visibility: visible;
  opacity: 1;
}
#globalTooltip::after {
  content: '';
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  border: 6px solid transparent;
  border-top-color: var(--navy);
}
  transform: none;
}

/* ============================================================
   Detail Cards (expandable)
   ============================================================ */
.detail-panel {
  display: none;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 0 0 6px 6px;
  box-shadow: var(--shadow-sm);
}
.detail-panel.open { display: block; }

.detail-header {
  display: flex; align-items: center; gap: 12px;
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
}
.detail-header .symbol {
  font-family: var(--mono); font-weight: 600; font-size: 1.1rem; color: var(--navy);
}
.detail-header .name { color: var(--label); font-size: 0.9rem; }
.detail-header .score {
  margin-left: auto; font-family: var(--mono); font-size: 1.2rem;
  font-weight: 400; color: var(--purple);
}

.detail-body { padding: 24px; }

.one-liner {
  font-size: 0.9rem; color: var(--body); font-style: italic;
  padding: 10px 16px;
  background: var(--bg); border-left: 3px solid var(--purple-light);
  border-radius: 0 4px 4px 0; margin-bottom: 20px; line-height: 1.6;
}

.detail-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px; margin-bottom: 24px;
}
.detail-metric {
  padding: 12px 16px;
  background: var(--bg);
  border-radius: 4px;
}
.detail-metric .label {
  font-size: 0.7rem; color: var(--body); text-transform: uppercase;
  letter-spacing: 0.05em; margin-bottom: 4px;
}
.detail-metric .value {
  font-size: 1.1rem; font-weight: 400; color: var(--navy);
  font-family: var(--mono);
}

.risk-list { list-style: none; margin-bottom: 20px; }
.risk-list li {
  padding: 6px 0; font-size: 0.85rem; color: var(--label);
  border-bottom: 1px dashed var(--border);
  padding-left: 16px; position: relative;
}
.risk-list li::before {
  content: '•'; position: absolute; left: 0; color: var(--red);
}

.catalyst-text {
  font-size: 0.85rem; color: var(--label); line-height: 1.6;
  padding: 12px 16px;
  background: var(--green-bg);
  border-radius: 4px;
  margin-bottom: 20px;
}
.catalyst-text::before {
  content: '▸ '; color: var(--green); font-weight: 600;
}

.llm-section h4 {
  font-size: 0.8rem; color: var(--body); text-transform: uppercase;
  letter-spacing: 0.05em; margin-bottom: 12px; font-weight: 400;
}
.llm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 10px; }
.llm-item {
  padding: 10px 14px;
  background: var(--bg);
  border-radius: 4px;
  font-size: 0.82rem;
  line-height: 1.5;
}
.llm-item .llm-name {
  font-weight: 500; color: var(--navy); font-size: 0.78rem;
}
.llm-item .llm-score {
  font-family: var(--mono); font-weight: 500; margin-left: 6px;
}
.llm-item .llm-score.high { color: var(--green); }
.llm-item .llm-score.mid { color: var(--amber); }
.llm-item .llm-score.low { color: var(--red); }
.llm-item .llm-tag {
  font-size: 0.65rem; padding: 1px 6px; border-radius: 3px;
  margin-left: 6px; text-transform: uppercase;
}
.llm-item .llm-reason { color: var(--label); margin-top: 4px; }

/* ============================================================
   Position Advice
   ============================================================ */
.position-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 16px;
}
.position-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 24px;
  box-shadow: var(--shadow-sm);
}
.position-card h3 {
  font-size: 1rem; font-weight: 400; color: var(--navy); margin-bottom: 12px;
}
.position-card .symbols {
  font-family: var(--mono); font-size: 0.9rem; color: var(--label);
  margin-bottom: 8px;
}
.position-card .allocation {
  font-size: 0.8rem; color: var(--purple); font-weight: 400;
}
.position-card .reason {
  font-size: 0.8rem; color: var(--body); margin-top: 8px; line-height: 1.5;
}

/* ============================================================
   Footer
   ============================================================ */
.footer {
  text-align: center; padding: 40px 0;
  font-size: 0.75rem; color: var(--body);
  border-top: 1px solid var(--border);
  margin-top: 48px;
}

/* ============================================================
   Utility
   ============================================================ */
.text-center { text-align: center; }
.text-green { color: var(--green); }
.text-amber { color: var(--amber); }
.text-red { color: var(--red); }
.hidden { display: none; }

/* ============================================================
   Responsive
   ============================================================ */
@media (max-width: 768px) {
  .hero h1 { font-size: 1.8rem; }
  .summary-grid { grid-template-columns: repeat(2, 1fr); }
  .llm-grid { grid-template-columns: 1fr; }
  .detail-grid { grid-template-columns: repeat(2, 1fr); }
  .table-wrap { overflow-x: auto; }
  table { min-width: 800px; }
}
</style>
</head>

};

// Global tooltip — event delegation to cover both static and dynamic .info-tip elements
const tipEl = document.getElementById('globalTooltip');

document.addEventListener('mouseover', (e) => {
  const el = e.target.closest('.info-tip');
  if (!el) return;
  const text = TOOLTIPS[el.dataset.tip];
  if (!text) return;
  el.classList.add('active');
  tipEl.textContent = text;
  tipEl.classList.add('visible');
  // Position after browser has sized the tooltip
  requestAnimationFrame(() => {
    const rect = el.getBoundingClientRect();
    const tRect = tipEl.getBoundingClientRect();
    let left = rect.left + rect.width / 2 - tRect.width / 2;
    let top = rect.top - tRect.height - 8;
    if (left < 8) left = 8;
    if (left + tRect.width > window.innerWidth - 8) left = window.innerWidth - tRect.width - 8;
    if (top < 8) top = rect.bottom + 8;
    tipEl.style.left = left + 'px';
    tipEl.style.top = top + 'px';
  });
});

document.addEventListener('mouseout', (e) => {
  const el = e.target.closest('.info-tip');
  if (!el) return;
  // Only hide if we truly left the icon
  if (el.contains(e.relatedTarget)) return;
  el.classList.remove('active');
  tipEl.classList.remove('visible');
});

function initTooltips() {
  // No-op — delegation handles everything
}

// ============================================================
// RENDER ENGINE
// ============================================================

function scoreColor(val) {
  if (val >= 75) return 'score-high';
  if (val >= 60) return 'score-mid';
  return 'score-low';
}

function tagBadge(tag) {
  const cls = tag === 'core' ? 'badge-core' : tag === 'tactical' ? 'badge-tactical' : 'badge-watch';
  const label = tag === 'core' ? '核心' : tag === 'tactical' ? '战术' : '观察';
  return `<span class="badge ${cls}">${label}</span>`;
}

function rankBadge(n) {
  if (n <= 3) return `rank-${n}`;
  return 'rank-default';
}

function scoreClass(val) {
  if (val >= 75) return 'high';
  if (val >= 55) return 'mid';
  return 'low';
}

// Summary Cards
function renderSummary() {
  const picks = DATA.top_picks;
  const weights = DATA.weights;
  const llmP = DATA.llm_participation;

  const coreCount = picks.filter(s => s.tag_consensus === 'core').length;
  const tacticalCount = picks.filter(s => s.tag_consensus === 'tactical').length;
  const highDiv = picks.filter(s => s.high_divergence).length;
  const tagConflict = picks.filter(s => s.tag_conflict).length;

  const cards = [
    { label: '标的数量', value: picks.length, sub: '共识 Top 10' },
    { label: 'Python权重', value: `${(weights.python * 100).toFixed(0)}%`, sub: `LLM权重 ${(weights.llm * 100).toFixed(0)}%` },
    { label: '核心标的', value: coreCount, sub: `战术 ${tacticalCount}` },
    { label: '高分歧', value: highDiv, sub: `tag冲突 ${tagConflict}` },
    { label: 'LLM参与', value: `${llmP.expected}/${llmP.expected}`, sub: llmP.all_complete ? '完整覆盖' : '部分覆盖' },
  ];

  const el = document.getElementById('summaryCards');
  el.innerHTML = cards.map(c => `
    <div class="summary-card">
      <div class="label">${c.label}</div>
      <div class="value">${c.value}</div>
      <div class="sub">${c.sub}</div>
    </div>
  `).join('');
}

// Table
let sortKey = 'final_score';
let sortDir = -1; // -1 = desc, 1 = asc

function renderTable() {
  const picks = [...DATA.top_picks].sort((a, b) => {
    const va = a[sortKey], vb = b[sortKey];
    return (typeof va === 'number' ? va - vb : String(va).localeCompare(String(vb))) * sortDir;
  });

  const tbody = document.getElementById('topBody');
  tbody.innerHTML = picks.map(s => {
    let warnings = '';
    if (s.high_divergence) warnings += '<span class="warning-dot high-div" title="高分歧"></span>';
    if (s.tag_conflict) warnings += '<span class="warning-dot tag-conflict" title="tag冲突"></span>';

    return `
      <tr data-symbol="${s.symbol}" onclick="toggleDetail('${s.symbol}')">
        <td><span class="rank-badge ${rankBadge(s.rank)}">${s.rank}</span></td>
        <td class="symbol-cell">${s.symbol}</td>
        <td class="company-cell" title="${s.company}">${s.company}</td>
        <td style="font-size:0.78rem; color:var(--body)">${s.signal}</td>
        <td class="score-cell ${scoreColor(s.python_score)}">${s.python_score.toFixed(2)}</td>
        <td class="score-cell">${s.factor_total.toFixed(1)}</td>
        <td class="score-cell ${scoreColor(s.llm_avg_conviction)}">${s.llm_avg_conviction.toFixed(2)}</td>
        <td class="score-cell" style="color:var(--body)">${s.conviction_std.toFixed(1)}</td>
        <td class="score-cell ${scoreColor(s.final_score)}"><strong>${s.final_score.toFixed(2)}</strong></td>
        <td>${tagBadge(s.tag_consensus)} ${warnings}</td>
      </tr>
    `;
  }).join('');

  // Update sort indicators
  document.querySelectorAll('#topTable thead th').forEach(th => {
    th.classList.remove('sorted');
    const arrow = th.querySelector('.sort-arrow');
    if (arrow) arrow.textContent = '↓';
    if (th.dataset.sort === sortKey) {
      th.classList.add('sorted');
      if (arrow) arrow.textContent = sortDir === -1 ? '↓' : '↑';
    }
  });
}

// Table sorting
document.querySelectorAll('#topTable thead th[data-sort]').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.sort;
    if (sortKey === key) { sortDir *= -1; }
    else { sortKey = key; sortDir = -1; }
    renderTable();
  });
});

// Detail Panel
let activeSymbol = null;

function toggleDetail(symbol) {
  const container = document.getElementById('detailContainer');
  if (activeSymbol === symbol) {
    container.innerHTML = '';
    activeSymbol = null;
    return;
  }
  activeSymbol = symbol;
  const s = DATA.top_picks.find(p => p.symbol === symbol);
  if (!s) return;

  const llmItems = s.llm_details.map(d => {
    const sc = scoreClass(d.conviction);
    const tagCls = d.tag === 'core' ? 'badge-core' : d.tag === 'tactical' ? 'badge-tactical' : 'badge-watch';
    const tagLabel = d.tag === 'core' ? '核心' : d.tag === 'tactical' ? '战术' : '观察';
    return `
      <div class="llm-item">
        <span class="llm-name">${d.llm}</span>
        <span class="llm-score ${sc}">${d.conviction}</span>
        <span class="llm-tag badge ${tagCls}">${tagLabel}</span>
        <div class="llm-reason">${d.reason}</div>
      </div>
    `;
  }).join('');

  const risks = s.merged_risks.map(r => `<li>${r}</li>`).join('');

  let alerts = '';
  if (s.high_divergence) {
    alerts += `<div style="padding:10px 16px;background:var(--red-bg);border-radius:4px;margin-bottom:16px;font-size:0.82rem;color:#c41e4d;">
      ⚠️ <strong>高分歧</strong>：conviction range=${Math.round(s.conviction_range)}, std=${s.conviction_std.toFixed(2)}（FinalScore已打95折）</div>`;
  }
  if (s.tag_conflict) {
    const avg = s.llm_avg_conviction;
    const expected = avg >= 80 ? 'core' : avg >= 60 ? 'tactical' : 'watch';
    alerts += `<div style="padding:10px 16px;background:var(--amber-bg);border-radius:4px;margin-bottom:16px;font-size:0.82rem;color:#b87a15;">
      ⚡ <strong>tag冲突</strong>：tag_consensus=${s.tag_consensus}, 但avg_conv区间应为${expected}</div>`;
  }

  container.innerHTML = `
    <div class="detail-panel open">
      <div class="detail-header">
        <span class="symbol">${s.symbol}</span>
        <span class="name">${s.company}</span>
        ${tagBadge(s.tag_consensus)}
        <span class="score">${s.final_score.toFixed(2)}</span>
      </div>
      <div class="detail-body">
        ${s.one_liner ? `<div class="one-liner">${s.one_liner}</div>` : ''}
        ${alerts}
        <div class="detail-grid">
          <div class="detail-metric"><div class="label">信号 <i class="info-tip" data-tip="signal">ⓘ</i></div><div class="value" style="font-size:0.85rem">${s.signal}</div></div>
          <div class="detail-metric"><div class="label">Python质量分 <i class="info-tip" data-tip="python_score">ⓘ</i></div><div class="value ${scoreColor(s.python_score)}">${s.python_score.toFixed(2)}</div></div>
          <div class="detail-metric"><div class="label">五因子总分 <i class="info-tip" data-tip="factor_total">ⓘ</i></div><div class="value">${s.factor_total.toFixed(1)}</div></div>
          <div class="detail-metric"><div class="label">因子短板</div><div class="value" style="font-size:0.85rem;color:var(--red)">${s.factor_low}</div></div>
          <div class="detail-metric"><div class="label">LLM均分 <i class="info-tip" data-tip="llm_avg_conviction">ⓘ</i></div><div class="value ${scoreColor(s.llm_avg_conviction)}">${s.llm_avg_conviction.toFixed(2)}</div></div>
          <div class="detail-metric"><div class="label">conviction标准差 <i class="info-tip" data-tip="conviction_std">ⓘ</i></div><div class="value">${s.conviction_std.toFixed(2)}</div></div>
        </div>

        <h4 style="font-size:0.8rem;color:var(--body);margin-bottom:8px;">▸ 催化剂</h4>
        <div class="catalyst-text">${s.best_catalyst}</div>

        <h4 style="font-size:0.8rem;color:var(--body);margin-bottom:8px;">▸ 定性风险 (${s.merged_risks.length}项)</h4>
        <ul class="risk-list">${risks}</ul>

        <div class="llm-section">
          <h4>▸ 9个LLM研判</h4>
          <div class="llm-grid">${llmItems}</div>
        </div>
      </div>
    </div>
  `;
}

// Position Advice
function renderPosition() {
  const picks = DATA.top_picks;
  const core = picks.filter(s => s.tag_consensus === 'core' && !s.tag_conflict);
  const tactical = picks.filter(s => s.tag_consensus === 'tactical' && !s.tag_conflict);
  const conflict = picks.filter(s => s.tag_conflict);

  const groups = [
    { title: '核心持仓 (core)', color: 'var(--green)', symbols: core.map(s => s.symbol), alloc: '不超过15%', reason: '基本面+技术面双优，LLM一致看好' },
    { title: '战术配置 (tactical)', color: 'var(--amber)', symbols: tactical.map(s => s.symbol), alloc: '不超过12%', reason: '定性面中性偏正面，适合波段参与' },
    { title: '存在分歧', color: 'var(--red)', symbols: conflict.map(s => s.symbol), alloc: '小仓位试探', reason: 'tag与conviction不匹配或高分歧' },
  ];

  const el = document.getElementById('positionGrid');
  el.innerHTML = groups.filter(g => g.symbols.length > 0).map(g => `
    <div class="position-card">
      <h3 style="color:${g.color}">${g.title}</h3>
      <div class="symbols">${g.symbols.join('、') || '无'}</div>
      <div class="allocation">建议占比：${g.alloc}</div>
      <div class="reason">${g.reason}</div>
    </div>
  `).join('');
}

// Init
function init() {
  document.getElementById('reportDate').textContent = `报告日期: ${new Date().toLocaleDateString('zh-CN', {year:'numeric',month:'2-digit',day:'2-digit'})}`;
  renderSummary();
  renderTable();
  renderPosition();
  initTooltips();
}

init();
